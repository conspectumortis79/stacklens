<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Security Fix · StackLens</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      background: #f0f0f0;
      color: #1f2328;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .smr-nav {
      background: #1f1f1f; height: 48px; flex-shrink: 0;
      display: flex; align-items: center; padding: 0 16px; gap: 14px;
    }
    .smr-nav-logo {
      display: flex; align-items: center; gap: 6px;
      color: #fff; font-weight: 700; font-size: 15px; flex-shrink: 0;
    }
    .smr-breadcrumb {
      flex: 1; color: #b0b0b0; font-size: 13px;
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    }
    .smr-sim-badge {
      background: #fc6d26; color: #fff;
      padding: 3px 10px; border-radius: 10px; font-size: 11px; font-weight: 600;
      flex-shrink: 0;
    }
    .smr-main { flex: 1; overflow-y: auto; padding: 20px; }
    .smr-inner { max-width: 960px; margin: 0 auto; }
    .smr-mr-card {
      background: #fff; border: 1px solid #dcdcde;
      border-radius: 6px 6px 0 0; padding: 16px 20px;
    }
    .smr-title-row { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
    .smr-title { font-size: 18px; font-weight: 600; color: #1f2328; flex: 1; line-height: 1.4; }
    .smr-iid { color: #64686f; font-size: 16px; flex-shrink: 0; padding-top: 2px; }
    .smr-status-open {
      background: #108548; color: #fff;
      padding: 4px 12px; border-radius: 100px; font-size: 12px; font-weight: 600; flex-shrink: 0;
    }
    .smr-meta {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      font-size: 13px; color: #64686f; margin-top: 10px;
    }
    .smr-branch-tag {
      background: #f5f2ff; color: #6b4fbb;
      border: 1px solid #d9cfff; border-radius: 4px;
      padding: 2px 8px; font-size: 12px; font-family: 'Fira Code', monospace;
    }
    .smr-action-bar {
      background: #fff; border: 1px solid #dcdcde; border-top: none;
      padding: 10px 20px; display: flex; align-items: center; gap: 8px;
    }
    .smr-action-info { flex: 1; font-size: 13px; color: #108548; font-weight: 500; }
    .smr-changes-wrap {
      background: #fff; border: 1px solid #dcdcde; border-top: none;
      border-radius: 0 0 6px 6px; padding: 16px 20px;
    }
    .smr-file-block { margin-bottom: 16px; }
    .smr-file-header {
      background: #f5f2ff; border: 1px solid #d9cfff;
      border-radius: 6px 6px 0 0; padding: 8px 14px;
      font-size: 12px; font-family: 'Fira Code', monospace;
      color: #6b4fbb; font-weight: 600;
    }
    .smr-file-code {
      background: #1e1e1e; color: #d4d4d4;
      border: 1px solid #d9cfff; border-top: none;
      border-radius: 0 0 6px 6px; padding: 0;
      font-size: 12px; font-family: 'JetBrains Mono', 'Fira Code', monospace;
      white-space: pre; overflow-x: auto; max-height: 600px; overflow-y: auto; margin: 0;
    }
    .smr-file-diff { padding: 0; }
    .smr-file-diff span { display: block; padding: 0 14px; min-height: 1.4em; }
    .smr-file-code:not(.smr-file-diff) { padding: 12px 14px; }
    .smr-file-name {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 14px; border: 1px solid #dcdcde; border-radius: 6px;
      margin-bottom: 6px; font-size: 13px; font-family: 'Fira Code', monospace;
      background: #fff;
    }
    .diff-hdr { color: #858585 !important; background: #2a2a2a; }
    .diff-at  { color: #569cd6 !important; background: rgba(86,156,214,.12); }
    .diff-add { color: #89d185 !important; background: rgba(76,175,80,.14); }
    .diff-del { color: #f47067 !important; background: rgba(244,67,54,.14); }
    .diff-ctx { color: #c9c9c9 !important; }
    .smr-error {
      max-width: 520px; margin: 60px auto; text-align: center;
      padding: 32px; background: #fff; border: 1px solid #dcdcde; border-radius: 8px;
    }
    .smr-error i { font-size: 36px; color: #ae1800; display: block; margin-bottom: 12px; }
    .smr-error p { color: #64686f; font-size: 14px; margin-top: 8px; }
  </style>
</head>
<body>
  <nav class="smr-nav">
    <div class="smr-nav-logo">
      <i class="bi bi-shield-check" style="color:#28a745"></i> StackLens Security Fix
    </div>
    <div class="smr-breadcrumb" id="smrBreadcrumb">Lokaler Fix</div>
    <span class="smr-sim-badge">Simuliert · StackLens</span>
  </nav>
  <div class="smr-main">
    <div class="smr-inner" id="smrContent">
      <div class="smr-error">
        <i class="bi bi-hourglass-split"></i>
        <strong>Wird geladen…</strong>
        <p>Fix-Daten werden aus dem Speicher gelesen.</p>
      </div>
    </div>
  </div>

  <script>
    'use strict';

    function esc(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function renderDiffText(diffText) {
      if (!diffText) return '<span style="color:#888;font-style:italic">Keine Änderungen</span>';
      return diffText.split('\n').map(function(line) {
        var escaped = line.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        if (line.startsWith('--- ') || line.startsWith('+++ ')) {
          return '<span class="diff-hdr">' + escaped + '\n</span>';
        } else if (line.startsWith('@@ ')) {
          return '<span class="diff-at">' + escaped + '\n</span>';
        } else if (line.startsWith('+')) {
          return '<span class="diff-add">' + escaped + '\n</span>';
        } else if (line.startsWith('-')) {
          return '<span class="diff-del">' + escaped + '\n</span>';
        } else {
          return '<span class="diff-ctx">' + escaped + '\n</span>';
        }
      }).join('');
    }

    function render(entry) {
      var branchName    = entry.branchName || 'secfix-branch';
      var explanation   = entry.explanation || '';
      var localChanges  = entry.localChanges || [];
      var filesChanged  = entry.filesChanged || [];
      var fileCount     = localChanges.length > 0 ? localChanges.length : filesChanged.length;

      var label      = entry.label || '';
      var labelParts = label.trim().split(/\s+/);
      var fixType    = labelParts[labelParts.length - 1] || 'Security Fix';
      var fixTypeHuman = fixType.replace(/_/g, ' ');

      document.getElementById('smrBreadcrumb').textContent = 'Lokaler Fix · ' + label;
      document.title = 'Security Fix: ' + fixTypeHuman + ' · StackLens';

      var mrCard =
        '<div class="smr-mr-card">' +
          '<div class="smr-title-row">' +
            '<div class="smr-title">fix: Security Fix – ' + esc(fixTypeHuman) + '</div>' +
            '<span class="smr-status-open">Open</span>' +
          '</div>' +
          '<div class="smr-meta">' +
            '<span class="smr-branch-tag">' + esc(branchName) + '</span>' +
            ' → <span class="smr-branch-tag">main</span>' +
            '<span style="color:#64686f">·</span>' +
            '<span>' + fileCount + ' Datei' + (fileCount !== 1 ? 'en' : '') + ' geändert</span>' +
          '</div>' +
        '</div>';

      var actionBar =
        '<div class="smr-action-bar">' +
          '<span class="smr-action-info"><i class="bi bi-check-circle-fill me-1"></i>Lokaler Fix generiert</span>' +
        '</div>';

      var explanationHtml = explanation
        ? '<div style="margin:12px 0 4px;padding:12px 16px;background:#f8f9fa;border:1px solid #dcdcde;border-radius:6px;font-size:13px;color:#444;line-height:1.6;">' + esc(explanation) + '</div>'
        : '';

      var changesBody = '';
      if (localChanges.length > 0) {
        localChanges.forEach(function(c) {
          var isDiff = c.changeType === 'DIFF';
          changesBody +=
            '<div class="smr-file-block">' +
              '<div class="smr-file-header"><i class="bi bi-file-code me-1"></i>' + esc(c.path) + '</div>' +
              '<pre class="smr-file-code' + (isDiff ? ' smr-file-diff' : '') + '">' +
                (isDiff ? renderDiffText(c.code) : esc(c.code)) +
              '</pre>' +
            '</div>';
        });
      } else if (filesChanged.length > 0) {
        filesChanged.forEach(function(f) {
          changesBody += '<div class="smr-file-name"><i class="bi bi-file-code me-1"></i>' + esc(f) + '</div>';
        });
      } else {
        changesBody = '<p style="color:#64686f;font-style:italic;font-size:13px">Keine Dateiänderungen verfügbar.</p>';
      }

      var changesWrap = '<div class="smr-changes-wrap">' + explanationHtml + changesBody + '</div>';

      document.getElementById('smrContent').innerHTML = mrCard + actionBar + changesWrap;
    }

    function showError(msg) {
      document.getElementById('smrContent').innerHTML =
        '<div class="smr-error">' +
          '<i class="bi bi-exclamation-triangle"></i>' +
          '<strong>Fehler beim Laden</strong>' +
          '<p>' + esc(msg) + '</p>' +
        '</div>';
    }

    (function init() {
      var params = new URLSearchParams(window.location.search);
      var key = params.get('k');
      if (!key) { showError('Kein Datenschlüssel in der URL gefunden.'); return; }
      try {
        var raw = localStorage.getItem(key);
        if (!raw) { showError('Fix-Daten nicht gefunden (Schlüssel: ' + key + '). Bitte erneut öffnen.'); return; }
        var entry = JSON.parse(raw);
        localStorage.removeItem(key);
        render(entry);
      } catch(e) {
        showError('Fehler beim Lesen der Fix-Daten: ' + e.message);
      }
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<body>
<th:block th:fragment="styles">
<style>
  :root {
    --su-bg:            var(--app-cream-2);
    --su-paper:         var(--app-cream);
    --su-ink:           var(--app-text);
    --su-muted:         var(--app-text-muted);
    --su-line:          var(--app-border);
    --su-accent:        var(--app-accent-purple);
    --su-accent2:       var(--app-accent-yellow);
    --su-danger:        var(--app-accent-red);
    --su-gitlab: #e24329;
    --su-jira: #0052cc;
    --su-db: #2980b9;
  }

  .su-page { color: var(--su-ink); }

  .su-card {
    background: var(--su-paper);
    border: 1px solid var(--su-line);
    border-radius: 18px;
    padding: 24px;
    box-shadow: 0 8px 24px rgba(0,0,0,.06);
    margin-bottom: 20px;
  }
  .su-card h2 { font-size: 17px; font-weight: 700; margin: 0 0 16px; color: var(--su-ink); }
  #suActiveCard h2 { font-size: 15px; }

  .su-label { font-size: 13px; font-weight: 700; color: var(--su-muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
  .su-input { border: 1.5px solid var(--su-line); border-radius: 10px; padding: 9px 14px; font-size: 15px; width: 100%; background: var(--su-paper); color: var(--su-ink); }
  .su-input:focus { outline: none; border-color: var(--su-accent); box-shadow: 0 0 0 3px rgba(124, 92, 191,.12); }

  .su-btn-primary {
    background: var(--su-accent); color: #fff; border: none;
    border-radius: 10px; padding: 7px 16px; font-size: 13px; font-weight: 700;
    cursor: pointer; transition: opacity .15s;
  }
  .su-btn-primary:hover { opacity: .88; }
  .su-btn-primary:disabled { opacity: .5; cursor: not-allowed; }

  .su-btn-outline {
    background: transparent; color: var(--su-accent);
    border: 1.5px solid var(--su-accent); border-radius: 10px;
    padding: 6px 14px; font-size: 13px; font-weight: 700; cursor: pointer;
    transition: background .15s;
  }
  .su-btn-outline:hover { background: rgba(124, 92, 191,.08); }

  .su-btn-cancel {
    background: var(--su-danger); color: #fff; border: none;
    border-radius: 10px;
    padding: 7px 16px; font-size: 13px; font-weight: 700; cursor: pointer;
    transition: opacity .15s;
  }
  .su-btn-cancel:hover { opacity: .88; }
  .su-btn-cancel:disabled { opacity: .4; cursor: default; pointer-events: none; }

  .su-btn-back {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--su-paper); color: var(--su-ink);
    border: 1.5px solid var(--su-line); border-radius: 10px;
    padding: 8px 16px; font-size: 13px; font-weight: 700; cursor: pointer;
    transition: border-color .15s, background .15s; flex-shrink: 0;
  }
  .su-btn-back:hover { border-color: var(--su-accent); background: var(--su-bg); color: var(--su-accent); }
  .su-view-meta {
    font-size: 13px; color: var(--su-muted); display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .su-view-kw { font-style: italic; font-weight: 700; color: var(--su-ink); }
  .su-view-live {
    display: inline-flex; align-items: center; gap: 5px;
    background: #e8fde8; border: 1px solid #b4dec8; border-radius: 20px;
    padding: 2px 8px; font-size: 11px; font-weight: 700; color: var(--su-accent);
  }
  .su-view-live-dot {
    width: 6px; height: 6px; border-radius: 50%; background: #4ade80;
    animation: su-dot-pulse 1.4s infinite;
  }

  .su-tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .su-tag {
    display: flex; align-items: center; gap: 5px;
    background: var(--su-bg); border: 1.5px solid var(--su-accent);
    border-radius: 20px; padding: 3px 12px 3px 14px;
    font-size: 13px; font-weight: 700; color: var(--su-accent);
  }
  .su-tag-remove {
    background: none; border: none; cursor: pointer; color: var(--su-accent);
    font-size: 15px; line-height: 1; padding: 0 0 0 2px; opacity: .7;
  }
  .su-tag-remove:hover { opacity: 1; }

  .su-source-list {
    border: 1.5px solid var(--su-line); border-radius: 14px;
    overflow: hidden; background: var(--su-paper);
  }
  .su-src-row {
    display: flex; align-items: center; gap: 0;
    border-left: 4px solid transparent;
    transition: background .15s;
    background: var(--su-paper);
  }
  .su-src-row + .su-src-row { border-top: 1px solid var(--su-line); }
  .su-src-row.su-src-gitlab     { border-left-color: var(--su-gitlab); }
  .su-src-row.su-src-db         { border-left-color: var(--su-db); }
  .su-src-row.su-src-jira       { border-left-color: var(--su-jira); }
  .su-src-row.su-src-confluence { border-left-color: #0747a6; }
  .su-src-row.su-src-github     { border-left-color: #24292e; }
  .su-src-row.su-src-disabled   { background: var(--su-bg); }
  .su-src-label {
    display: flex; align-items: center; gap: 8px;
    cursor: pointer; user-select: none;
    padding: 13px 16px; min-width: 190px; flex-shrink: 0;
  }
  .su-src-label input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--su-accent); cursor: pointer; flex-shrink: 0; }
  .su-src-icon { font-size: 15px; flex-shrink: 0; }
  .su-src-name { font-size: 13px; font-weight: 700; color: var(--su-ink); }
  .su-src-row.su-src-gitlab .su-src-icon     { color: var(--su-gitlab); }
  .su-src-row.su-src-db .su-src-icon         { color: var(--su-db); }
  .su-src-row.su-src-jira .su-src-icon       { color: var(--su-jira); }
  .su-src-row.su-src-confluence .su-src-icon { color: #0747a6; }
  .su-src-row.su-src-github .su-src-icon     { color: #24292e; }
  .su-src-row.su-src-disabled .su-src-name   { color: var(--su-muted); }
  .su-src-divider { width: 1px; background: var(--su-line); align-self: stretch; flex-shrink: 0; }
  .su-src-right {
    flex: 1; padding: 10px 16px 10px 12px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0;
  }
  .su-src-empty-msg { font-size: 12px; color: var(--su-danger); }
  .su-chip-grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .su-chip {
    display: flex; align-items: center; gap: 6px;
    border: 1.5px solid var(--su-line); border-radius: 10px;
    padding: 4px 11px; background: var(--su-paper); cursor: pointer;
    font-size: 12px; font-weight: 700; transition: border-color .15s, background .15s;
    color: var(--su-ink);
  }
  .su-chip:hover { border-color: var(--su-accent); }
  .su-chip.selected { border-color: var(--su-accent); background: var(--su-bg); color: var(--su-accent); }
  .su-chip input { display: none; }
  .su-chip.disabled-chip { opacity: .4; cursor: default; pointer-events: none; }

  .su-db-select-all-btn {
    display: flex; align-items: center; gap: 5px;
    background: transparent; border: 1.5px solid var(--su-line);
    border-radius: 10px; padding: 4px 11px;
    font-size: 12px; font-weight: 700; color: var(--su-muted);
    cursor: pointer; transition: border-color .15s, color .15s, background .15s;
    white-space: nowrap;
  }
  .su-db-select-all-btn:hover { border-color: var(--su-accent); color: var(--su-accent); background: var(--su-bg); }
  .su-db-select-all-btn.all-selected { border-color: var(--su-accent); color: var(--su-accent); background: var(--su-bg); }
  .su-src-row.su-src-disabled .su-db-select-all-btn { opacity: .4; pointer-events: none; }

  .su-jira-filters { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 8px; align-items: center; }
  .su-jf-item { display: flex; align-items: center; gap: 5px; }
  .su-jf-label { font-size: 11px; font-weight: 500; color: var(--su-muted); white-space: nowrap; }
  .su-jf-input { font-size: 12px; border: 1.5px solid var(--su-line); border-radius: 8px; padding: 3px 10px;
    background: var(--su-bg); color: var(--su-ink); width: 130px; transition: border-color .15s; }
  .su-jf-input:focus { outline: none; border-color: var(--su-jira); }
  .su-src-row.su-src-disabled .su-jf-input { opacity: .5; pointer-events: none; }

  .su-status-bar {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; border-radius: 10px;
    font-size: 14px; font-weight: 700;
    background: var(--su-bg); border: 1.5px solid var(--su-line); color: var(--su-accent);
    margin-bottom: 16px;
  }
  .su-status-bar.error { background: var(--su-bg); border-color: var(--su-danger); color: var(--su-danger); }
  .su-spinner {
    width: 18px; height: 18px; border: 2.5px solid rgba(124, 92, 191,.2);
    border-top-color: var(--su-accent); border-radius: 50%;
    animation: su-spin .7s linear infinite; flex-shrink: 0;
  }
  .su-spinner.error-spinner { border-color: rgba(192,57,43,.2); border-top-color: var(--su-danger); }
  @keyframes su-spin { to { transform: rotate(360deg); } }

  @keyframes su-dot-pulse {
    0%   { box-shadow: 0 0 0 0 rgba(74,222,128,.6); }
    70%  { box-shadow: 0 0 0 7px rgba(74,222,128,0); }
    100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); }
  }


  .su-tabs { display: flex; gap: 6px; border-bottom: 2px solid var(--su-line); margin-bottom: 20px; flex-wrap: wrap; }
  .su-tab {
    padding: 8px 16px; font-size: 13px; font-weight: 700; cursor: pointer;
    border: none; background: none; color: var(--su-muted);
    border-bottom: 2px solid transparent; margin-bottom: -2px;
    transition: color .15s, border-color .15s;
    border-radius: 8px 8px 0 0;
  }
  .su-tab:hover { color: var(--su-ink); }
  .su-tab.active { color: var(--su-accent); border-bottom-color: var(--su-accent); }
  .su-tab-badge { background: var(--su-line); color: var(--su-muted); border-radius: 20px; padding: 1px 7px; font-size: 11px; margin-left: 4px; }
  .su-tab.active .su-tab-badge { background: var(--su-accent); color: #fff; }
  .su-tab-ki-spinner {
    display: inline-block; width: 13px; height: 13px;
    border: 2px solid rgba(124, 92, 191,.2); border-top-color: var(--su-accent);
    border-radius: 50%; animation: su-spin .7s linear infinite; flex-shrink: 0;
  }
  .su-tab-pane { display: none; }
  .su-tab-pane.active { display: block; }

  .su-result {
    border: 1.5px solid var(--su-line); border-radius: 12px;
    padding: 14px 18px; background: var(--su-paper); margin-bottom: 10px;
  }
  .su-result-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .su-result-title { font-size: 14px; font-weight: 700; margin-bottom: 4px; word-break: break-word; }
  .su-result-title a { color: var(--su-ink); text-decoration: none; }
  .su-result-title a:hover { text-decoration: underline; }
  .su-result-meta { font-size: 12px; color: var(--su-muted); display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 6px; }
  .su-result-meta span { display: flex; align-items: center; gap: 4px; }
  .su-snippet {
    background: var(--su-code-bg); border-radius: 8px; padding: 8px 12px;
    font-size: 12px; font-family: monospace; white-space: pre-wrap;
    word-break: break-all; max-height: 100px; overflow-y: auto;
    color: var(--su-ink); margin-top: 8px;
    border-left: 3px solid var(--su-line);
  }
  .su-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 8px; font-size: 11px; font-weight: 700; flex-shrink: 0; }
  .su-badge-gitlab { background: #fde8e4; color: var(--su-gitlab); }
  .su-badge-jira { background: #e4ecff; color: var(--su-jira); }
  .su-badge-db { background: #e4f0ff; color: var(--su-db); }
  .su-badge-confluence { background: #e8f0fe; color: #0747a6; }
  .su-badge-github { background: #f0f0f0; color: #24292e; }

  .su-ai-status { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--su-muted); }
  .su-ai-spinner {
    width: 16px; height: 16px; border: 2px solid rgba(124, 92, 191,.2);
    border-top-color: var(--su-accent); border-radius: 50%;
    animation: su-spin .7s linear infinite; flex-shrink: 0;
  }
  .su-markdown-body h1, .su-markdown-body h2 { font-size: 17px; margin: 20px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--su-line); }
  .su-markdown-body h3 { font-size: 15px; margin: 14px 0 6px; }
  .su-markdown-body h4 { font-size: 13px; margin: 10px 0 4px; }
  .su-markdown-body p { margin: 6px 0; line-height: 1.6; font-size: 14px; }
  .su-markdown-body ul, .su-markdown-body ol { margin: 6px 0 6px 20px; font-size: 14px; }
  .su-markdown-body li { margin: 3px 0; }
  .su-markdown-body code { background: var(--su-code-bg); border-radius: 4px; padding: 1px 5px; font-size: 12px; color: var(--su-ink); }
  .su-markdown-body pre { background: var(--su-code-bg); border-radius: 8px; padding: 10px 14px; overflow-x: auto; font-size: 12px; }
  .su-markdown-body blockquote { border-left: 3px solid var(--su-line); margin-left: 0; padding-left: 12px; color: var(--su-muted); }
  .su-markdown-body strong { font-weight: 700; }
  .su-markdown-body table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 13px; }
  .su-markdown-body th, .su-markdown-body td { border: 1px solid var(--su-line); padding: 6px 10px; text-align: left; }
  .su-markdown-body th { background: var(--su-code-bg); font-weight: 700; color: var(--su-ink); }

  .su-empty { text-align: center; padding: 40px 20px; color: var(--su-muted); }
  .su-empty i { font-size: 40px; margin-bottom: 10px; display: block; }

  .su-tab-searching {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 48px 24px; gap: 14px; text-align: center;
  }
  .su-tab-searching-spinner {
    width: 44px; height: 44px;
    border: 4px solid rgba(124, 92, 191,.15);
    border-top-color: var(--su-accent);
    border-radius: 50%;
    animation: su-spin .8s linear infinite;
  }
  .su-tab-searching-title {
    font-size: 16px; font-weight: 800; color: var(--su-accent); letter-spacing: .01em;
  }
  .su-tab-searching-sub {
    font-size: 12px; font-weight: 600; color: var(--su-muted); max-width: 340px; line-height: 1.5;
  }

  .gl-stats-bar {
    display: flex; flex-wrap: wrap; gap: 8px 16px;
    padding: 9px 14px; background: var(--su-paper);
    border: 1.5px solid var(--su-line); border-radius: 10px;
    font-size: 12px; color: var(--su-muted); margin-bottom: 14px;
    align-items: center;
  }
  .gl-stats-sep { color: var(--su-line); display: flex; align-items: center; }
  .gl-stats-item { display: flex; align-items: center; gap: 5px; }
  .gl-repo-group { margin-bottom: 14px; }
  .gl-repo-header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; background: var(--su-surface-raised);
    border: 1.5px solid var(--su-line); border-bottom: none;
    border-radius: 12px 12px 0 0; cursor: pointer; user-select: none;
    transition: background .15s;
  }
  .gl-repo-header:hover { background: var(--su-surface-hover); }
  .gl-group-collapsed .gl-repo-header { border-bottom: 1.5px solid var(--su-line); border-radius: 12px; }
  .gl-group-collapsed .gl-repo-items  { display: none; }
  .gl-repo-icon {
    width: 30px; height: 30px; border-radius: 7px;
    background: var(--su-gitlab); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0;
  }
  .gl-repo-info { flex: 1; min-width: 0; }
  .gl-repo-name { font-size: 13px; font-weight: 800; color: var(--su-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gl-repo-path { font-size: 11px; color: var(--su-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gl-repo-count { background: var(--su-gitlab); color: #fff; border-radius: 20px; padding: 2px 9px; font-size: 11px; font-weight: 700; flex-shrink: 0; }
  .gl-repo-chevron { color: var(--su-muted); font-size: 12px; transition: transform .2s; flex-shrink: 0; }
  .gl-group-collapsed .gl-repo-chevron { transform: rotate(-90deg); }
  .gl-repo-items { background: var(--su-paper); border: 1.5px solid var(--su-line); border-top: none; border-radius: 0 0 12px 12px; overflow: hidden; }
  .gl-file-item { border-bottom: 1px solid var(--su-file-border); }
  .gl-file-item:last-child { border-bottom: none; }
  .gl-file-header {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 14px; cursor: pointer; user-select: none;
    transition: background .12s; flex-wrap: wrap;
  }
  .gl-file-header:hover { background: var(--su-bg); }
  .gl-file-expanded .gl-file-header { background: var(--su-surface-raised); }
  .gl-file-type-icon {
    width: 20px; height: 20px; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; flex-shrink: 0;
  }
  .gl-ftype-file     { background: #e8f4fd; color: #1665c0; }
  .gl-ftype-function { background: #edf9f0; color: #1a7a3c; }
  .gl-ftype-class    { background: #fdf3e8; color: #a0521a; }
  .gl-file-path { flex: 1; min-width: 120px; font-size: 12.5px; font-weight: 600; color: var(--su-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gl-fname { color: var(--su-gitlab); font-weight: 700; }
  .gl-file-branch { font-size: 11px; color: var(--su-muted); display: flex; align-items: center; gap: 3px; flex-shrink: 0; white-space: nowrap; }
  .gl-file-line { font-size: 11px; font-weight: 700; color: var(--su-gitlab); font-family: monospace; flex-shrink: 0; background: #fde8e4; padding: 1px 6px; border-radius: 5px; white-space: nowrap; }
  .gl-file-kw { font-size: 11px; color: var(--su-muted); flex-shrink: 0; display: flex; align-items: center; gap: 3px; white-space: nowrap; }
  .gl-file-open-btn {
    background: none; border: none; color: var(--su-muted);
    cursor: pointer; padding: 3px 6px; border-radius: 6px;
    font-size: 11px; font-weight: 700;
    display: flex; align-items: center; gap: 3px;
    transition: color .15s, background .15s; flex-shrink: 0;
  }
  .gl-file-open-btn:hover { color: var(--su-gitlab); background: #fde8e4; }
  .gl-file-snippet { display: none; border-top: 1px solid var(--su-file-border); }
  .gl-file-expanded .gl-file-snippet { display: block; }
  .gl-snippet-code {
    background: #1e1e2e; color: #cdd6f4;
    font-size: 12px; line-height: 1.7; margin: 0; padding: 12px 16px;
    overflow-x: auto; font-family: monospace; white-space: pre-wrap; word-break: break-all;
  }

  .su-jira-stats {
    background: var(--su-bg); border: 1.5px solid var(--su-line);
    border-radius: 10px; padding: 12px 18px; margin-bottom: 14px;
  }
  .su-jira-stats-title {
    font-weight: 700; font-size: 13px; color: var(--su-muted);
    text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px;
  }
  .su-jira-stats-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--su-muted); }
  .su-jira-stats-meta strong { color: var(--su-ink); }
  .su-jira-sep { color: var(--su-line); }
  .su-jira-group { margin-bottom: 10px; }
  .su-jira-group-hdr {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; background: var(--su-paper);
    border: 1.5px solid var(--su-line); border-radius: 12px;
    cursor: pointer; transition: background .15s; user-select: none;
  }
  .su-jira-group-hdr:hover { background: var(--su-bg); }
  .su-jira-proj-icon {
    width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 800; color: #fff; background: var(--su-jira);
  }
  .su-jira-proj-name { font-weight: 700; font-size: 14px; color: var(--su-ink); }
  .su-jira-proj-sub  { font-size: 11px; color: var(--su-muted); }
  .su-jira-grp-count { background: var(--su-jira); color: #fff; border-radius: 20px; padding: 2px 10px; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .su-jira-grp-chev  { color: var(--su-muted); font-size: 13px; transition: transform .2s; flex-shrink: 0; }
  .su-jira-group.su-collapsed .su-jira-grp-chev { transform: rotate(-90deg); }
  .su-jira-group.su-collapsed .su-jira-grp-body { display: none; }
  .su-jira-grp-body { margin-top: 6px; }
  .su-jira-ticket {
    display: flex; background: var(--su-paper);
    border: 1.5px solid var(--su-line); border-left-width: 4px; border-left-color: var(--su-line);
    border-radius: 10px; margin-bottom: 8px; transition: box-shadow .15s;
  }
  .su-jira-ticket:hover { box-shadow: 0 2px 8px rgba(0,82,204,.1); }
  .su-jira-ticket.t-bug   { border-left-color: #b91c1c; }
  .su-jira-ticket.t-story { border-left-color: #27ae60; }

        '<div><div style="' + lStyle + '"><span>Ramp-up (s)</span>' + ltInfoBtn('load_test.param_ramp_up_info', 'Zeit in Sekunden, in der die Nutzerzahl von 0 schrittweise auf Peak VUs erhöht wird.') + '</div><input id="ltK6ParamRampUp" type="number" min="0" max="3600" value="' + p.rampUpSec + '" style="' + iStyle + '"/></div>' +
        '<div><div style="' + lStyle + '"><span>Steady-state (s)</span>' + ltInfoBtn('load_test.param_steady_info', 'Zeit in Sekunden, in der die Last konstant bei Peak VUs gehalten wird – die eigentliche Lastphase.') + '</div><input id="ltK6ParamSteady" type="number" min="0" max="86400" value="' + p.steadySec + '" style="' + iStyle + '"/></div>' +
        '<div><div style="' + lStyle + '"><span>Ramp-down (s)</span>' + ltInfoBtn('load_test.param_ramp_down_info', 'Zeit in Sekunden, in der die Nutzerzahl nach der Lastphase schrittweise auf 0 abgesenkt wird.') + '</div><input id="ltK6ParamRampDown" type="number" min="0" max="3600" value="' + p.rampDownSec + '" style="' + iStyle + '"/></div>' +
      '</div>' +
      '<button type="button" class="btn btn-sm btn-outline-success" style="border-radius:999px;font-size:11px;" onclick="ltApplyK6Params()">' +
        '<i class="bi bi-check2 me-1"></i>\u00dcbernehmen</button>' +
      '<span id="ltK6ParamApplied" style="font-size:11px;color:#40a070;display:none;margin-left:8px;">\u2713 Angewendet</span>' +
    '</div>' +
  '</div>';
}

function ltInfoBtn(key, fallback) {
  var text = (window.i18n ? window.i18n.t(key) : null) || fallback;
  return '<button class="lt-tile-info-btn" tabindex="-1"><i class="bi bi-info-circle"></i><span class="lt-tile-info-popup">' + escHtml(text) + '</span></button>';
}
function ltRenderAmpel(items) {
  var cfg = {
    green:  {bg:'#f0faf7', border:'#7c5cbf', valColor:'#7c5cbf'},
    yellow: {bg:'#fffbeb', border:'#f59e0b', valColor:'#d97706'},
    red:    {bg:'#fef2f2', border:'#ef4444', valColor:'#dc2626'}
  };
  return '<div class="lt-ampel-row">' +
    items.map(function(it) {
      var c = cfg[it.color] || cfg.green;
      return '<div class="lt-ampel-card" style="background:' + c.bg + ';border:1px solid ' + c.border + '30;border-left:4px solid ' + c.border + ';">' +
        '<div class="lt-ampel-label"><i class="' + it.icon + '"></i>' + escHtml(it.label) + '</div>' +
        '<div class="lt-ampel-value" style="color:' + c.valColor + ';">' + escHtml(it.value) + '</div>' +
        (it.sub ? '<div class="lt-ampel-sub">' + escHtml(it.sub) + '</div>' : '') +
      '</div>';
    }).join('') +
  '</div>';
}

function ltRenderRtRangeSvg(pts) {
  if (!pts || pts.length < 2) return '';
  var W = 560, H = 90, padL = 44, padR = 24, axisY = 44;
  var minMs = pts[0].ms, maxMs = pts[pts.length - 1].ms;
  if (minMs >= maxMs) maxMs = minMs + 1;
  function xOf(ms) { return padL + (ms - minMs) / (maxMs - minMs) * (W - padL - padR); }
  function fmtMs(ms) { return ms >= 1000 ? (ms / 1000).toFixed(1) + 's' : Math.round(ms) + 'ms'; }
  var s = '<svg viewBox="0 0 560 90" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:90px;display:block;">';
  s += '<line x1="' + xOf(minMs) + '" y1="' + axisY + '" x2="' + xOf(maxMs) + '" y2="' + axisY + '" stroke="#ddd7cb" stroke-width="5" stroke-linecap="round"/>';
  var avgPt = null, p95Pt = null;
  pts.forEach(function(p) { if (p.label === 'avg') avgPt = p; if (p.label === 'p95') p95Pt = p; });
  if (avgPt && p95Pt) {
    s += '<line x1="' + xOf(avgPt.ms) + '" y1="' + axisY + '" x2="' + xOf(p95Pt.ms) + '" y2="' + axisY + '" stroke="#6366f1" stroke-width="5" stroke-linecap="round" opacity="0.45"/>';
  }
  pts.forEach(function(pt, i) {
    var x = xOf(pt.ms);
    var below = (i % 2 !== 0);
    var lblY = below ? axisY + 19 : axisY - 11;
    var valY = below ? axisY + 31 : axisY - 24;
    s += '<line x1="' + x + '" y1="' + axisY + '" x2="' + x + '" y2="' + (below ? axisY + 7 : axisY - 7) + '" stroke="' + pt.color + '" stroke-width="1.5"/>';
    s += '<circle cx="' + x + '" cy="' + axisY + '" r="5" fill="' + pt.color + '" stroke="white" stroke-width="1.5"/>';
    s += '<text x="' + x + '" y="' + lblY + '" text-anchor="middle" font-size="9" fill="#6a665f" font-family="system-ui,sans-serif">' + pt.label + '</text>';
    s += '<text x="' + x + '" y="' + valY + '" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1f1f1f" font-family="monospace,system-ui">' + fmtMs(pt.ms) + '</text>';
  });
  s += '</svg>';
  return s;
}

function ltRenderVuProfileSvg(stages) {
  if (!stages || !stages.length) return '';
  var W = 560, H = 90, padL = 38, padR = 16, padT = 14, padB = 22;
  var totalDur = stages.reduce(function(s, st) { return s + st.duration; }, 0);
  var maxVUs   = stages.reduce(function(mx, st) { return Math.max(mx, st.target); }, 0);
  if (totalDur === 0 || maxVUs === 0) return '';
  var innerW = W - padL - padR, innerH = H - padT - padB;
  function xOf(t) { return padL + t / totalDur * innerW; }
  function yOf(v) { return padT + (1 - v / maxVUs) * innerH; }
  function fmtT(sec) { return sec >= 3600 ? Math.round(sec / 3600) + 'h' : sec >= 60 ? Math.round(sec / 60) + 'm' : sec + 's'; }
  var d = 'M ' + xOf(0) + ' ' + yOf(0);
  var t = 0;
  stages.forEach(function(st) { t += st.duration; d += ' L ' + xOf(t) + ' ' + yOf(st.target); });
  var fillD = d + ' L ' + xOf(totalDur) + ' ' + yOf(0) + ' L ' + xOf(0) + ' ' + yOf(0) + ' Z';
  var s = '<svg viewBox="0 0 560 90" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:90px;display:block;">';
  s += '<line x1="' + padL + '" y1="' + yOf(0) + '" x2="' + (W - padR) + '" y2="' + yOf(0) + '" stroke="#ddd7cb" stroke-width="1"/>';
  s += '<line x1="' + padL + '" y1="' + yOf(maxVUs) + '" x2="' + (W - padR) + '" y2="' + yOf(maxVUs) + '" stroke="#ddd7cb" stroke-width="1" stroke-dasharray="3,3"/>';
  s += '<path d="' + fillD + '" fill="#b91c1c" opacity="0.09"/>';
  s += '<path d="' + d + '" fill="none" stroke="#b91c1c" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  s += '<text x="' + (padL - 5) + '" y="' + (yOf(maxVUs) + 4) + '" text-anchor="end" font-size="9" fill="#6a665f" font-family="system-ui,sans-serif">' + maxVUs + ' VUs</text>';
  s += '<text x="' + (padL - 5) + '" y="' + (yOf(0) - 2) + '" text-anchor="end" font-size="9" fill="#6a665f" font-family="system-ui,sans-serif">0</text>';
  s += '<text x="' + xOf(0) + '" y="' + (H - 4) + '" text-anchor="middle" font-size="9" fill="#6a665f" font-family="system-ui,sans-serif">0</text>';
  s += '<text x="' + xOf(totalDur / 2) + '" y="' + (H - 4) + '" text-anchor="middle" font-size="9" fill="#6a665f" font-family="system-ui,sans-serif">' + fmtT(totalDur / 2) + '</text>';
  s += '<text x="' + xOf(totalDur) + '" y="' + (H - 4) + '" text-anchor="middle" font-size="9" fill="#6a665f" font-family="system-ui,sans-serif">' + fmtT(totalDur) + '</text>';
  s += '</svg>';
  return s;
}
function ltParseMs(s) {
  if (!s) return null;
  var m = s.match(/([\d.]+)\s*(ms|µs|s)/);
  if (!m) return null;
  var v = parseFloat(m[1]);
  if (m[2] === 'µs') return v / 1000;
  if (m[2] === 's') return v * 1000;
  return v;
}
function ltK6SummaryReady(out) {
  if (!out) return false;
  if (/^\s*default\s+[✓✗]?\s+\[\s*100%\s*\]/m.test(out)) return true;
  if (/^\s*checks[. ]+:/m.test(out)) return true;
  if (/running \(\d+[smhµ]+\),\s*\d+\s+VUs?,/.test(out) && /█\s*TOTAL RESULTS/i.test(out)) return true;
  return false;
}
function ltGetBearerTokenKey(tool) {
  return 'lt_bearer_' + (ltCurrentAnalysisId || 'na') + '_' + tool;
}
function ltSaveBearerToken(tool) {
  var id = 'ltK6BearerInput';
  var el = document.getElementById(id);
  if (!el) return;
  try { localStorage.setItem(ltGetBearerTokenKey(tool), el.value); } catch(e) {}
}
function ltRestoreBearerToken(tool) {
  var id = 'ltK6BearerInput';
  var el = document.getElementById(id);
  if (!el) return;
  try { el.value = localStorage.getItem(ltGetBearerTokenKey(tool)) || ''; } catch(e) {}
}
function ltToggleBearerVisible(inputId, btn) {
  var el = document.getElementById(inputId);
  if (!el) return;
  var show = el.type === 'password';
  el.type = show ? 'text' : 'password';
  btn.innerHTML = show ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
}
function ltGetBearerToken(tool) {
  var id = 'ltK6BearerInput';
  var el = document.getElementById(id);
  if (el && el.value.trim()) return el.value.trim();
  try { return localStorage.getItem(ltGetBearerTokenKey(tool)) || ''; } catch(e) { return ''; }
}
</script>
<th:block th:replace="~{fragments/lasttest-analysis/scripts-k6-run :: scripts-k6-run}"></th:block>
</th:block>

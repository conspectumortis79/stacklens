<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<body>
<th:block th:fragment="scripts-save-history">
<script>
var _ltSaveContent     = null;
var _ltSaveFilename    = null;
var _ltSaveAnalysisId  = null;

function ltLoadSaveDirectoryEntries(path) {
  return window.slHelpers.browseDirectories('/api/tooling/files/browse', path);
}

function ltOpenSaveOverlay(type) {
  var content = _ltK6Script;
  if (!content) return;
  _ltSaveContent    = content;
  _ltSaveFilename   = 'lasttest-k6.js';
  _ltSaveAnalysisId = ltCurrentAnalysisId;
  __kiChatOpenDirBrowser(function (dir, filename) {
    if (dir) ltSaveAnalysisTo(dir, filename);
  }, {
    saveAs: { filename: _ltSaveFilename },
    titleKey: 'common.save_location',
    titleFallback: 'Speicherort wählen',
    load: ltLoadSaveDirectoryEntries,
  });
}

function ltSaveAnalysisTo(dir, filename) {
  var name = (filename || '').trim() || _ltSaveFilename;
  if (!dir || !_ltSaveContent || !name) return;
  fetch('/api/loadtest-analysis/analysis/' + _ltSaveAnalysisId + '/save-script', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ path: dir, filename: name, content: _ltSaveContent })
  }).then(function (r) { return r.json(); }).then(function (data) {
    if (data.error) {
      showAlert(data.error, 'danger');
      return;
    }
    _ltSaveContent = null;
    _ltSaveFilename = null;
    _ltSaveAnalysisId = null;
  }).catch(function (e) {
    showAlert((window.i18n ? window.i18n.t('common.network_error') : 'Netzwerkfehler: ') + (e.message || e), 'danger');
  });
}


function ltSetProjectStatus(configId, projectId, type) {
  var el = document.getElementById('ltCardStatus_' + configId + '_' + projectId);
  if (!el) return;
  if (!type) { el.innerHTML = ''; el.dataset.ltStatus = ''; return; }
  if (el.dataset.ltStatus === type) return;
  el.dataset.ltStatus = type;
  if (type === 'running') {
    el.innerHTML = '<span class="lt-card-status-pill lt-card-status--running"><span class="spinner-border spinner-border-sm" style="width:.75rem;height:.75rem;border-width:2px;"></span> ' + (window.i18n ? window.i18n.t('load_test.running') : 'Läuft…') + '</span>';
  } else if (type === 'aborted') {
    el.innerHTML = '<span class="lt-card-status-pill lt-card-status--aborted"><i class="bi bi-x-circle-fill me-1"></i>' + (window.i18n ? window.i18n.t('code_analysis.status_aborted') : 'Abgebrochen') + '</span>';
  } else if (type === 'completed') {
    el.innerHTML = '<span class="lt-card-status-pill lt-card-status--completed"><i class="bi bi-check-circle-fill me-1"></i>' + (window.i18n ? window.i18n.t('code_analysis.status_completed') : 'Abgeschlossen') + '</span>';
  }
}

function ltSetRunBadge(configId, projectId, type, visible) {
  if (!configId || !projectId) return;
  if (type === 'analyse') {
    var cancelBtn = document.getElementById('ltCancelBtn_' + configId + '_' + projectId);
    if (cancelBtn) cancelBtn.style.display = visible ? '' : 'none';
  }
}

var _ltHistory = null;
var _ltHistorySource = null;

function ltHistoryProject(a) {
  if (a.gitlabProjectPath) return a.gitlabProjectPath;
  if (a.repoConfigId) {
    var card = document.getElementById('ltRepoCard-' + a.repoConfigId);
    return card ? (card.getAttribute('data-repo-name') || ('Lokal #' + a.repoConfigId)) : ('Lokal #' + a.repoConfigId);
  }
  if (a.githubRepoConfigId) {
    var gh = document.getElementById('ltGhCard-' + a.githubRepoConfigId);
    return gh ? (gh.dataset.githubRepoName || ('GitHub #' + a.githubRepoConfigId)) : ('GitHub #' + a.githubRepoConfigId);
  }
  return '#' + a.id;
}

function ltHistoryRef(a) {
  if (a.gitlabProjectPath) return 'GitLab';
  if (a.githubRepoConfigId) return 'GitHub';
  if (a.repoConfigId) return 'Lokal';
  return '';
}

function ltHistoryEnvs(a) {
  if (!a.environmentsJson) return '';
  try {
    var list = JSON.parse(a.environmentsJson);
    if (!Array.isArray(list) || !list.length) return '';
    var names = list.slice(0, 2).map(function (e) { return e && e.name ? String(e.name) : ''; }).filter(Boolean);
    if (!names.length) return '';
    return names.join(', ') + (list.length > names.length ? ' +' + (list.length - names.length) : '');
  } catch (_) { return ''; }
}

function ltHistoryFindings(a) {
  if (window.slHistory.status(a.status) !== 'COMPLETED') return '';
  if (!a.findingsJson) return '0';
  try {
    var parsed = JSON.parse(a.findingsJson);
    return Array.isArray(parsed) ? String(parsed.length) : '';
  } catch (_) { return ''; }
}

function ltHistory() {
  if (_ltHistory) return _ltHistory;
  _ltHistory = window.slHistory.mount({
    root: 'hxCard-lasttest-analysis',
    page: 'lasttest-analysis',
    titleKey: 'load_test.history_title',
    emptyKey: 'load_test.history_empty',
    columns: {
      title: { key: 'load_test.col_project', fallback: 'Projekt' },
      metric: { key: 'common.history_col_findings', fallback: 'Befunde' }
    },
    map: {
      id: function(a) { return a.id; },
      status: function(a) { return a.status; },
      createdAt: function(a) { return a.createdAt; },
      typeIcon: function(a) {
        if (a.gitlabProjectPath) return 'bi-gitlab';
        if (a.githubRepoConfigId) return 'bi-github';
        return 'bi-speedometer2';
      },
      title: ltHistoryProject,
      subtitle: function(a) { return ltHistoryEnvs(a) || ltHistoryRef(a); },
      metric: ltHistoryFindings,
      note: function(a) { return a.errorMessage || ''; },
      isCurrent: function(a) { return ltCurrentAnalysisId === a.id; }
    },
    actions: {
      open: function(a) { ltSelectHistoryItem(a.id); },
      cancel: function(a) { ltCancelHistoryItem(a.id); },
      remove: function(a) { ltDeleteHistoryItem(a.id); },
      deleteAll: function() { ltDeleteAllHistoryForCurrentSource(); }
    }
  });
  return _ltHistory;
}

function ltLoadHistory(configId, projectId, repoType) {
  if (!configId) {
    _ltHistorySource = null;
    ltHistory().setData([]);
    ltHistory().setHidden(true);
    return;
  }
  repoType = repoType || 'gitlab';
  _ltHistorySource = { configId: configId, projectId: projectId, repoType: repoType };
  ltHistory().setHidden(false);
  fetch('/api/loadtest-analysis/all')
    .then(function(r) { return r.json(); })
    .then(function(all) {
      var list = (all || []).filter(function(a) {
        if (repoType === 'local')  return String(a.repoConfigId) === String(configId);
        if (repoType === 'github') return String(a.githubRepoConfigId) === String(configId);
        return String(a.gitlabConfigId) === String(configId) && String(a.gitlabProjectId) === String(projectId);
      }).sort(function(a, b) { return b.id - a.id; });
      ltHistory().setData(list);
    })
    .catch(function() {});
}

function ltRefreshHistory() {
  if (_ltHistory) _ltHistory.refresh();
}

function ltCancelHistoryItem(analysisId) {
  fetch('/api/loadtest-analysis/analysis/' + analysisId + '/cancel', { method: 'POST' })
    .then(function() {
      if (ltCurrentAnalysisId === analysisId) ltCancelAnalysis();
      ltLoadHistory(_ltHistorySource.configId, _ltHistorySource.projectId, _ltHistorySource.repoType);
    })
    .catch(function() {});
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', function() { ltHistory().setHidden(false); });
} else {
  ltHistory();
}

function ltSelectHistoryItem(analysisId) {
  if (_ltK6PollTimer)     { clearInterval(_ltK6PollTimer);     _ltK6PollTimer = null; }
  ltCurrentAnalysisId = analysisId;
  ltShowEmpty();
  ltFetchStatus(analysisId)
    .then(function(res) {
      if (res.gone) {
        ltCurrentAnalysisId = null;
        ltLoadHistory(_ltHistorySource ? _ltHistorySource.configId : null,
                      _ltHistorySource ? _ltHistorySource.projectId : null,
                      _ltHistorySource ? _ltHistorySource.repoType : 'gitlab');
        return;
      }
      if (res.retry) return;
      var data = res.data;
      ltCurrentAnalysisId = data.id;
      ltApplyResult(data);
      ltInitTokenUsageBar();
      if (data.status === 'RUNNING' || data.status === 'PENDING') {
        if (ltCurrentRepoType === 'local' && ltCurrentLocalRepoId) {
          _ltStartLocalPolling(ltCurrentLocalRepoId);
        } else if (ltCurrentRepoType === 'github' && ltCurrentGithubRepoId) {
          _ltStartGithubPolling(ltCurrentGithubRepoId);
        } else {
          ltStartPolling();
          _ltAnalysisRunningConfigId = ltCurrentConfigId;
          _ltAnalysisRunningProjectId = ltCurrentProjectId;
        }
      } else if (data.status === 'COMPLETED') {
        ltRestoreRunningState(data.id);
      }
      var summaryBtn = document.querySelector('.lt-tab-btn');
      ltSwitch('tabLtSummary', summaryBtn);
      ltRefreshHistory();
    });
}

function ltDeleteHistoryItem(analysisId) {
  var src = _ltHistorySource || {};
  fetch('/api/loadtest-analysis/analysis/' + analysisId, { method: 'DELETE' })
    .then(function() {
      if (ltCurrentAnalysisId === analysisId) {
        ltCurrentAnalysisId = null;
        ltShowEmpty();
      }
      ltLoadHistory(src.configId, src.projectId, src.repoType || 'gitlab');
    })
    .catch(function() {});
}

function ltDeleteAllHistory(configId, projectId, repoType) {
  repoType = repoType || 'gitlab';
  fetch('/api/loadtest-analysis/all')
    .then(function(r) { return r.json(); })
    .then(function(all) {
      var toDelete;
      if (repoType === 'local') {
        toDelete = all.filter(function(a) {
          return String(a.repoConfigId) === String(configId) &&
                 a.status !== 'RUNNING' && a.status !== 'PENDING';
        });
      } else if (repoType === 'github') {
        toDelete = all.filter(function(a) {
          return String(a.githubRepoConfigId) === String(configId) &&
                 a.status !== 'RUNNING' && a.status !== 'PENDING';
        });
      } else {
        toDelete = all.filter(function(a) {
          return String(a.gitlabConfigId) === String(configId) &&
                 String(a.gitlabProjectId) === String(projectId) &&
                 a.status !== 'RUNNING' && a.status !== 'PENDING';
        });
      }
      return Promise.all(toDelete.map(function(a) {
        return fetch('/api/loadtest-analysis/analysis/' + a.id, { method: 'DELETE' }).catch(function() {});
      }));
    })
    .then(function() {
      ltCurrentAnalysisId = null;
      ltShowEmpty();
      ltLoadHistory(configId, projectId, repoType);
    })
    .catch(function() {});
}

function ltDeleteAllHistoryForCurrentSource() {
  if (ltCurrentRepoType === 'local' && ltCurrentLocalRepoId) {
    ltDeleteAllHistory(ltCurrentLocalRepoId, null, 'local');
  } else if (ltCurrentRepoType === 'github' && ltCurrentGithubRepoId) {
    ltDeleteAllHistory(ltCurrentGithubRepoId, null, 'github');
  } else if (ltCurrentConfigId && ltCurrentProjectId) {
    ltDeleteAllHistory(ltCurrentConfigId, ltCurrentProjectId, 'gitlab');
  }
}


function ltSwitch(panelId, btn) {
  document.querySelectorAll('.lt-tab-panel').forEach(function(p){ p.classList.remove('active'); });
  document.querySelectorAll('.lt-tab-btn').forEach(function(b){ b.classList.remove('active'); });
  var panel = document.getElementById(panelId);
  if (panel) panel.classList.add('active');
  if (btn) btn.classList.add('active');
}

function renderMarkdown(md) {
  if (!md) return '';
  var html = escHtml(md);
  html = html.replace(/```[\w]*\n([\s\S]*?)```/g, function(m, code) {
    return '<pre><code>' + code + '</code></pre>';
  });
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  html = html.replace(/\n\n/g, '</p><p>');
  return '<p>' + html + '</p>';
}

</script>
</th:block>
</body>
</html>

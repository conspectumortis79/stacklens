<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<body>
<th:block th:fragment="styles">
<style>
  :root {
    --lt-accent: var(--app-accent-red);
    --lt-action: var(--app-accent-purple);
    --lt-ink:    var(--app-text);
    --lt-muted:  var(--app-text-muted);
    --lt-paper:  var(--app-cream);
    --lt-line:   var(--app-border);
    --lt-border: var(--app-border);
    --lt-bg:     var(--app-cream-2);
  }
  .lt-config-accordion-header { background: var(--lt-bg); transition: background .15s; }
  .lt-config-accordion-header:hover { background: var(--lt-paper); }
  .lt-github-accordion-header { background: var(--lt-bg); transition: background .15s; }
  .lt-github-accordion-header:hover { background: var(--lt-paper); }
  .lt-github-icon { color: #24292e; }
  .lt-layout { display:flex; height:calc(100vh - 110px); overflow:hidden; gap:0; }
  .lt-sidebar { width:270px; flex-shrink:0; display:flex; flex-direction:column;
    background:#fff; border-right:1px solid var(--lt-line); overflow:hidden; zoom:1.05; }
  .lt-sidebar-scroll { flex:1; min-height:0; display:flex; flex-direction:row; overflow:hidden; }
  .lt-sidebar-scroll-content { flex:1; overflow-y:scroll; scrollbar-width:none; padding:8px 12px 8px 8px; }
  .lt-sidebar-scroll-content::-webkit-scrollbar { display: none; }
  .lt-sidebar-header { padding:14px 16px 10px; font-size:13px; font-weight:800; color:var(--lt-ink);
    border-bottom:1px solid var(--lt-line); }
  .lt-project-item { padding:10px 14px; cursor:pointer; display:flex;
    align-items:flex-start; gap:8px;
    transition:background .15s, box-shadow .15s, transform .15s;
    will-change: transform;
    margin:6px 0 0; border-radius:7px; background:#fff;
    box-shadow: 0 1px 0 0 #e8e2d8, 0 2px 6px 0 rgba(90,65,25,.08); }
  .lt-project-item:hover { background:#faf6ef;
    transform:translateY(-2px);
    box-shadow: 0 4px 12px 0 rgba(90,65,25,.15), 0 1px 0 0 #d8d2c6; }
  .lt-project-item.active { background:#f0faf7;
    box-shadow: inset 3px 0 0 var(--lt-action), 0 1px 4px 0 rgba(90,65,25,.08); }
  .lt-project-name { font-size:13px; font-weight:700; color:var(--lt-ink); line-height:1.3; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lt-project-path { font-size:11px; color:var(--lt-muted); font-family:monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lt-status-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; margin-top:4px; }
  .lt-status-dot.ok { background:#22c55e; }
  .lt-status-dot.running { background:#f59e0b; animation:ltpulse 1.2s infinite; }
  .lt-status-dot.fail { background:#ef4444; }
  .lt-status-dot.none { background:#d1d5db; }
  @keyframes ltpulse { 0%,100% { opacity:1; } 50% { opacity:.4; } }
  .lt-btn-row { display:flex; gap:5px; margin-top:7px; }
  .lt-btn-xs { padding:4px 11px; font-size:11px; border-radius:999px; border:1.5px solid;
    display:inline-flex; align-items:center; gap:4px; cursor:pointer; font-weight:700;
    background:transparent; line-height:1.4; }
  .lt-btn-xs-success { background:var(--lt-action); color:#fff; border-color:var(--lt-action); }
  .lt-btn-xs-cancel  { color:#721c24; border-color:#e89ba4; background:#fff0f2; }
  .lt-btn-xs-outline { color:var(--lt-muted); border-color:var(--lt-line); background:#fff; }
  .lt-btn-xs-outline:hover { border-color:#bbb; color:var(--lt-ink); }

  .lt-repo-card { margin:6px 0 0; border-radius:10px; background:#fff;
    box-shadow:0 1px 0 0 #e8e2d8, 0 2px 6px 0 rgba(90,65,25,.08);
    padding:10px 12px; cursor:pointer; transition:background .15s, box-shadow .15s, transform .15s; }
  .lt-repo-card:hover { background:#faf6ef; transform:translateY(-2px);
    box-shadow:0 4px 12px 0 rgba(90,65,25,.15), 0 1px 0 0 #d8d2c6; }
  .lt-repo-card.active { background:#f0faf7;
    box-shadow:inset 3px 0 0 var(--lt-action), 0 1px 4px 0 rgba(90,65,25,.08); }
  .lt-repo-inactive { opacity: 0.5; pointer-events: none; }
  .lt-repo-inactive .lt-btn-row button[data-lt-edit] { pointer-events: auto; cursor: pointer; }
  .lt-repo-name { font-size:13px; font-weight:700; color:var(--lt-ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lt-repo-path { font-size:11px; color:var(--lt-muted); font-family:monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lt-github-repos.d-none { display:none !important; }
  .lt-list-sep { height:1px; background:var(--lt-line); margin:4px 4px; }
  .lt-list-label { font-size:11px; font-weight:700; color:var(--lt-muted); letter-spacing:.06em;
    text-transform:uppercase; padding:4px 4px 2px; }

  .lt-result { flex:1; overflow-y:auto; background:var(--lt-paper); }
  .lt-result-sticky-top { position:sticky; top:0; z-index:3; background:#fff; }
  .lt-result-header { display:flex; align-items:center; gap:10px; padding:14px 20px;
    border-bottom:1px solid var(--lt-line); background:#fff; flex-wrap:wrap; }
  .lt-result-header .lt-project-title { font-size:16px; font-weight:800; color:var(--lt-ink); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .lt-tabs { border-bottom:1px solid var(--lt-line); background:#fff; display:flex; gap:2px; padding:0 16px; overflow-x:auto; }
  .lt-tab-btn { padding:10px 14px; font-size:13px; font-weight:600; color:var(--lt-muted); background:transparent;
    border:none; border-bottom:2.5px solid transparent; cursor:pointer; white-space:nowrap; transition:color .12s; }
  .lt-tab-btn:hover { color:var(--lt-ink); }
  .lt-tab-btn.active { color:var(--lt-accent); border-bottom-color:var(--lt-accent); }

  .lt-tab-panel { padding:24px; display:none; }
  .lt-tab-panel.active { display:block; }

  .lt-empty { display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:200px; color:var(--lt-muted); gap:10px; font-size:14px; text-align:center; }
  .lt-empty i { font-size:2.8rem; }

  .lt-prose { font-size:14px; line-height:1.7; color:var(--lt-ink); }
  .lt-prose h1,.lt-prose h2,.lt-prose h3 { font-weight:800; color:var(--lt-ink); }
  .lt-prose h2 { font-size:16px; margin-top:1.4em; }
  .lt-prose h3 { font-size:14px; margin-top:1em; }
  .lt-prose code { background:#f0ece4; padding:1px 5px; border-radius:4px; font-size:12.5px; }
  .lt-prose pre { background:#1e1e2e; color:#cdd6f4; border-radius:10px; padding:16px; overflow-x:auto; font-size:12.5px; }
  .lt-prose pre code { background:transparent; padding:0; }

  .lt-finding { border:1px solid var(--lt-line); border-radius:10px; padding:14px 16px; margin-bottom:12px; background:#fff; }
  .lt-finding-header { display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  .lt-finding-title { font-size:13px; font-weight:700; color:var(--lt-ink); flex:1; }
  .lt-badge { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:999px;
    font-size:11px; font-weight:700; }
  .lt-badge.HIGH { background:#fee2e2; color:#991b1b; }
  .lt-badge.MEDIUM { background:#fef3c7; color:#92400e; }
  .lt-badge.LOW { background:#d1fae5; color:#065f46; }
  .lt-badge.type { background:#ede9e0; color:#5b564d; }
  .lt-finding-file { font-size:11px; font-family:monospace; color:var(--lt-muted); margin-bottom:6px; }
  .lt-finding-endpoint { font-size:11px; font-family:monospace; color:var(--lt-accent); margin-bottom:6px; }
  .lt-finding-desc { font-size:13px; color:var(--lt-ink); margin-bottom:6px; }
  .lt-finding-rec { font-size:12.5px; color:#7c5cbf; border-left:3px solid #7c5cbf; padding-left:10px; }
  .lt-finding-hint { font-size:12px; color:var(--lt-muted); margin-top:6px; }

  .lt-k6-actions { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
  .lt-k6-block { background:#1e1e2e; color:#cdd6f4; border-radius:12px; padding:20px; overflow-x:auto; font-size:12.5px; line-height:1.6; font-family:monospace; white-space:pre; }

  .lt-run-badges { display:flex; gap:4px; flex-wrap:wrap; margin-top:3px; }
  .lt-run-badge { display:inline-flex; align-items:center; gap:3px; padding:1px 7px; border-radius:999px;
    font-size:10px; font-weight:700; letter-spacing:.03em; }

  .lt-card-status { min-height: 18px; margin: 3px 0 2px; }
  .lt-card-status-pill {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 9px;
  }
  .lt-card-status--running  { color: #7a5a0a; background: #fff3cd; }
  .lt-card-status--aborted  { color: #721c24; background: #f8d7da; }
  .lt-card-status--completed { color: #155724; background: #d4edda; }
  .lt-rb-analyse { background:#fef3c7; color:#92400e; border:1px solid #fcd34d; }
  .lt-rb-k6 { background:#dcfce7; color:#14532d; border:1px solid #86efac; }

  .lt-k6-progress { background:#fafaf5; border:1px solid var(--lt-line); border-radius:10px;
    padding:14px 16px; margin-bottom:12px; }
  .lt-k6-pbar-track { background:#e8e4dd; border-radius:999px; height:10px; overflow:hidden; margin:8px 0 6px; }
  .lt-k6-pbar-fill { height:100%; border-radius:999px;
    background:linear-gradient(90deg,#7c5cbf,#22c55e); transition:width .9s ease; will-change:width; }
  .lt-k6-metrics { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:10px; margin-bottom:14px; }
  .lt-k6-metric { border:1px solid var(--lt-line); border-radius:10px; padding:12px 14px; background:#fff; position:relative; }
  .lt-k6-metric-label { font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    color:var(--lt-muted); margin-bottom:4px; display:flex; align-items:center; justify-content:space-between; gap:4px; }
  .lt-tile-info-btn { background:none; border:none; padding:0; cursor:default; color:var(--lt-muted); font-size:11px; line-height:1; flex-shrink:0; opacity:.5; transition:opacity .15s; position:relative; }
  .lt-tile-info-btn:hover { opacity:1; color:var(--lt-accent,#6366f1); }
  .lt-tile-info-popup { position:absolute; left:50%; transform:translateX(-50%); bottom:calc(100% + 7px); min-width:190px; max-width:250px; background:rgba(15,23,42,.92); color:#f1f5f9; font-size:11px; line-height:1.55; padding:8px 11px; border-radius:8px; z-index:100; text-transform:none; font-weight:400; letter-spacing:0; white-space:normal; pointer-events:none; opacity:0; transition:opacity .15s; box-shadow:0 4px 12px rgba(0,0,0,.25); }
  .lt-tile-info-popup.lt-popup-left  { left:auto; right:0;   transform:none; }
  .lt-tile-info-popup.lt-popup-right { left:0;    right:auto; transform:none; }
  .lt-tile-info-btn:hover .lt-tile-info-popup { opacity:1; pointer-events:auto; }
  .lt-k6-metric-value { font-size:20px; font-weight:800; color:var(--lt-ink); line-height:1.2; }
  .lt-k6-metric-sub { font-size:11px; color:var(--lt-muted); margin-top:3px; }
  .lt-k6-metric.ok { border-left:3px solid #22c55e; }
  .lt-k6-metric.ok .lt-k6-metric-value { color:#7c5cbf; }
  .lt-k6-metric.fail { border-left:3px solid #ef4444; }
  .lt-k6-metric.fail .lt-k6-metric-value { color:#dc2626; }

  .lt-k6-ready-card { border:1px solid var(--lt-line); border-radius:12px; padding:18px 20px; background:#fff; margin-bottom:14px; }
  .lt-k6-ready-header { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .lt-k6-urlpills { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px; }
  .lt-k6-urlpill { display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:999px;
    border:1px solid var(--lt-line); background:#fafaf5; font-size:11.5px; font-family:monospace; color:var(--lt-ink); transition:border-color .15s, background .15s, color .15s, opacity .15s, box-shadow .15s; }
  .lt-k6-urlpill.active { border-color:#22c55e; background:#f0faf7; color:#7c5cbf; box-shadow:0 0 0 2px #bbf7d0; }
  .lt-k6-urlpill.done  { border-color:#22c55e; background:#f0faf7; color:#7c5cbf; }
  .lt-k6-urlpill-toggle { cursor:pointer; user-select:none; }
  .lt-k6-urlpill-toggle:hover { border-color:var(--lt-accent,#b91c1c); }
  .lt-k6-urlpill-toggle.deselected { opacity:.38; text-decoration:line-through; border-style:dashed; }
  .lt-k6-urlmethod { font-size:9.5px; font-weight:800; letter-spacing:.04em; padding:1px 5px;
    border-radius:4px; background:#ede9e0; color:#5b564d; flex-shrink:0; }
  .lt-k6-urlmethod.GET    { background:#dbeafe; color:#1d4ed8; }
  .lt-k6-urlmethod.POST   { background:#dcfce7; color:#166534; }
  .lt-k6-urlmethod.PUT    { background:#fef3c7; color:#92400e; }
  .lt-k6-urlmethod.DELETE { background:#fee2e2; color:#991b1b; }
  .lt-k6-urlmethod.PATCH  { background:#f3e8ff; color:#7e22ce; }
  @keyframes ltjmshimmer {
    0%   { background-position: 200% center; }
    100% { background-position: -200% center; }
  }
  .lt-jm-pbar-running {
    width: 100% !important;
    background: linear-gradient(90deg, #6366f1 30%, #818cf8 50%, #6366f1 70%);
    background-size: 200% 100%;
    animation: ltjmshimmer 1.8s ease-in-out infinite;
    transition: none !important;
  }
  .lt-result-chart { background:#fafaf5; border:1px solid var(--lt-line); border-radius:10px; padding:14px 16px; margin-bottom:12px; }
  .lt-result-chart-title { font-size:11px; font-weight:700; color:var(--lt-muted); letter-spacing:.06em; text-transform:uppercase; margin-bottom:10px; }
  .lt-result-bar-row { display:flex; align-items:center; gap:10px; margin-bottom:7px; }
  .lt-result-bar-label { min-width:78px; color:var(--lt-muted); font-size:11px; text-align:right; flex-shrink:0; }
  .lt-result-bar-track { flex:1; background:#e8e4dd; border-radius:999px; height:7px; overflow:hidden; }
  .lt-result-bar-fill { height:100%; border-radius:999px; transition:width .8s ease; will-change:width; }
  .lt-result-bar-value { min-width:56px; font-size:11px; font-weight:700; color:var(--lt-ink); font-family:monospace; }
  .lt-output-toggle { display:flex; align-items:center; gap:6px; cursor:pointer; padding:5px 0;
    color:var(--lt-muted); font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
    border-bottom:1px solid var(--lt-line); margin-bottom:8px; user-select:none; }
  .lt-output-toggle:hover { color:var(--lt-ink); }
  .lt-output-toggle .lt-tog-icon { transition:transform .2s; display:inline-block; }
  .lt-output-toggle.open .lt-tog-icon { transform:rotate(90deg); }

  .lt-ampel-row { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px; }
  .lt-ampel-card { border-radius:10px; padding:12px 14px; }
  .lt-ampel-label { font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    color:var(--lt-muted); margin-bottom:4px; display:flex; align-items:center; gap:4px; }
  .lt-ampel-value { font-size:22px; font-weight:900; line-height:1.1; }
  .lt-ampel-sub { font-size:11px; color:var(--lt-muted); margin-top:3px; }

  .lt-rt-chart, .lt-vu-chart { background:#fafaf5; border:1px solid var(--lt-line);
    border-radius:10px; padding:12px 16px; margin-bottom:14px; }
  .lt-rt-chart-title, .lt-vu-chart-title { font-size:11px; font-weight:700; color:var(--lt-muted);
    letter-spacing:.06em; text-transform:uppercase; margin-bottom:8px; }


</style>
</th:block>
</body>
</html>

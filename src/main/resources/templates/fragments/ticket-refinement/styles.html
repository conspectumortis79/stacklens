<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<body>
<th:block th:fragment="styles">
<style>

  :root {
    --sp-bg:      var(--app-cream-2);
    --sp-paper:   var(--app-cream);
    --sp-ink:     var(--app-text);
    --sp-fg:      var(--app-text);
    --sp-muted:   var(--app-text-muted);
    --sp-line:    var(--app-border);
    --sp-accent:  var(--app-accent-purple, #7c5cbf);
    --sp-accent2: var(--app-accent-blue, #5b8ef0);
    --sp-ok:      #16a34a;
    --sp-warn:    #d97706;
    --sp-fail:    #b91c1c;
  }
  .sp-page { color: var(--sp-ink); display:flex; flex-direction:column; gap:16px; padding-bottom:32px; }
  .sp-card {
    background: var(--sp-paper);
    border: 1px solid var(--sp-line);
    border-radius: 16px;
    padding: 22px;
    box-shadow: 0 6px 18px rgba(0,0,0,.06);
  }
  .sp-card-title {
    margin: 0 0 14px;
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--sp-ink);
    display:flex; align-items:center; justify-content:space-between;
  }
  .sp-form { display:flex; flex-direction:column; gap:12px; }
  .sp-row { display:flex; flex-direction:column; gap:6px; }
  .sp-row-grid { display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
  .sp-label {
    font-size: .82rem; font-weight: 600; color: var(--sp-muted);
    display:flex; align-items:center; justify-content:space-between;
  }
  .sp-input {
    background: var(--sp-bg);
    border: 1px solid var(--sp-line);
    border-radius: 10px;
    padding: 9px 12px;
    color: var(--sp-ink);
    font-size: .95rem;
    width: 100%;
    box-sizing: border-box;
    transition: border-color .15s, box-shadow .15s;
  }
  .sp-input:focus { outline:none; border-color: var(--sp-accent); box-shadow: 0 0 0 3px rgba(124,92,191,.18); }
  .sp-textarea { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85rem; resize: vertical; }

  .sp-db-chip {
    display: inline-flex; align-items: center;
    border: 1px solid var(--sp-line); border-radius: 999px;
    padding: 4px 12px; font-size: 11px; font-weight: 600;
    cursor: pointer; user-select: none;
    background: var(--sp-bg); color: var(--sp-ink);
    transition: background .15s, color .15s, border-color .15s;
  }
  .sp-db-chip:hover { background: var(--sp-paper); border-color: var(--sp-accent); }
  .sp-db-chip.selected { background: var(--sp-accent); color: #fff; border-color: var(--sp-accent); }
  .sp-actions { flex-direction:row; justify-content:flex-end; }
  .sp-btn {
    border:none; border-radius: 10px; padding: 9px 16px; font-weight: 600;
    cursor: pointer; font-size: .9rem;
    transition: transform .08s, filter .15s, opacity .15s;
  }
  .sp-btn:disabled { opacity:.5; cursor:not-allowed; }
  .sp-btn:not(:disabled):active { transform: translateY(1px); }
  .sp-btn-primary {
    background: linear-gradient(135deg, var(--sp-accent), var(--sp-accent2));
    color: #fff;
  }
  .sp-btn-primary:not(:disabled):hover { filter: brightness(1.05); }
  .sp-btn-cancel {
    background: var(--sp-fail);
    color: #fff;
    border: none;
  }
  .sp-btn-cancel:not(:disabled):hover { filter: brightness(1.1); }
  .sp-btn-cancel:disabled { opacity: .4; cursor: not-allowed; }
  .sp-btn-secondary {
    background: var(--sp-bg);
    color: var(--sp-ink);
    border: 1px solid var(--sp-line);
  }
  .sp-btn-sm {
    padding: 0.25rem 0.55rem;
    font-size: 0.875rem;
    border-radius: 0.3rem;
  }
  .sp-link {
    background: none; border: none; color: var(--sp-accent);
    cursor: pointer; font-size: .78rem; padding: 0;
  }


  .sp-status {
    font-size: .85rem; color: var(--sp-muted); margin-bottom: 14px;
  }
  .sp-status.error { color: var(--sp-fail); font-weight: 600; }
  .sp-status.cancelled { color: var(--sp-muted); font-style: italic; }
  .sp-results { display:flex; flex-direction:column; gap: 14px; }
  .sp-ticket {
    border: 1px solid var(--sp-line); border-radius: 12px;
    padding: 14px 16px; background: var(--sp-bg);
  }
  .sp-ticket-head {
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    margin-bottom: 10px;
  }
  .sp-ticket-key { font-weight: 700; }
  .sp-ticket-key a { color: var(--sp-accent); text-decoration: none; }
  .sp-ticket-key a:hover { text-decoration: underline; }
  .sp-state {
    font-size: .72rem; font-weight: 700; padding: 3px 8px; border-radius: 999px;
  }
  .sp-state.OK { background: rgba(22,163,74,.15); color: var(--sp-ok); }
  .sp-state.NEEDS_REVIEW { background: rgba(217,119,6,.15); color: var(--sp-warn); }
  .sp-state.FAILED { background: rgba(185,28,28,.15); color: var(--sp-fail); }
  .sp-section-label {
    font-size: .78rem; font-weight: 700; color: var(--sp-muted);
    text-transform: uppercase; letter-spacing: .05em;
    margin: 12px 0 4px;
  }
  .sp-block {
    background: var(--sp-paper);
    border: 1px solid var(--sp-line);
    border-radius: 8px; padding: 10px 12px;
    word-break: break-word;
    font-size: .9rem;
    line-height: 1.65;
  }
  .sp-block--plain { white-space: pre-wrap; }
  .sp-block--md    { white-space: normal; }
  .sp-block--adf   { white-space: normal; }

  .sp-toolbar {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 8px;
    margin: 8px 0;
    padding: 6px 10px;
    background: var(--sp-paper);
    border: 1px solid var(--sp-line);
    border-radius: 8px;
    font-size: .78rem;
    color: var(--sp-muted);
  }
  .sp-toolbar-group { display: flex; gap: 6px; align-items: center; }
  .sp-toolbar-label { font-weight: 600; }
  .sp-toggle {
    display: inline-flex;
    background: var(--sp-bg);
    border: 1px solid var(--sp-line);
    border-radius: 6px;
    overflow: hidden;
  }
  .sp-toggle button {
    font: inherit; font-size: .74rem; font-weight: 500;
    padding: 4px 10px;
    border: 0;
    background: transparent;
    color: var(--sp-muted);
    cursor: pointer;
    line-height: 1.3;
  }
  .sp-toggle button + button { border-left: 1px solid var(--sp-line); }
  .sp-toggle button:hover:not(.on) { background: rgba(124,92,191,.08); color: var(--sp-ink); }
  .sp-toggle button.on {
    background: var(--sp-accent); color: #fff; font-weight: 600;
  }

  .sp-compare {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    border: 1px solid var(--sp-line);
    border-radius: 10px;
    overflow: hidden;
    background: var(--sp-paper);
  }
  .sp-compare-col {
    display: flex; flex-direction: column;
    min-width: 0;
    background: var(--sp-bg);
  }
  .sp-col-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px;
    font-size: .75rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: .06em;
    border-bottom: 1px solid var(--sp-line);
  }
  .sp-col-head--orig {
    background: rgba(9,30,66,.05);
    color: var(--sp-ink);
  }
  .sp-col-head--imp {
    background: linear-gradient(90deg, rgba(124,92,191,.14), rgba(124,92,191,.04));
    color: var(--sp-accent);
  }
  .sp-col-head .sp-col-pill {
    font-size: .65rem;
    padding: 2px 7px;
    border-radius: 999px;
    background: rgba(255,255,255,.7);
    color: var(--sp-muted);
    font-weight: 600;
    letter-spacing: .04em;
  }
  .sp-col-body {
    padding: 10px 12px;
    line-height: 1.55;
  }

  #spResults.sp-layout-stack .sp-compare {
    grid-template-columns: 1fr;
  }

  #spResults.sp-layout-side .sp-compare--stacked,
  #spResults.sp-layout-stack .sp-compare--paired { display: none; }

  .sp-compare--paired {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    align-items: start;
    padding: 0;
  }
  .sp-compare--paired > .sp-col-head { border-bottom: 1px solid var(--sp-line); }
  .sp-compare--paired > .sp-col-head--imp { border-left: 1px solid var(--sp-line); }
  .sp-pair-cell {
    background: var(--sp-bg);
    padding: 8px 12px;
    line-height: 1.55;
    min-width: 0;
  }
  .sp-pair-cell--imp { border-left: 1px solid var(--sp-line); }
  .sp-pair-cell--empty { background: var(--sp-paper); }
  .sp-pair-cell .sp-doc-section { margin: 0; }
  .sp-pair-cell .sp-doc-section + .sp-doc-section { margin-top: 6px; }

  .sp-diff {
    background: rgba(220, 38, 38, 0.13);
    color: #b91c1c;
    border-radius: 2px;
    padding: 0 2px;
    font-weight: 600;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }

  .sp-compare--paired.sp-compare--mono { gap: 12px; padding: 0; align-items: stretch; }
  .sp-compare--paired.sp-compare--mono > .sp-compare-col { display: flex; flex-direction: column; min-width: 0; background: var(--sp-bg); }

  @media (max-width: 760px) {
    .sp-compare--paired { grid-template-columns: 1fr !important; }
    .sp-pair-cell--imp, .sp-compare--paired > .sp-col-head--imp { border-left: 0; }
  }

  #spResults.sp-fs-s .sp-pair-cell { font-size: .76rem; }
  #spResults.sp-fs-s .sp-pair-cell .sp-doc-section-head { font-size: .76rem; padding: 5px 10px; }
  #spResults.sp-fs-s .sp-pair-cell .sp-doc-section-body { font-size: .76rem; padding: 6px 10px 8px; }

  #spResults.sp-fs-m .sp-pair-cell { font-size: .82rem; }
  #spResults.sp-fs-m .sp-pair-cell .sp-doc-section-head { font-size: .80rem; padding: 6px 10px; }
  #spResults.sp-fs-m .sp-pair-cell .sp-doc-section-body { font-size: .82rem; padding: 7px 12px 9px; }

  #spResults.sp-fs-l .sp-pair-cell { font-size: .92rem; }
  #spResults.sp-fs-l .sp-pair-cell .sp-doc-section-head { font-size: .88rem; padding: 7px 12px; }
  #spResults.sp-fs-l .sp-pair-cell .sp-doc-section-body { font-size: .9rem; padding: 9px 14px 11px; }

  @media (max-width: 760px) {
    .sp-compare { grid-template-columns: 1fr !important; }
  }

  #spResults.sp-fs-s .sp-col-body { font-size: .76rem; }
  #spResults.sp-fs-s .sp-col-body .sp-doc-section-head { font-size: .76rem; padding: 5px 10px; }
  #spResults.sp-fs-s .sp-col-body .sp-doc-section-body { font-size: .76rem; padding: 6px 10px 8px; }

  #spResults.sp-fs-m .sp-col-body { font-size: .82rem; }
  #spResults.sp-fs-m .sp-col-body .sp-doc-section-head { font-size: .80rem; padding: 6px 10px; }
  #spResults.sp-fs-m .sp-col-body .sp-doc-section-body { font-size: .82rem; padding: 7px 12px 9px; }

  #spResults.sp-fs-l .sp-col-body { font-size: .92rem; }
  #spResults.sp-fs-l .sp-col-body .sp-doc-section-head { font-size: .88rem; padding: 7px 12px; }
  #spResults.sp-fs-l .sp-col-body .sp-doc-section-body { font-size: .9rem; padding: 9px 14px 11px; }

  #spResults.sp-fs-s .sp-open-points-head { font-size: .80rem; padding: 5px 10px; }
  #spResults.sp-fs-s .sp-open-points-panel .sp-jira-ul { font-size: .76rem; padding: 6px 10px 6px 30px; }
  #spResults.sp-fs-s .sp-open-points-panel .sp-jira-ul li { font-size: .76rem; }

  #spResults.sp-fs-m .sp-open-points-head { font-size: .86rem; padding: 6px 11px; }
  #spResults.sp-fs-m .sp-open-points-panel .sp-jira-ul { font-size: .82rem; padding: 7px 11px 7px 32px; }
  #spResults.sp-fs-m .sp-open-points-panel .sp-jira-ul li { font-size: .82rem; }

  #spResults.sp-fs-l .sp-open-points-head { font-size: .96rem; padding: 8px 13px; }
  #spResults.sp-fs-l .sp-open-points-panel .sp-jira-ul { font-size: .92rem; padding: 9px 13px 9px 36px; }
  #spResults.sp-fs-l .sp-open-points-panel .sp-jira-ul li { font-size: .92rem; }

  .sp-jira-h2 {
    font-size: 1rem; font-weight: 700; color: var(--sp-ink);
    margin: 14px 0 5px; padding-bottom: 4px;
    border-bottom: 2px solid var(--sp-accent);
  }
  .sp-jira-h2:first-child { margin-top: 2px; }
  .sp-jira-h3 {
    font-size: .92rem; font-weight: 700; color: var(--sp-ink);
    margin: 10px 0 3px;
  }
  .sp-jira-p { margin: 0 0 6px; }
  .sp-jira-p:last-child { margin-bottom: 0; }
  .sp-jira-ul, .sp-jira-ol { margin: 3px 0 8px; padding-left: 22px; }
  .sp-jira-ul li, .sp-jira-ol li { margin-bottom: 2px; line-height: 1.55; }

  .sp-doc-section {
    border: 1px solid var(--sp-line);
    border-left-width: 4px;
    border-radius: 10px;
    margin: 8px 0;
    overflow: hidden;
  }
  .sp-doc-section:first-child { margin-top: 0; }
  .sp-doc-section-head {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 12px;
    background: rgba(9,30,66,.04);
    border-bottom: 1px solid var(--sp-line);
    font-weight: 700; font-size: .88rem; color: var(--sp-ink);
  }
  .sp-doc-icon {
    display: inline-block;
    width: 1.2em;
    height: 1.2em;
    font-size: 1.2em;
    line-height: 1;
    margin-right: .4em;
    vertical-align: -.15em;
  }
  .sp-doc-section-body { padding: 8px 14px 10px; }
  .sp-doc-section-body > :first-child { margin-top: 0; }
  .sp-doc-section-body .sp-jira-ul,
  .sp-doc-section-body .sp-jira-ol { margin-bottom: 4px; }
  .sp-doc-section--goal  { border-left-color: var(--sp-accent2); }
  .sp-doc-section--story { border-left-color: var(--sp-accent); }
  .sp-doc-section--ac    { border-left-color: var(--sp-ok); }
  .sp-doc-section--deps  { border-left-color: var(--sp-warn); }
  .sp-doc-section--pre   { border-left-color: var(--sp-warn); }
  .sp-doc-section--notes { border-left-color: var(--sp-accent2); }
  .sp-doc-section--ac    .sp-doc-section-head { background: rgba(22,163,74,.07); }
  .sp-doc-section--deps  .sp-doc-section-head,
  .sp-doc-section--pre   .sp-doc-section-head { background: rgba(217,119,6,.07); }

  .sp-open-points-panel {
    border: 1px solid rgba(217,119,6,.35);
    border-left: 4px solid var(--sp-warn);
    border-radius: 10px;
    margin: 8px 0;
    overflow: hidden;
  }
  .sp-open-points-head {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 12px;
    background: rgba(217,119,6,.07);
    border-bottom: 1px solid rgba(217,119,6,.2);
    font-weight: 700; font-size: .88rem;
    color: var(--sp-warn);
  }
  .sp-open-points-panel .sp-jira-ul {
    margin: 0; padding: 8px 12px 8px 34px;
  }
  .sp-jira-code {
    background: rgba(9,30,66,.08); border-radius: 3px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .83em; padding: 1px 4px;
  }
  .sp-jira-bq {
    border-left: 3px solid var(--sp-accent); padding: 3px 10px;
    margin: 6px 0; color: var(--sp-muted); font-style: italic;
  }
  .sp-jira-hr { border: none; border-top: 1px solid var(--sp-line); margin: 8px 0; }
  .sp-jira-codeblock {
    background: rgba(9,30,66,.06); border: 1px solid var(--sp-line);
    border-radius: 4px; padding: 8px 10px; margin: 6px 0;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .83em; overflow-x: auto; white-space: pre;
  }
  .sp-jira-codeblock code { background: none; padding: 0; border-radius: 0; font-size: inherit; }
  .sp-jira-panel {
    border-radius: 4px; padding: 8px 12px; margin: 6px 0;
    border-left: 4px solid currentColor;
  }
  .sp-jira-panel--info    { background: rgba(0,82,204,.07); color: #0052cc; border-color: #0052cc; }
  .sp-jira-panel--warning { background: rgba(255,153,31,.1); color: #974f0c; border-color: #ff991f; }
  .sp-jira-panel--error   { background: rgba(222,53,11,.07); color: #ae2a19; border-color: #de350b; }
  .sp-jira-panel--success { background: rgba(0,135,90,.07); color: #006644; border-color: #00875a; }
  .sp-jira-panel--note    { background: rgba(9,30,66,.05); color: var(--sp-ink); border-color: var(--sp-muted); }
  .sp-jira-table { border-collapse: collapse; width: 100%; margin: 6px 0 10px; font-size: .88rem; }
  .sp-jira-th, .sp-jira-td {
    border: 1px solid var(--sp-line); padding: 5px 9px;
    text-align: left; vertical-align: top;
  }
  .sp-jira-th { background: rgba(9,30,66,.05); font-weight: 600; }
  .sp-jira-mention {
    background: rgba(0,101,255,.1); color: #0055cc;
    border-radius: 3px; padding: 0 4px; font-weight: 500; font-size: .9em;
  }
  .sp-jira-media-skip {
    color: var(--sp-muted); font-style: italic; font-size: .82rem;
    margin: 4px 0;
  }
  .sp-points { margin: 0; padding-left: 22px; }
  .sp-points li { margin-bottom: 4px; }
  .sp-ticket-actions { margin-top: 12px; display:flex; gap:8px; align-items:center; }
  .sp-comment-posted { color: var(--sp-ok); font-size: .82rem; font-weight: 600; }
  .sp-empty { color: var(--sp-muted); font-style: italic; }

  .sp-hint {
    display:block; color: var(--sp-muted); font-weight: 400;
    font-size: .78rem; margin-top: 2px;
  }
  .sp-checkbox-label {
    display: inline-flex; align-items: center; gap: 8px;
    cursor: pointer; user-select: none; font-weight: 500;
    justify-content: flex-start;
    align-self: flex-start;
  }
  .sp-checkbox-label input[type="checkbox"] {
    width: 16px; height: 16px; margin: 0; cursor: pointer; flex: 0 0 auto;
  }

  .sp-info-icon { color: var(--sp-muted); font-size:.9rem; cursor:default; }
  .sp-info-icon:hover, .sp-info-icon:focus { color: var(--sp-accent); outline:none; }
  .sp-progress-card { padding: 14px 18px; }
  .sp-progress-header {
    display: flex; align-items: center; gap: 10px;
    font-weight: 600; font-size: .9rem; color: var(--sp-accent);
  }
  @keyframes sp-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .sp-progress-spin { font-size: 1.1rem; animation: sp-spin 1.2s linear infinite; display: inline-block; }
  .sp-progress-step { font-size: .82rem; color: var(--sp-muted); margin-top: 6px; padding-left: 26px; }
  .sp-btn-add-repo {
    display: inline-flex; align-items: center; gap: 4px;
    background: transparent;
    border: 1px solid var(--sp-accent);
    border-radius: 6px;
    color: var(--sp-accent);
    padding: 1px 8px;
    font-size: .72rem; font-weight: 600; cursor: pointer; line-height: 1.7;
    transition: background .15s, color .15s, border-color .15s;
    flex-shrink: 0;
  }
  .sp-btn-add-repo:hover, .sp-btn-add-repo:focus {
    background: var(--sp-accent); color: #fff; outline: none;
  }

  .sp-local-repo-card {
    display:flex; align-items:flex-start; gap:10px;
    padding:10px 14px; cursor:pointer;
    background: var(--sp-paper);
    border-radius:8px;
    box-shadow: 0 0 0 1px var(--sp-line), 0 2px 6px 0 rgba(0,0,0,.06);
    transition: background .15s, box-shadow .15s, transform .15s;
    user-select:none;
  }
  .sp-local-repo-card:hover { background: var(--sp-bg); transform: translateY(-1px); }
  .sp-local-repo-card.selected {
    background: rgba(124,92,191,.06);
    box-shadow: inset 3px 0 0 var(--sp-accent), 0 1px 4px 0 rgba(0,0,0,.06);
  }
  .sp-local-repo-checkbox {
    display:inline-flex; align-items:center; justify-content:center;
    width:20px; height:20px; flex:0 0 20px; margin-top:2px;
  }
  .sp-local-repo-cb-icon {
    font-size:16px; color: var(--sp-muted);
    transition: color .15s;
  }
  .sp-local-repo-card.selected .sp-local-repo-cb-icon { color: var(--sp-accent); }
  .sp-local-repo-icon {
    font-size:18px; color: var(--sp-muted); flex:0 0 auto; margin-top:1px;
    transition: color .15s;
  }
  .sp-local-repo-card.selected .sp-local-repo-icon { color: var(--sp-accent); }
  .sp-local-repo-name { font-weight:600; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sp-local-repo-path { font-family:monospace; font-size:11px; color:var(--sp-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sp-local-repo-del {
    background: none;
    border: 1px solid var(--sp-line);
    color: var(--sp-muted);
    cursor: pointer;
    font-size: 11px; font-weight: 600;
    padding: 2px 8px; border-radius: 6px;
    flex-shrink: 0; line-height: 1.4;
    display: flex; align-items: center;
    transition: background .15s, color .15s, border-color .15s;

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<body>
<th:block th:fragment="styles">
<style>
  :root {
    --ga-bg:      var(--app-cream-2);
    --ga-paper:   var(--app-cream);
    --ga-ink:     var(--app-text);
    --ga-muted:   var(--app-text-muted);
    --ga-line:    var(--app-border);
    --ga-accent:  var(--app-accent-purple);
    --ga-accent2: var(--app-accent-yellow);
    --ga-danger:  var(--app-accent-red);
    --ga-blue: #2980b9;
  }

  .ga-page { color: var(--ga-ink); }

  .ga-card {
    background: var(--ga-paper);
    border: 1px solid var(--ga-line);
    border-radius: 18px;
    padding: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,.06);
    margin-bottom: 12px;
  }
  .ga-card h2 {
    font-size: 17px; font-weight: 700; margin: 0 0 10px; color: var(--ga-ink);
    display: flex; align-items: center; gap: 8px;
  }

  .ga-label { font-size: 13px; font-weight: 700; color: #4a4640; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 5px; }
  .ga-input {
    border: 1.5px solid var(--ga-line); border-radius: 10px;
    padding: 9px 14px; font-size: 14px; width: 100%; background: #fff;
  }
  .ga-input:focus { outline: none; border-color: var(--ga-accent); box-shadow: 0 0 0 3px rgba(124, 92, 191,.12); }
  .ga-select {
    border: 1.5px solid var(--ga-line); border-radius: 10px;
    padding: 8px 14px; font-size: 14px; background: #fff; width: 100%;
  }
  .ga-select:focus { outline: none; border-color: var(--ga-accent); box-shadow: 0 0 0 3px rgba(124, 92, 191,.12); }
  .ga-textarea {
    border: 1.5px solid var(--ga-line); border-radius: 10px;
    padding: 10px 14px; font-size: 14px; width: 100%;
    background: #fff; resize: none; min-height: 70px;
  }
  .ga-textarea:focus { outline: none; border-color: var(--ga-accent); box-shadow: 0 0 0 3px rgba(124, 92, 191,.12); }

  .ga-scroll-wrap {
    display: flex; overflow: hidden; flex: 1; min-height: 0;
  }
  .ga-scroll-wrap .ga-textarea {
    flex: 1; min-width: 0; width: auto;
    border-right: none; border-radius: 10px 0 0 10px;
    overflow-y: scroll; scrollbar-width: none; -ms-overflow-style: none;
    resize: none;
  }
  .ga-scroll-wrap .ga-textarea::-webkit-scrollbar { display: none; }
  .ga-scroll-wrap .ga-textarea:focus { box-shadow: none; }
  .ga-scroll-wrap .sl-scroll-track {
    border-radius: 0 10px 10px 0;
    border: 1.5px solid var(--ga-line); border-left: none;
    background: #f0ebff;
  }
  .ga-scroll-wrap .ga-textarea:focus + .sl-scroll-track {
    border-color: var(--ga-accent);
  }

  .ga-btn-primary {
    background: var(--ga-accent); color: #fff; border: 1.5px solid transparent;
    border-radius: 10px; padding: 7px 16px; font-size: 13px; font-weight: 700;
    cursor: pointer; transition: opacity .15s; white-space: nowrap; box-sizing: border-box;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .ga-btn-primary:hover { opacity: .88; }
  .ga-btn-primary:disabled { opacity: .5; cursor: not-allowed; }

  .ga-btn-outline {
    background: transparent; color: var(--ga-accent);
    border: 1.5px solid var(--ga-accent); border-radius: 10px;
    padding: 7px 16px; font-size: 13px; font-weight: 700; cursor: pointer;
    transition: background .15s; display: inline-flex; align-items: center; gap: 5px;
  }
  .ga-btn-outline:hover { background: rgba(124, 92, 191,.08); }

  .ga-note-hint {
    padding: 8px 13px; border-radius: 10px; font-size: 12px; margin: 4px 0;
    color: #7c3aed; background: #ede9fe; border: 1px dashed #b89fe0;
  }

  .ga-changes-list { list-style: none; padding: 0; margin: 0; }
  .ga-changes-list li {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 7px 0; border-bottom: 1px dashed var(--ga-line); font-size: 13px;
  }
  .ga-changes-list li:last-child { border-bottom: none; }
  .ga-change-dot { width: 8px; height: 8px; border-radius: 50%; background: #7c3aed; flex-shrink: 0; margin-top: 5px; }

  .ga-split-container {
    display: flex;
    gap: 0;
    height: 500px;
    margin-bottom: 20px;
  }

  .ga-board-chat-row {
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: auto auto;
    grid-template-areas:
      "board"
      "rebuild";
    gap: 12px;
    margin-bottom: 12px;
  }
  .ga-board-chat-row.no-board {
    grid-template-areas: "rebuild";
    grid-template-rows: auto;
  }
  .ga-board-left {
    grid-area: board;
    min-width: 0;
    min-height: 200px;
    overflow-y: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .ga-board-left::-webkit-scrollbar { display: none; }
  .ga-board-chat-row.no-board .ga-board-left { display: none; }

  .ga-board-chat-row .ga-split-container {
    grid-area: rebuild;
    height: 500px;
    margin-bottom: 0;
  }

  .ga-split-rebuild-only .ga-split-left {
    width: 100%;
    border-radius: 16px;
  }

  .ga-split-left {
    width: 50%;
    min-height: 0;
    overflow-y: hidden;
    background: #f5f0ff;
    border: 1px solid #b89fe0;
    border-radius: 16px 0 0 16px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
  }
  .ga-split-left h2 { font-size: 17px; font-weight: 700; margin: 0 0 10px; color: var(--ga-ink); }

  .ga-split-divider { display: none; }

  .ga-split-right {
    width: 50%;
    min-height: 0;
    overflow: hidden;
    background: #f5f0ff;
    border: 1px solid #b89fe0;
    border-left: none;
    border-radius: 0 16px 16px 0;
    padding: 16px;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
  }
  .ga-split-right h2 { font-size: 17px; font-weight: 700; margin: 0 0 10px; color: var(--ga-ink); display: flex; align-items: center; gap: 8px; }

  .ga-section-grow {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    overflow: visible;
  }
  .ga-section-grow .ga-textarea {
    min-height: 200px;
    resize: none;
    flex: 1;
  }
  .ga-section-grow .ga-scroll-wrap {
    flex: 1; min-height: 0;
  }
  .ga-section-grow .ga-scroll-wrap .ga-textarea {
    min-height: 0; flex: 1; height: auto;
  }

  .ga-section-fixed {
    flex-shrink: 0;
    margin-top: 10px;
  }

  @media (max-width: 900px) {
    .ga-split-container { flex-direction: column; height: auto; }
    .ga-split-left { width: 100% !important; border-radius: 16px 16px 0 0; height: 400px; overflow-y: hidden; }
    .ga-split-divider { display: none; }
    .ga-board-chat-row {
      grid-template-columns: 1fr;
      grid-template-areas:
        "board"
        "rebuild";
      grid-template-rows: auto auto;
    }
    .ga-board-chat-row.no-board {
      grid-template-areas: "rebuild";
      grid-template-rows: auto;
    }
    .ga-board-chat-row .ga-split-container { height: 400px; }
    .ga-split-rebuild-only .ga-split-left { border-radius: 16px !important; }
  }
</style>
</th:block>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<body>
<th:block th:fragment="scripts">
<script th:inline="javascript">
/*<![CDATA[*/

if (!window._tlGen) {
  window._tlGen = { id: null, active: false, pending: false, poll: null, ticker: null, stepText: null, startedAt: null, maxStep: -1, cancelled: new Set() };
}

var _tlMaxStep = (window._tlGen && window._tlGen.maxStep >= 0) ? window._tlGen.maxStep : -1;
if (window._tlGen.poll) { clearTimeout(window._tlGen.poll); window._tlGen.poll = null; }
if (window._tlGen.ticker) { clearInterval(window._tlGen.ticker); window._tlGen.ticker = null; }

var currentGenerationId = window._tlGen.id;

var TL_IDLE_PCT = 15;
var TL_STEP_PCTS = [25, 55, 80];
var TL_POLL_INTERVAL_MS = 3000;
var TL_TICK_INTERVAL_MS = 1000;
var TL_GENERATION_STATUSES = { ANALYZING: 0, GENERATING: 1, BUILDING: 2 };

function tlApplyArgs(template, args) {
  var out = String(template);
  for (var i = 0; i < args.length; i++) out = out.split('{' + i + '}').join(String(args[i]));
  return out;
}

function tlText(key, fallback) {
  var args = Array.prototype.slice.call(arguments, 2);
  if (window.i18n && typeof window.i18n.t === 'function') {
    var translated = window.i18n.t.apply(null, [key].concat(args));
    if (translated !== key) return translated;
  }
  return tlApplyArgs(fallback, args);
}

function tlStepPct(activeStep) {
  return (activeStep >= 0 && activeStep < TL_STEP_PCTS.length) ? TL_STEP_PCTS[activeStep] : TL_IDLE_PCT;
}

function tlSetBarWidth(pct, instant) {
  var bar = document.getElementById('progressBar');
  if (!bar) return;
  if (!instant) {
    bar.style.width = pct + '%';
    return;
  }
  bar.style.transition = 'none';
  bar.style.width = pct + '%';
  void bar.offsetWidth;
  bar.style.transition = '';
}

function tlRenderSteps(activeStep) {
  for (var i = 0; i < TL_STEP_PCTS.length; i++) {
    var el = document.getElementById('gStep' + (i + 1));
    if (!el) continue;
    var ico = el.querySelector('.tl-step-icon');
    if (!ico) continue;
    el.classList.remove('active', 'done');
    ico.classList.remove('active', 'done', 'pending');
    if (i < activeStep) {
      el.classList.add('done'); ico.classList.add('done'); ico.textContent = '✓';
    } else if (i === activeStep) {
      el.classList.add('active'); ico.classList.add('active'); ico.textContent = (i + 1).toString();
    } else {
      ico.classList.add('pending'); ico.textContent = (i + 1).toString();
    }
  }
}

function tlElapsedLabel() {
  var startedAt = window._tlGen ? window._tlGen.startedAt : null;
  if (!startedAt) return '';
  var totalSeconds = Math.max(0, Math.floor((Date.now() - startedAt) / 1000));
  var minutes = Math.floor(totalSeconds / 60);
  var seconds = totalSeconds % 60;
  return minutes + ':' + (seconds < 10 ? '0' : '') + seconds;
}

function tlRenderStepText() {
  var stepText = document.getElementById('progressStepText');
  if (!stepText) return;
  var base = (window._tlGen && window._tlGen.stepText) || tlText('tooling.generating_start', 'Wird gestartet…');
  var elapsed = tlElapsedLabel();
  stepText.textContent = elapsed
    ? base + ' · ' + tlText('tooling.elapsed_since', 'läuft seit {0}', elapsed)
    : base;
}

function tlResetProgress() {
  _tlMaxStep = -1;
  if (window._tlGen) {
    window._tlGen.maxStep = -1;
    window._tlGen.stepText = null;
    window._tlGen.startedAt = Date.now();
  }
  tlRenderSteps(-1);
  tlSetBarWidth(TL_IDLE_PCT, true);
  tlRenderStepText();
}

function showProgress() {
  var form = document.getElementById('newToolFormSection');
  var prog = document.getElementById('newToolProgressSection');
  var err  = document.getElementById('newToolErrorSection');
  if (form) form.style.display = 'none';
  if (prog) prog.style.display = 'block';
  if (err)  err.style.display  = 'none';
}
function hideProgress() {
  var prog = document.getElementById('newToolProgressSection');
  if (prog) prog.style.display = 'none';
}
function openNewToolOverlay() {
  var form = document.getElementById('newToolFormSection');
  var prog = document.getElementById('newToolProgressSection');
  var err  = document.getElementById('newToolErrorSection');
  if (form) form.style.display = 'block';
  if (prog) prog.style.display = 'none';
  if (err)  err.style.display  = 'none';
  var genBtn = document.getElementById('btnGenerate');
  if (genBtn) genBtn.disabled = false;
}
function closeNewToolOverlay() {
  openNewToolOverlay();
  var nameEl    = document.getElementById('inputToolName');
  var scriptEl  = document.getElementById('inputScriptContent');
  var alertArea = document.getElementById('tlFormAlertArea');
  if (nameEl)    nameEl.value    = '';
  if (scriptEl)  scriptEl.value  = '';
  if (alertArea) alertArea.innerHTML = '';
}
function showError(msg) {
  var form = document.getElementById('newToolFormSection');
  var prog = document.getElementById('newToolProgressSection');
  var err  = document.getElementById('newToolErrorSection');
  var msgEl = document.getElementById('errorMessage');
  if (form)  form.style.display = 'none';
  if (prog)  prog.style.display = 'none';
  if (err)   err.style.display  = 'block';
  if (msgEl) msgEl.textContent  = msg || '';
  var genBtn = document.getElementById('btnGenerate');
  if (genBtn) genBtn.disabled = false;
}
function hideError() {
  var err = document.getElementById('newToolErrorSection');
  if (err) err.style.display = 'none';
}
function tlShowFormAlert(msg) {
  var area = document.getElementById('tlFormAlertArea');
  if (!area) return;
  area.innerHTML = '<div style="color:#dc2626;font-size:13px;padding:6px 10px;background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.25);border-radius:6px;margin-top:6px;">' + msg + '</div>';
}

async function startGeneration() {
  const name = document.getElementById('inputToolName').value.trim();
  const scriptContent = document.getElementById('inputScriptContent').value.trim();

  document.getElementById('tlFormAlertArea').innerHTML = '';

  if (!name) { tlShowFormAlert(window.i18n ? window.i18n.t('tooling.enter_tool_name') : 'Bitte einen Tool-Namen eingeben.'); return; }
  if (!scriptContent) {
    tlShowFormAlert(window.i18n ? window.i18n.t('tooling.enter_code') : 'Bitte einen Code oder ein Skript eingeben.');
    return;
  }

  document.getElementById('btnGenerate').disabled = true;
  tlResetProgress();
  hideError();
  showProgress();

  try {
    const payload = { name: name, scriptContent: scriptContent };

    const res = await fetch('/api/tooling', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!res.ok) {
      showError(data.error || (window.i18n ? window.i18n.t('tooling.error_load') : 'Fehler beim Starten der Generierung.'));
      return;
    }
    currentGenerationId = data.id;
    window._tlGen.id = data.id;
    if (typeof tlInitTokenUsageBar === 'function') tlInitTokenUsageBar();
    window._tlGen.active = true;
    window._tlGen.pending = true;
    startPolling(data.id);
  } catch (e) {
    showError((window.i18n ? window.i18n.t('tooling.error_network') : 'Netzwerkfehler:') + ' ' + e.message);
  }
}

function startPolling(id) {
  clearPoll();
  tlStartTicker();
  (function scheduleNext(delay) {
    window._tlGen.poll = setTimeout(async () => {
      try {
        await pollStatus(id);
      } catch (e) {
        console.warn('[Tooling] status poll failed', e);
      }
      if (window._tlGen.active) scheduleNext(TL_POLL_INTERVAL_MS);
    }, delay);
  })(0);
}

function clearPoll() {
  if (window._tlGen.poll) { clearTimeout(window._tlGen.poll); window._tlGen.poll = null; }
}

function tlStartTicker() {
  if (!window._tlGen.ticker) window._tlGen.ticker = setInterval(tlRenderStepText, TL_TICK_INTERVAL_MS);
}

function tlStopTicker() {
  if (window._tlGen.ticker) { clearInterval(window._tlGen.ticker); window._tlGen.ticker = null; }
}

function stopGenerationPolling() {
  clearPoll();
  tlStopTicker();
  window._tlGen.active = false;
  window._tlGen.pending = false;
}

function tlFinishGeneration() {
  stopGenerationPolling();
  window._tlGen.id = null;
  currentGenerationId = null;
}

function cancelToolingGeneration() {
  const id = window._tlGen.id;
  if (id) {
    window._tlGen.cancelled.add(id);
    fetch(`/api/tooling/${id}/cancel`, { method: 'POST' }).catch(() => {});
  }
  tlFinishGeneration();
  openNewToolOverlay();
}

async function pollStatus(id) {
  const res = await tlFetchStatus(id);

  if (res.gone) {
    tlFinishGeneration();
    hideProgress();
    openNewToolOverlay();
    showAlert(tlText('tooling.tool_gone', 'Tool wurde entfernt oder ist nicht mehr vorhanden.'), 'warning');
    await reloadToolList(true);
    return;
  }
  if (res.retry) return;

  const data = res.data;
  updateProgress(data.status, data.currentStep);

  if (data.status === 'READY') {
    tlFinishGeneration();
    hideProgress();
    closeNewToolOverlay();
    showAlert(tlText('tooling.success_generated', 'Tool erfolgreich generiert und kompiliert!'), 'success');
    await reloadToolList(true);
  } else if (data.status === 'FAILED') {
    tlFinishGeneration();
    hideProgress();
    showError(data.errorMessage || tlText('tooling.generate_failed', 'Generierung fehlgeschlagen.'));
  } else if (data.status === 'CANCELLED') {
    tlFinishGeneration();
    hideProgress();
    showError(data.errorMessage || tlText('tooling.generation_aborted', 'Generierung abgebrochen. Starte die Generierung neu.'));
  }
}

function updateProgress(status, currentStep) {
  const known = Object.prototype.hasOwnProperty.call(TL_GENERATION_STATUSES, status);
  const active = known ? TL_GENERATION_STATUSES[status] : -1;

  if (active > _tlMaxStep) _tlMaxStep = active;
  if (window._tlGen) window._tlGen.maxStep = _tlMaxStep;
  if (window._tlGen && currentStep && active >= _tlMaxStep) window._tlGen.stepText = currentStep;

  tlRenderSteps(_tlMaxStep);
  tlSetBarWidth(tlStepPct(_tlMaxStep), false);
  tlRenderStepText();
}

function runTool(id) {
  const btn = document.getElementById('btnRun-' + id);
  const btnQuick = document.getElementById('btnRunQuick-' + id);
  const runArea = document.getElementById('runArea-' + id);
  const runOutput = document.getElementById('runOutput-' + id);

  if (btn) btn.disabled = true;
  if (btnQuick) btnQuick.disabled = true;
  if (runArea) runArea.style.display = 'block';
  if (runOutput) runOutput.textContent = window.i18n ? window.i18n.t('tooling.running_output') : 'Wird ausgeführt…';

  var accumulated = '';
  var es = new EventSource('/api/tooling/' + id + '/run-stream');

  es.addEventListener('line', function(e) {
    accumulated += e.data + '\n';
    if (runOutput) runOutput.textContent = accumulated;
    if (runOutput) runOutput.scrollTop = runOutput.scrollHeight;
  });

  es.addEventListener('done', function() {
    es.close();
    if (btn) btn.disabled = false;
    if (btnQuick) btnQuick.disabled = false;
  });

  es.addEventListener('error', function(e) {
    es.close();
    var msg = (e.data || '');
    if (runOutput && msg) runOutput.textContent = (accumulated ? accumulated + '\n' : '') + (window.i18n ? window.i18n.t('tooling.error_run') : 'Fehler:') + ' ' + msg;
    if (btn) btn.disabled = false;
    if (btnQuick) btnQuick.disabled = false;
  });

  es.onerror = function(ev) {
    if (es.readyState === EventSource.CLOSED) {
      if (btn) btn.disabled = false;
      if (btnQuick) btnQuick.disabled = false;
    }
  };
}

function toggleDetail(id) {
  const el = document.getElementById('detail-' + id);
  if (!el) return;
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

async function copyCode(id) {
  const el = document.getElementById('code-' + id);
  if (!el) return;
  try {
    await navigator.clipboard.writeText(el.textContent || '');
    showAlert(window.i18n ? window.i18n.t('tooling.copied_clipboard') : 'Code in Zwischenablage kopiert.', 'success');
  } catch (e) {
    showAlert((window.i18n ? window.i18n.t('tooling.copy_failed') : 'Kopieren nicht möglich:') + ' ' + e.message, 'warning');
  }
}

function deleteTool(id) {
  showConfirm(
    window.i18n ? window.i18n.t('tooling.delete_confirm') : 'Tool und JAR-Datei löschen?',
    window.i18n ? window.i18n.t('tooling.delete_title') : 'Tool löschen',
    async function() {
    await fetch(`/api/tooling/${id}`, { method: 'DELETE' });
    await reloadToolList();
  });
}

async function reloadToolList(autoExpandSidebar = false) {
  try {
    const res = await fetch('/api/tooling', { cache: 'no-store' });
    if (!res.ok) return;
    const list = await res.json();

    const container = document.getElementById('toolListContent');
    if (!container) return;

    if (list.length === 0) {
      container.innerHTML = `<div class="tl-empty"><i class="bi bi-tools"></i><p>${window.i18n ? window.i18n.t('tooling.no_tools') : 'Noch keine Tools generiert.'}</p></div>`;
      if (typeof loadSidebarTools === 'function') loadSidebarTools(false);
      return;
    }

    container.innerHTML = list.map(t => {
      const badgeCls = 'tl-badge tl-badge-' + t.status.toLowerCase();
      const safeName = escHtml(t.name).replace(/'/g, "\\'");
      const runBtn = t.status === 'READY'
        ? `<button class="tl-btn-run" onclick="runTool(${t.id})" id="btnRun-${t.id}">
             <i class="bi bi-play-fill me-1"></i>${window.i18n ? window.i18n.t('tooling.run') : 'Ausführen'}
           </button>
           <button onclick="exportTool(${t.id}, '${safeName}')" class="tl-btn-outline">
             <i class="bi bi-download me-1"></i>Export
           </button>` : '';
      const editBtn = (t.status === 'READY' || t.status === 'FAILED')
        ? `<button class="tl-btn-outline" onclick="editTool(${t.id})">
             <i class="bi bi-pencil me-1"></i>${window.i18n ? window.i18n.t('tooling.edit') : 'Bearbeiten'}
           </button>` : '';
      const promptBtn = t.hasGenerationPrompt
        ? `<button class="tl-btn-outline" onclick="showPrompt(${t.id})">
             <i class="bi bi-chat-left-text me-1"></i>Prompt
           </button>` : '';
      const createdAt = t.createdAt ? t.createdAt.substring(0, 16).replace('T', ' ') : '';
      const lastRun   = t.lastRunAt ? t.lastRunAt.substring(0, 16).replace('T', ' ') : '';
      const typeLabel = t.confluencePageUrl === 'SCRIPT' ? (window.i18n ? window.i18n.t('tooling.type_script') : 'Skript/Code')
                     : (t.confluencePageUrl === 'IMPORTED' ? (window.i18n ? window.i18n.t('tooling.type_imported') : 'Importiert')
                     : escHtml(t.confluencePageUrl));

      return `
        <div class="tl-tool" id="tool-${t.id}">
          <div class="d-flex align-items-start justify-content-between gap-3">
            <div style="flex:1;min-width:0">
              <div class="d-flex align-items-center gap-2 mb-1">
                <span class="tl-tool-name">${escHtml(t.name)}</span>
                <span class="${escHtml(badgeCls)}">${escHtml(t.status)}</span>
              </div>
              <div class="tl-tool-url text-truncate" style="max-width: 400px; display: inline-block;">
                <i class="bi bi-file-earmark-code me-1"></i>
                <span style="color:var(--tl-muted)">${typeLabel}</span>
              </div>
              <div class="tl-tool-meta">${window.i18n ? window.i18n.t('tooling.created_at') : 'Erstellt:'} ${escHtml(createdAt)}${lastRun ? ' · ' + (window.i18n ? window.i18n.t('tooling.last_run') : 'Zuletzt ausgeführt:') + ' ' + lastRun.substring(15) : ''}</div>
            </div>
            <div class="d-flex gap-2 flex-shrink-0">
              ${runBtn}
              ${editBtn}
              ${promptBtn}
              <button class="tl-btn-outline" onclick="loadAndShowDetail(${t.id})">
                <i class="bi bi-code-slash me-1"></i>Code
              </button>
              <button class="btn btn-sm btn-outline-danger" onclick="deleteTool(${t.id})">
                <i class="bi bi-trash"></i>
              </button>
              <button class="btn btn-sm ${t.status === 'READY' ? 'btn-success' : 'btn-outline-secondary'}"
                      onclick="runTool(${t.id})" id="btnRunQuick-${t.id}"
                      ${t.status !== 'READY' ? 'disabled' : ''}
                      title="${window.i18n ? window.i18n.t('tooling.run') : 'Ausführen'}">
                <i class="bi bi-play-fill"></i>
              </button>
            </div>
          </div>
          <div id="detail-${t.id}" style="display:none"></div>
          <div id="runArea-${t.id}" style="display:none" class="mt-3">
            <div style="font-size:13px;font-weight:600">Ausgabe</div>
            <pre id="runOutput-${t.id}" class="tl-output"></pre>
          </div>
        </div>`;
    }).join('');

    if (typeof loadSidebarTools === 'function') {
      loadSidebarTools(autoExpandSidebar);
    }
    var listContent = document.getElementById('toolListContent');
    var listChevron = document.getElementById('toolListChevron');
    if (listContent && (autoExpandSidebar || (listContent.style.display === 'none' && sessionStorage.getItem('tl_toolList_open') !== '0'))) {
      listContent.style.display = 'block';
      if (listChevron) listChevron.style.transform = 'rotate(0deg)';
      sessionStorage.setItem('tl_toolList_open', '1');
    }
  } catch (_) {}
}

async function loadAndShowDetail(id) {
  const detailEl = document.getElementById('detail-' + id);
  if (!detailEl) return;

  if (detailEl.style.display !== 'none') {
    detailEl.style.display = 'none';
    return;
  }

  try {
    const res  = await fetch(`/api/tooling/${id}`);
    const data = await res.json();
    let html = '';

    if (data.generatedCode) {
      html += `
        <div class="mt-3 d-flex align-items-center gap-2">
          <span style="font-size:13px;font-weight:600">${window.i18n ? window.i18n.t('tooling.generated_code_title') : 'Generierter Kotlin-Code'}</span>
          <button class="tl-btn-outline" style="padding:3px 10px;font-size:12px"
                  onclick="copyCodeDyn(${id})">
            <i class="bi bi-clipboard me-1"></i>${window.i18n ? window.i18n.t('tooling.copy') : 'Kopieren'}
          </button>
        </div>
        <pre class="tl-code" id="codeDyn-${id}">${escHtml(data.generatedCode)}</pre>`;
    }
    if (data.lastRunOutput) {
      html += `
        <div class="mt-3"><div style="font-size:13px;font-weight:600">${window.i18n ? window.i18n.t('tooling.last_output') : 'Letzte Ausgabe'}</div>
        <pre class="tl-output">${escHtml(data.lastRunOutput)}</pre></div>`;
    }
    if (!html) {
      html = `<div class="text-muted mt-2" style="font-size:13px">${window.i18n ? window.i18n.t('tooling.no_code') : 'Kein Code verfügbar.'}</div>`;
    }

    detailEl.innerHTML = html;
    detailEl.style.display = 'block';
  } catch (e) {
    if (detailEl) { detailEl.innerHTML = `<div class="text-danger mt-2">${window.i18n ? window.i18n.t('tooling.error_load') : 'Fehler beim Laden.'}</div>`; detailEl.style.display = 'block'; }
  }
}

async function copyCodeDyn(id) {
  const el = document.getElementById('codeDyn-' + id);
  if (!el) return;
  try { await navigator.clipboard.writeText(el.textContent || ''); showAlert(window.i18n ? window.i18n.t('tooling.copied_clipboard') : 'Code kopiert.', 'success'); }
  catch (e) { showAlert(window.i18n ? window.i18n.t('tooling.copy_failed') : 'Kopieren nicht möglich.', 'warning'); }
}

/*]]>*/
</script>

<script>
(function() {
  const focusId = new URLSearchParams(window.location.search).get('focus');
  if (focusId) {
    showFocusedTool(parseInt(focusId, 10));
    return;
  }

  if (window._tlGen.pending && window._tlGen.id && !window._tlGen.cancelled.has(window._tlGen.id)) {
    const resumeId = window._tlGen.id;
    const _card = document.getElementById('newToolCard');
    if (!_card) return;
    _card.style.display = 'block';
    window._tlGen.active = true;
    if (!window._tlGen.startedAt) window._tlGen.startedAt = Date.now();
    showProgress();
    tlRenderSteps(_tlMaxStep);
    tlSetBarWidth(tlStepPct(_tlMaxStep), true);
    tlRenderStepText();
    startPolling(resumeId);
  }
})();

function tlToggleToolList() {
  var content = document.getElementById('toolListContent');
  var chevron = document.getElementById('toolListChevron');
  if (!content) return;
  var visible = content.style.display !== 'none';
  content.style.display = visible ? 'none' : 'block';
  if (chevron) chevron.style.transform = visible ? 'rotate(-90deg)' : 'rotate(0deg)';
  sessionStorage.setItem('tl_toolList_open', visible ? '0' : '1');
}

(function tlRestoreAccordionState() {
  var savedState = sessionStorage.getItem('tl_toolList_open');
  var listContent = document.getElementById('toolListContent');
  var listChevron = document.getElementById('toolListChevron');
  if (listContent && savedState !== null) {
    var open = savedState === '1';
    listContent.style.display = open ? 'block' : 'none';
    if (listChevron) listChevron.style.transform = open ? 'rotate(0deg)' : 'rotate(-90deg)';
  }
})();

document.addEventListener('app:navigate', function() {
  var savedState = sessionStorage.getItem('tl_toolList_open');
  var listContent = document.getElementById('toolListContent');
  var listChevron = document.getElementById('toolListChevron');
  if (listContent && savedState !== null) {
    var open = savedState === '1';
    listContent.style.display = open ? 'block' : 'none';
    if (listChevron) listChevron.style.transform = open ? 'rotate(0deg)' : 'rotate(-90deg)';
  }
});
</script>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<body>
<th:block th:fragment="styles">
<style>

  :root {
    --ts-bg:        var(--app-cream-2);
    --ts-paper:     var(--app-cream);
    --ts-ink:       var(--app-text);
    --ts-fg:        var(--app-text);
    --ts-muted:     var(--app-text-muted);
    --ts-line:      var(--app-border);
    --ts-accent:    var(--app-accent-purple, #7c5cbf);
    --ts-accent-2:  var(--app-accent-blue,   #5b8ef0);
    --ts-ok:        #16a34a;
    --ts-warn:      #d97706;
    --ts-fail:      #b91c1c;
    --ts-info:      #1a4a8c;
    --ts-neutral:   #4b5563;
  }

  .ts-page {
    max-width: 100%;
    margin: 0 auto;
    padding: 6px 4px 30px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .ts-page-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .ts-page-action-prompt {
    background: var(--ts-bg) !important;
    border-color: var(--ts-line) !important;
    color: var(--ts-ink) !important;
  }
  .ts-page-action-prompt:hover,
  .ts-page-action-prompt:focus {
    background: var(--ts-paper) !important;
    border-color: var(--ts-accent) !important;
    color: var(--ts-accent) !important;
  }
  .ts-page-action-ki-chat {
    background: linear-gradient(135deg, var(--ts-accent), var(--ts-accent-2)) !important;
    color: #fff !important;
    border: none !important;
  }
  .ts-page-action-ki-chat:hover,
  .ts-page-action-ki-chat:focus {
    filter: brightness(1.06) !important;
    color: #fff !important;
  }

  .ts-card {
    background: var(--ts-paper);
    border: 1px solid var(--ts-line);
    border-radius: 14px;
    padding: 18px 20px 20px;
    box-shadow: 0 1px 0 rgba(0, 0, 0, .02);
  }
  .ts-card-title {
    font-size: 1.05rem;
    font-weight: 800;
    color: var(--ts-ink);
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .ts-card-title > span:first-child {
    flex: 1;
  }

  .ts-form { display: flex; flex-direction: column; gap: 12px; }
  .ts-row  { display: flex; flex-direction: column; gap: 5px; }
  .ts-row.ts-actions { flex-direction: row; justify-content: flex-end; gap: 8px; margin-top: 6px; }
  .ts-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--ts-muted);
    text-transform: uppercase;
    letter-spacing: .04em;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .ts-input,
  .ts-textarea {
    background: var(--app-cream-2, #faf6ec);
    color: var(--ts-ink);
    border: 1.5px solid var(--ts-line);
    border-radius: 10px;
    padding: 8px 12px;
    font: inherit;
    font-size: 14px;
    width: 100%;
    box-sizing: border-box;
    transition: border-color .15s, box-shadow .15s;
  }
  .ts-textarea { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
  .ts-input:focus,
  .ts-textarea:focus {
    outline: none;
    border-color: var(--ts-accent);
    box-shadow: 0 0 0 2px rgba(124, 92, 191, .18);
  }
  .ts-link {
    background: transparent;
    border: none;
    color: var(--ts-accent);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    text-transform: none;
    letter-spacing: 0;
    padding: 0;
  }
  .ts-link:hover { text-decoration: underline; }

  .ts-btn {
    border-radius: 10px;
    padding: 8px 16px;
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    border: 1.5px solid transparent;
    transition: filter .12s, opacity .12s, background .12s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .ts-btn:disabled { opacity: .5; cursor: not-allowed; }
  .ts-btn:not(:disabled):hover { filter: brightness(1.04); }
  .ts-btn-primary {
    background: linear-gradient(135deg, var(--ts-accent), var(--ts-accent-2));
    color: #fff;
    border: none;
  }
  .ts-btn-cancel {
    background: var(--ts-bg);
    color: var(--ts-ink);
    border-color: var(--ts-line);
  }
  .ts-btn-secondary {
    background: var(--ts-bg);
    color: var(--ts-ink);
    border-color: var(--ts-line);
  }
  .ts-progress-card {
    border-color: color-mix(in srgb, var(--ts-warn) 35%, transparent);
    background: color-mix(in srgb, var(--ts-warn) 7%, transparent);
  }
  .ts-progress-header {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    color: var(--ts-warn, #6b4e00);
    font-size: 14px;
  }
  .ts-progress-spin {
    animation: ts-spin 1.2s linear infinite;
    color: var(--ts-warn, #b45309);
  }
  @keyframes ts-spin { to { transform: rotate(360deg); } }
  .ts-progress-step {
    margin-top: 8px;
    font-size: 13px;
    color: var(--ts-warn, #6b4e00);
  }

  .ts-status {
    font-size: 13px;
    font-weight: 600;
    color: var(--ts-muted);
    margin-bottom: 10px;
  }
  .ts-status.error { color: var(--ts-fail, #b91c1c); }
  .ts-status.cancelled { color: var(--ts-muted); font-style: italic; }

  .ts-results { line-height: 1.55; }

  .ts-results .ts-doc { font-size: 14px; }
  .ts-results .ts-doc-h2 {
    font-size: 1.05rem;
    font-weight: 800;
    color: var(--ts-ink);
    margin: 16px 0 6px;
  }
  .ts-results .ts-doc-h3 {
    font-size: .98rem;
    font-weight: 700;
    color: var(--ts-ink);
    margin: 12px 0 4px;
  }
  .ts-results .ts-doc-p { margin: 6px 0; color: var(--ts-ink); }
  .ts-results .ts-doc-ul,
  .ts-results .ts-doc-ol { margin: 6px 0 6px 20px; }
  .ts-results .ts-doc-ul li,
  .ts-results .ts-doc-ol li { margin: 3px 0; }
  .ts-results .ts-doc-bq {
    margin: 8px 0;
    padding: 8px 12px;
    border-left: 3px solid rgba(124, 92, 191, .35);
    background: rgba(124, 92, 191, .06);
    border-radius: 8px;
    color: var(--ts-ink);
  }
  .ts-results .ts-doc-hr {
    border: none;
    border-top: 1px dashed var(--ts-line);
    margin: 14px 0;
  }
  .ts-results .ts-doc-code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: rgba(124, 92, 191, .10);
    color: var(--ts-accent);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 12.5px;
  }
  .ts-results .ts-doc-section {
    border-radius: 12px;
    border: 1px solid var(--ts-line);
    background: var(--ts-bg);
    margin: 12px 0;
    overflow: hidden;
  }
  .ts-results .ts-doc-section-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    font-weight: 800;
    font-size: 14px;
    color: var(--ts-ink);
    background: rgba(124, 92, 191, .08);
    border-bottom: 1px solid var(--ts-line);
  }
  .ts-results .ts-doc-section--overview     .ts-doc-section-head { background: rgba(91, 142, 240, .10); }
  .ts-results .ts-doc-section--requirements .ts-doc-section-head { background: rgba(124, 92, 191, .10); }
  .ts-results .ts-doc-section--ac          .ts-doc-section-head { background: rgba(22, 163, 74, .10); }
  .ts-results .ts-doc-section--discussion  .ts-doc-section-head { background: rgba(91, 142, 240, .10); }
  .ts-results .ts-doc-section--open        .ts-doc-section-head { background: rgba(234, 88, 12, .10); }
  .ts-results .ts-doc-section--next        .ts-doc-section-head { background: rgba(22, 163, 74, .10); }
  .ts-results .ts-doc-section--risks       .ts-doc-section-head { background: rgba(234, 88, 12, .10); }
  .ts-results .ts-doc-section--assumptions .ts-doc-section-head { background: rgba(124, 92, 191, .10); }
  .ts-results .ts-doc-section-body { padding: 12px 16px; }
  .ts-results .ts-doc-icon { font-size: 1.05rem; }

  .ts-original-wrap {
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px solid var(--ts-line);
  }
  .ts-original-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--ts-muted);
    text-transform: uppercase;
    letter-spacing: .04em;
    margin: 0 0 6px;
  }
  .ts-original-text {
    background: var(--ts-bg);
    border: 1px solid var(--ts-line);
    border-radius: 8px;
    padding: 12px 14px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12.5px;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--ts-ink);
    max-height: 480px;
    overflow: auto;
    margin: 0;
  }

</style>
</th:block>
</body>
</html>

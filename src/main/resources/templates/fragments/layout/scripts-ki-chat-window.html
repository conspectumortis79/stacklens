<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<body>
<th:block th:fragment="scripts-ki-chat-window">
<script th:inline="none">
function kiChatToast(msg, kind) {
  try {
    var host = document.getElementById('kiChatToastHost');
    if (!host) {
      host = document.createElement('div');
      host.id = 'kiChatToastHost';
      host.style.cssText = 'position:fixed;top:20px;right:20px;z-index:3000;display:flex;flex-direction:column;gap:8px;pointer-events:none;';
      document.body.appendChild(host);
    }
    var palettes = {
      info:    { bg: 'linear-gradient(135deg,#fffdf8,#f6f1e6)', border: '#ddd7cb', icon: 'bi-info-circle', accent: '#7c5cbf' },
      warn:    { bg: 'linear-gradient(135deg,#fffaf0,#ffeed8)', border: '#f0c97a', icon: 'bi-exclamation-triangle', accent: '#b06d10' },
      error:   { bg: 'linear-gradient(135deg,#fff2f2,#ffe1e1)', border: '#f0a0a0', icon: 'bi-x-octagon', accent: '#a82626' },
      success: { bg: 'linear-gradient(135deg,#f1fff4,#dafce5)', border: '#9bd9ad', icon: 'bi-check-circle', accent: '#1e7a3a' }
    };
    var _toastTheme = (document.documentElement.getAttribute('data-theme') || 'modern').toLowerCase();
    var _toastDark  = (_toastTheme === 'dark' || _toastTheme === 'midnight' || _toastTheme === 'noir' || _toastTheme === 'popos');
    if (_toastDark) palettes = {
      info:    { bg: 'linear-gradient(135deg,#222234,#1b1b2b)', border: '#363650', icon: 'bi-info-circle', accent: '#faa41a' },
      warn:    { bg: 'linear-gradient(135deg,#2d2510,#221c0a)', border: '#5c4a1a', icon: 'bi-exclamation-triangle', accent: '#fcd34d' },
      error:   { bg: 'linear-gradient(135deg,#2d1515,#1e0e0e)', border: '#5c2020', icon: 'bi-x-octagon', accent: '#f87171' },
      success: { bg: 'linear-gradient(135deg,#1e2d20,#141e16)', border: '#2e5432', icon: 'bi-check-circle', accent: '#5fce84' }
    };
    var p = palettes[kind] || palettes.info;
    var el = document.createElement('div');
    el.style.cssText =
      'pointer-events:auto;min-width:260px;max-width:420px;padding:11px 14px;border-radius:12px;'
      + 'background:' + p.bg + ';border:1.5px solid ' + p.border + ';'
      + 'box-shadow:0 8px 24px rgba(0,0,0,.15);font-size:13px;color:#1f1f1f;'
      + 'display:flex;align-items:flex-start;gap:10px;font-family:inherit;'
      + 'transition:opacity .25s ease, transform .25s ease;opacity:0;transform:translateY(-6px);';
    el.innerHTML =
      '<i class="bi ' + p.icon + '" style="color:' + p.accent + ';font-size:16px;flex-shrink:0;margin-top:1px;"></i>'
      + '<div style="flex:1;line-height:1.5;">' + __kiChatEsc(String(msg || '')) + '</div>'
      + '<button title="' + (window.i18n ? window.i18n.t('common.close') : 'Schließen') + '" style="background:none;border:none;color:#6a665f;font-size:16px;line-height:1;cursor:pointer;padding:0 2px;">&times;</button>';
    el.querySelector('button').onclick = function(){ el.remove(); };
    host.appendChild(el);
    requestAnimationFrame(function(){ el.style.opacity = '1'; el.style.transform = 'translateY(0)'; });
    setTimeout(function(){
      try { el.style.opacity = '0'; el.style.transform = 'translateY(-6px)'; setTimeout(function(){ el.remove(); }, 260); } catch(_){}
    }, kind === 'error' ? 6500 : 4500);
  } catch(_){
    try { console.warn('toast', msg); } catch(__){}
  }
}
window.kiChatToast = kiChatToast;

function kiChatOpenWindow(spec) {
  if (!spec || !spec.type) return;
  function _resolveRepoPath() {
    var repoPath = spec.repoPath || '';
    if (!repoPath) {
      try {
        var cfg = (typeof window.kiChatResolveConfig === 'function')
          ? window.kiChatResolveConfig()
          : (window.kiChatConfig || null);
        var sugg = (cfg && cfg.suggestions) || [];
        for (var i = 0; i < sugg.length; i++) {
          var s = sugg[i];
          if (s && s.action === 'make' && typeof s.repoPathProvider === 'function') {
            repoPath = s.repoPathProvider() || '';
            if (repoPath) break;
          }
        }
      } catch(_){}
    }
    if (!repoPath) {
      try {
        if (typeof AP_REPO_PATH !== 'undefined' && AP_REPO_PATH) {
          repoPath = AP_REPO_PATH;
        } else {
          var sel = document.querySelector('.ta-local-repo-card.selected');
          if (sel) {
            var p = sel.querySelector('.ta-local-repo-path');
            if (p) repoPath = (p.textContent || '').trim();
          }
        }
      } catch(_){}
    }
    return repoPath;
  }
  if (spec.type === 'make') {
    var repoPath = _resolveRepoPath();
    if (!repoPath) { kiChatToast(window.i18n ? window.i18n.t('ki_chat.no_repo_selected') : 'Kein Repository ausgewählt. Bitte wähle erst ein Repository in diesem Reiter aus.', 'warn'); return; }
    return kiChatRunAction({ action: 'make', target: spec.target || 'test', repoPath: repoPath });
  }
  __kiChatOpenStackLensWindow(spec);
}
function __kiChatOpenStackLensWindow(spec) {
  var existing = document.getElementById('kiChatGenericModal');
  if (existing) existing.remove();
  var w = Math.max(320, Math.min(window.innerWidth - 40, spec.width || 880));
  var h = Math.max(220, Math.min(window.innerHeight - 60, spec.height || 620));
  var _slwTh = (document.documentElement.getAttribute('data-theme') || 'modern').toLowerCase();
  var _slwDk = (_slwTh === 'dark' || _slwTh === 'midnight' || _slwTh === 'noir' || _slwTh === 'popos');
  var slwBg     = _slwDk ? '#1b1b2b' : '#fffdf8';
  var slwBorder = _slwDk ? '#363650' : '#ddd7cb';
  var slwFg     = _slwDk ? '#e8e8f0' : '#1f1f1f';
  var slwMuted  = _slwDk ? '#9090a8' : '#6a665f';
  var slwHdrBg  = _slwDk ? 'linear-gradient(135deg,rgba(250,164,26,.13),rgba(72,185,199,.07))' : 'linear-gradient(135deg,#7c5cbf22,#5b8ef012)';
  var slwAccent = _slwDk ? '#faa41a' : '#7c5cbf';
  var slwDlBorder = _slwDk ? '#a06010' : '#c9b8f5';
  var slwDlFg   = _slwDk ? '#faa41a' : '#5a3fa3';
  var overlay = document.createElement('div');
  overlay.id = 'kiChatGenericModal';
  overlay.style.cssText = 'position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;';
  var bodyBg = (spec.type === 'image' || spec.type === 'svg') ? '#1f1d1a' : slwBg;
  overlay.innerHTML =
    '<div style="background:' + slwBg + ';color:' + slwFg + ';width:' + w + 'px;height:' + h + 'px;max-width:96vw;max-height:92vh;border-radius:18px;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.30);overflow:hidden;border:1.5px solid ' + slwBorder + ';font-family:inherit;">'
    + '  <div style="display:flex;align-items:center;gap:10px;padding:12px 16px;background:' + slwHdrBg + ';border-bottom:1px solid ' + slwBorder + ';flex-shrink:0;">'
    + '    <i class="bi bi-window-stack" style="color:' + slwAccent + ';font-size:16px;"></i>'
    + '    <span style="font-weight:800;font-size:14px;color:' + slwFg + ';">' + __kiChatEsc(spec.title || (window.i18n ? window.i18n.t('ki_chat.window_title_default') : 'StackLens-Fenster')) + '</span>'
    + '    <span style="opacity:.75;font-size:11px;flex:1;color:' + slwMuted + ';">' + __kiChatEsc(spec.subtitle || '') + '</span>'
    + '    <button id="kiSlwDownload" title="' + (window.i18n ? window.i18n.t('ki_chat.download_title') : 'Inhalt als Datei speichern') + '" style="background:none;border:1px solid ' + slwDlBorder + ';color:' + slwDlFg + ';border-radius:6px;padding:3px 10px;font-size:11px;font-weight:700;cursor:pointer;"><i class="bi bi-download me-1"></i>' + (window.i18n ? window.i18n.t('ki_chat.download_btn') : 'Download') + '</button>'
    + '    <button id="kiSlwClose" title="' + (window.i18n ? window.i18n.t('common.close') : 'Schließen') + '" style="background:none;border:none;font-size:22px;line-height:1;cursor:pointer;color:' + slwMuted + ';padding:0 2px;">&times;</button>'
    + '  </div>'
    + '  <div id="kiSlwBody" style="flex:1;overflow:auto;background:' + bodyBg + ';display:flex;align-items:stretch;justify-content:stretch;">'
    + '  </div>'
    + '</div>';
  document.body.appendChild(overlay);
  var bodyEl  = overlay.querySelector('#kiSlwBody');
  var closeEl = overlay.querySelector('#kiSlwClose');
  var dlEl    = overlay.querySelector('#kiSlwDownload');
  closeEl.onclick = function(){ overlay.remove(); };
  overlay.addEventListener('click', function(e){ if (e.target === overlay) overlay.remove(); });

  function setDownload(filename, mime, getContent) {
    dlEl.style.display = '';
    dlEl.onclick = function(){
      try {
        var content = getContent();
        var blob = (content instanceof Blob) ? content : new Blob([content], { type: mime || 'application/octet-stream' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a'); a.href = url; a.download = filename || 'stacklens-window';
        document.body.appendChild(a); a.click();
        setTimeout(function(){ try { document.body.removeChild(a); URL.revokeObjectURL(url); } catch(_){} }, 100);
      } catch(e){ kiChatToast((window.i18n ? window.i18n.t('ki_chat.download_failed') : 'Download fehlgeschlagen') + ': ' + (e&&e.message?e.message:e), 'error'); }
    };
  }
  function noDownload() { dlEl.style.display = 'none'; }

  var t = (spec.type || '').toLowerCase();
  if (t === 'image') {
    var src = spec.url || spec.content || '';
    bodyEl.style.display = 'flex'; bodyEl.style.alignItems = 'center'; bodyEl.style.justifyContent = 'center'; bodyEl.style.padding = '12px';
    var img = document.createElement('img');
    img.src = src;
    img.alt = spec.title || '';
    img.style.cssText = 'max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;background:#fff;';
    bodyEl.appendChild(img);
    if (/^data:|^https?:|^\//.test(src)) {
      setDownload((spec.filename || 'bild') + (src.indexOf('image/png') >= 0 ? '.png' : (src.indexOf('image/jpeg') >= 0 ? '.jpg' : '.img')),
        'image/*', function(){
          if (/^https?:\/\//.test(src)) { var a = document.createElement('a'); a.href = src; a.target='_blank'; a.click(); return new Blob([], {type:'text/plain'}); }
          var m = src.match(/^data:([^;]+);base64,(.+)$/);
          if (m) {
            var bin = atob(m[2]); var bytes = new Uint8Array(bin.length);
            for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return new Blob([bytes], { type: m[1] });
          }
          return new Blob([src], { type: 'text/plain' });
        });
    } else { noDownload(); }

  } else if (t === 'svg') {
    bodyEl.style.padding = '12px';
    bodyEl.innerHTML = spec.content || '';
    setDownload((spec.filename || 'grafik') + '.svg', 'image/svg+xml', function(){ return spec.content || ''; });

  } else if (t === 'mermaid') {
    bodyEl.style.padding = '14px'; bodyEl.style.background = slwBg;
    var mDiv = document.createElement('div');
    mDiv.className = 'mermaid';
    mDiv.style.cssText = 'width:100%;display:flex;align-items:center;justify-content:center;';
    mDiv.textContent = spec.content || '';
    bodyEl.appendChild(mDiv);
    var doRender = function(){
      try {
        if (window.mermaid && typeof window.mermaid.run === 'function') window.mermaid.run({ nodes: [mDiv] });
        else if (window.mermaid && typeof window.mermaid.init === 'function') window.mermaid.init(undefined, mDiv);
      } catch(e){ mDiv.textContent = (window.i18n ? window.i18n.t('common.error') : 'Mermaid-Fehler') + ': ' + (e && e.message ? e.message : e); }
    };
    if (window.mermaid) doRender();
    else {
      var s = document.createElement('script');
      s.src = '/js/mermaid.min.js';
      s.onload = function(){ try { window.mermaid.initialize({ startOnLoad: false, theme: 'default' }); } catch(_){} doRender(); };
      document.head.appendChild(s);
    }
    setDownload((spec.filename || 'diagramm') + '.mmd', 'text/plain;charset=utf-8', function(){ return spec.content || ''; });

  } else if (t === 'html' || t === 'iframe') {
    var iframe = document.createElement('iframe');
    iframe.style.cssText = 'width:100%;height:100%;border:none;background:#fff;';
    iframe.setAttribute('sandbox', 'allow-scripts allow-forms allow-same-origin');
    iframe.referrerPolicy = 'no-referrer';
    bodyEl.appendChild(iframe);
    if (t === 'iframe' && spec.url) {
      iframe.src = spec.url; noDownload();
    } else {
      var html = spec.content || '<html><body style="font-family:sans-serif;padding:16px;">(leer)</body></html>';
      window.stacklensSetFrameHtml(iframe, html);
      setDownload((spec.filename || 'mockup') + '.html', 'text/html;charset=utf-8', function(){ return html; });
    }

  } else if (t === 'markdown') {
    bodyEl.style.padding = '18px 22px'; bodyEl.style.display = 'block';
    var md = spec.content || '';
    var pre = document.createElement('div');
    pre.style.cssText = 'font-family:inherit;font-size:14px;line-height:1.7;color:#1f1f1f;white-space:pre-wrap;word-break:break-word;';
    pre.textContent = md;
    bodyEl.appendChild(pre);
    setDownload((spec.filename || 'antwort') + '.md', 'text/markdown;charset=utf-8', function(){ return md; });

  } else if (t === 'code') {
    bodyEl.style.background = '#1e1e1e';
    var pre2 = document.createElement('pre');
    pre2.style.cssText = 'margin:0;padding:14px 16px;flex:1;overflow:auto;background:#1e1e1e;color:#e8e8e8;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.5;white-space:pre;user-select:text;';
    pre2.textContent = spec.content || '';
    bodyEl.appendChild(pre2);
    var ext = __kiChatExtForLang(spec.lang || 'txt');
    var mime = __kiChatMimeForLang(spec.lang || 'txt');
    setDownload((spec.filename || 'code') + '.' + ext, mime, function(){ return spec.content || ''; });

  } else {
    bodyEl.style.padding = '18px 22px'; bodyEl.style.display = 'block';
    var pre3 = document.createElement('div');
    pre3.style.cssText = 'font-family:inherit;font-size:13px;line-height:1.6;color:#1f1f1f;white-space:pre-wrap;word-break:break-word;user-select:text;';
    pre3.textContent = spec.content || '';
    bodyEl.appendChild(pre3);
    setDownload((spec.filename || 'antwort') + '.txt', 'text/plain;charset=utf-8', function(){ return spec.content || ''; });
  }
}
window.kiChatOpenWindow = kiChatOpenWindow;


function __kiChatExtractWindowDirectives(text) {
  var found = [];
  if (!text) return found;
  var re = /```stacklens-window[ \t]*\r?\n?([\s\S]*?)\r?\n?[ \t]*```/gi;
  var m;
  while ((m = re.exec(text)) !== null) {
    var raw = (m[1] || '').trim();
    if (!raw) continue;
    var spec = null;
    try { spec = JSON.parse(raw); } catch(_){ spec = null; }
    if (!spec) {
      var s = raw.indexOf('{');
      var e = raw.lastIndexOf('}');
      if (s >= 0 && e > s) {
        try { spec = JSON.parse(raw.slice(s, e + 1)); } catch(_){ spec = null; }
      }
    }
    if (spec && spec.type) {
      found.push({ kind: 'window', spec: spec, label: spec.title || ((window.i18n ? window.i18n.t('ki_chat.open_in_window') : 'Im Fenster öffnen') + ' (' + spec.type + ')') });
    }
  }
  var imgRe = new RegExp('!' + '\\[([^\\]]*)\\]\\((https?:\\/\\/[^\\s)]+|\\/[^\\s)]+|data:[^\\s)]+)\\)', 'g');
  var im;
  while ((im = imgRe.exec(text)) !== null) {
    found.push({
      kind: 'window',
      spec: { type: 'image', title: im[1] || (window.i18n ? window.i18n.t('ki_chat.image_title_default') : 'Bild'), url: im[2] },
      label: (window.i18n ? window.i18n.t('ki_chat.image_open') : 'Bild im Fenster öffnen') + (im[1] ? ' — ' + im[1].slice(0, 40) : '')
    });
  }
  return found;
}

function __kiChatEsc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

function __kiChatRenderSourceChips(tabId, chips) {
  var panel = document.getElementById('kiChatSourcesPanel');
  var holder = document.getElementById('kiChatSourcesChips');
  var counter = document.getElementById('kiChatSourcesCount');
  if (!panel || !holder || !counter) return;
  if (!Array.isArray(chips) || !chips.length) {
    panel.style.display = 'none';
    holder.innerHTML = '';
    counter.textContent = '0';
    return;
  }
  holder.innerHTML = '';
  for (var i = 0; i < chips.length; i++) {
    var chip = chips[i] || {};
    var title = chip.title || chip.citation || 'Wissensquelle';
    var href = chip.sourceUri || '#';
    var score = (typeof chip.score === 'number') ? chip.score.toFixed(2) : '';
    var target = chip.sourceUri ? ' target="_blank" rel="noopener noreferrer"' : '';
    var a = document.createElement('a');
    a.className = 'ki-source-chip';
    a.href = href;
    a.title = (chip.preview ? (chip.preview + '\n\n') : '') + (chip.citation || '');
    if (chip.sourceUri) a.setAttribute('target', '_blank');
    if (chip.sourceUri) a.setAttribute('rel', 'noopener noreferrer');
    a.innerHTML =
      '<i class="bi bi-database-check ki-source-chip-icon"></i>' +
      '<span class="ki-source-chip-title"></span>' +
      (score ? '<span class="ki-source-chip-score">' + score + '</span>' : '');
    a.querySelector('.ki-source-chip-title').textContent = title;
    holder.appendChild(a);
  }
  counter.textContent = String(chips.length);
  panel.style.display = 'block';
}
window.__kiChatRenderSourceChips = __kiChatRenderSourceChips;

function __kiChatMd(raw) {
  if (!raw) return '';
  function esc(s) { return (window.slHelpers && window.slHelpers.esc) ? window.slHelpers.esc(s) : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  var codeBlocks = [];
  var s = raw.replace(/```([\w.+\-]*)[ \t]*\r?\n([\s\S]*?)```/g, function(_, lang, code) {
    var l = (lang || '').trim();
    var idx = codeBlocks.length;
    codeBlocks.push(
      '<div class="ki-md-pre-wrap">'
      + (l ? '<span class="ki-md-pre-lang">' + esc(l) + '</span>' : '')
      + '<pre><code>' + esc(code.replace(/\n$/, '')) + '</code></pre>'
      + '</div>'
    );
    return '\x00B' + idx + '\x00';
  });

  function inline(e) {
    e = e.replace(/`([^`]+)`/g, '<code class="ki-md-ic">$1</code>');
    e = e.replace(/\*\*\*([^*\r\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
    e = e.replace(/\*\*([^*\r\n]+)\*\*/g, '<strong>$1</strong>');
    e = e.replace(/\*([^*\r\n]+)\*/g, '<em>$1</em>');
    e = e.replace(/__([^_\r\n]+)__/g, '<strong>$1</strong>');
    e = e.replace(/_([^_\r\n]+)_/g, '<em>$1</em>');
    return e;
  }
  function processText(txt) {
    var lines = txt.split('\n');
    var out = '';
    var listTag = '';
    var tableRows = [];
    function closeList() { if (listTag) { out += '</' + listTag + '>'; listTag = ''; } }
    function isSepRow(raw) {
      var inner = raw.replace(/^\s*\|/, '').replace(/\|\s*$/, '');
      return inner.split('|').every(function(cell) { return /^[\s\-:]+$/.test(cell); });
    }
    function flushTable() {
      if (tableRows.length < 2 || !isSepRow(tableRows[1])) {
        tableRows.forEach(function(raw) {
          var e2 = esc(raw);
          if (!e2.trim()) out += '<div class="ki-md-gap"></div>';
          else out += '<div class="ki-md-p">' + inline(e2) + '</div>';
        });
      } else {
        function parseRow(raw, isHeader) {
          var tag = isHeader ? 'th' : 'td';
          var cells = raw.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|');
          return '<tr>' + cells.map(function(c) {
            return '<' + tag + ' class="ki-md-td">' + inline(esc(c.trim())) + '</' + tag + '>';
          }).join('') + '</tr>';
        }
        out += '<div class="ki-md-tbl-wrap"><table class="ki-md-tbl"><thead>' + parseRow(tableRows[0], true) + '</thead><tbody>';
        for (var ti = 2; ti < tableRows.length; ti++) {
          if (tableRows[ti].trim()) out += parseRow(tableRows[ti], false);
        }
        out += '</tbody></table></div>';
      }
      tableRows = [];
    }
    lines.forEach(function(line) {
      if (/^\s*\|/.test(line)) { closeList(); tableRows.push(line); return; }
      if (tableRows.length) flushTable();
      var e = esc(line);
      var hm = e.match(/^(#{1,4})\s+(.*)/);
      if (hm) { closeList(); out += '<div class="ki-md-h' + hm[1].length + '">' + inline(hm[2]) + '</div>'; return; }
      if (/^(---+|\*\*\*+)$/.test(e.trim())) { closeList(); out += '<div class="ki-md-hr"></div>'; return; }
      var ulm = e.match(/^\s*[-*+]\s+(.*)/);
      if (ulm) {
        if (listTag !== 'ul') { closeList(); out += '<ul class="ki-md-ul">'; listTag = 'ul'; }
        out += '<li>' + inline(ulm[1]) + '</li>'; return;
      }
      var olm = e.match(/^\s*\d+\.\s+(.*)/);
      if (olm) {
        if (listTag !== 'ol') { closeList(); out += '<ol class="ki-md-ol">'; listTag = 'ol'; }
        out += '<li>' + inline(olm[1]) + '</li>'; return;
      }
      var bqm = e.match(/^&gt;\s?(.*)/);
      if (bqm) { closeList(); out += '<div class="ki-md-bq">' + inline(bqm[1]) + '</div>'; return; }
      if (!e.trim()) { closeList(); out += '<div class="ki-md-gap"></div>'; return; }
      closeList(); out += '<div class="ki-md-p">' + inline(e) + '</div>';
    });
    if (tableRows.length) flushTable();
    closeList();
    return out;
  }

  var parts = s.split(/\x00B(\d+)\x00/);
  var html = '';
  for (var i = 0; i < parts.length; i++) {
    if (i % 2 === 0) html += processText(parts[i]);
    else html += codeBlocks[parseInt(parts[i])];
  }
  return html;
}
function __kiChatAppendUser(text, scroll, attachmentMeta) {
  var list = document.getElementById('kiChatMessages');
  if (!list) return;
  var wrap = document.createElement('div');
  wrap.style.cssText = 'align-self:flex-end;max-width:88%;display:flex;flex-direction:column;gap:4px;';
  var label = '<div class="ki-chat-label-user"><i class="bi bi-person-fill me-1"></i>' + (window.i18n ? window.i18n.t('ki_chat.user_label') : 'Du') + '</div>';
  var bubble = '<div class="ki-user-bubble">' + __kiChatEsc(text || '') + '</div>';
  var attachmentsHtml = '';
  if (attachmentMeta && attachmentMeta.count) {
    var head =
      '<i class="bi bi-paperclip me-1"></i>' +
      (window.i18n ? window.i18n.t('ki_chat.attachments.preview_heading') : 'Anhänge') +
      ' (' + attachmentMeta.count + ')';
    attachmentsHtml =
      '<div class="ki-chat-attachment-summary" style="display:flex;flex-wrap:wrap;gap:4px;align-self:flex-end;">' +
      '  <span class="ki-chat-attachment-chip" style="max-width:none;">' +
      '    <i class="bi bi-paperclip ki-chat-attachment-thumb" style="display:inline-flex;align-items:center;justify-content:center;color:#7c5cbf;"></i>' +
      '    <span class="ki-chat-attachment-name">' + head + '</span>' +
      '  </span>' +
      '</div>';
  }
  wrap.innerHTML = label + attachmentsHtml + bubble;
  list.appendChild(wrap);
  if (scroll !== false) list.scrollTop = list.scrollHeight;
  if (typeof __kiChatUpdateDrawerScrollbar === 'function') __kiChatUpdateDrawerScrollbar();
}
function __kiChatAppendAi(text, scroll, skipMarkdown) {
  var list = document.getElementById('kiChatMessages');
  if (!list) return null;
  var wrap = document.createElement('div');
  wrap.style.cssText = 'align-self:flex-start;max-width:90%;display:flex;flex-direction:column;gap:6px;';
  var bubble = document.createElement('div');
  bubble.className = 'ki-ai-bubble';
  if (skipMarkdown || !text) {
    bubble.textContent = text || '';
  } else {
    bubble.innerHTML = __kiChatMd(text);
    bubble.classList.add('ki-md');
  }
  wrap.innerHTML = '<div class="ki-chat-label-ai"><i class="bi bi-robot me-1"></i>KI Agent</div>';
  wrap.appendChild(bubble);
  var dl = document.createElement('div');
  dl.className = 'ki-chat-downloads';
  dl.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap;align-items:center;';
  if (!skipMarkdown && text) {
    var copyBtn = document.createElement('button');
    copyBtn.type = 'button';
    copyBtn.className = 'ki-copy-btn';
    copyBtn.title = window.i18n ? window.i18n.t('ki_chat.copy_to_clipboard') : 'In Zwischenablage kopieren';
    copyBtn.innerHTML = '<i class="bi bi-clipboard"></i>';
    copyBtn.onclick = function() {
      var t = bubble.innerText || bubble.textContent || '';
      var ok = function() {
        copyBtn.innerHTML = '<i class="bi bi-clipboard-check"></i>';
        setTimeout(function(){ copyBtn.innerHTML = '<i class="bi bi-clipboard"></i>'; }, 1800);
      };
      try {
        navigator.clipboard.writeText(t).then(ok).catch(function(){
          try { var ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;opacity:0;'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); ok(); } catch(_){}
        });
      } catch(_){
        try { var ta2 = document.createElement('textarea'); ta2.value = t; ta2.style.cssText = 'position:fixed;opacity:0;'; document.body.appendChild(ta2); ta2.select(); document.execCommand('copy'); ta2.remove(); ok(); } catch(__){}
      }
    };
    dl.appendChild(copyBtn);
  }
  wrap.appendChild(dl);
  list.appendChild(wrap);
  if (scroll !== false) list.scrollTop = list.scrollHeight;
  if (text && !skipMarkdown) __kiChatAttachDownloads(wrap, text);
  if (typeof __kiChatUpdateDrawerScrollbar === 'function') __kiChatUpdateDrawerScrollbar();
  return bubble;
}

function __kiChatAttachDownloads(wrap, text, autoOpen) {
  if (!wrap) return;
  var dl = wrap.querySelector('.ki-chat-downloads');
  if (!dl) return;
  dl.innerHTML = '';
  if (!text) return;
  var directives = [];
  try { directives = __kiChatExtractWindowDirectives(text); } catch(_){}
  if (directives.length) {
    try {
      var bubble = wrap.children[1];
      if (bubble && bubble.textContent) {
        var cleaned = bubble.textContent
          .replace(/```stacklens-window[ \t]*\r?\n?[\s\S]*?\r?\n?[ \t]*```/gi, '')
          .replace(/\n{3,}/g, '\n\n')
          .trim();
        if (cleaned !== bubble.textContent) bubble.textContent = cleaned || '✓';
      }
    } catch(_){}
    directives.forEach(function(d, idx){
      var b = document.createElement('button');
      b.type = 'button';
      var icon = (d.spec && d.spec.type === 'image') ? 'bi-image' : (d.spec && d.spec.type === 'mermaid' ? 'bi-diagram-3' : 'bi-window-stack');
      b.innerHTML = '<i class="bi ' + icon + ' me-1"></i>' + __kiChatEsc(d.label);
      b.title = 'In StackLens-Fenster öffnen';
      b.className = 'ki-chat-btn-window';
      b.onclick = function(){ try { kiChatOpenWindow(d.spec); } catch(e){ kiChatToast((window.i18n ? window.i18n.t('ki_chat.window_open_error') : 'Fenster konnte nicht geöffnet werden') + ': ' + (e&&e.message?e.message:e), 'error'); } };
      dl.appendChild(b);
      if (autoOpen && idx === 0) {
        setTimeout(function(){ try { kiChatOpenWindow(d.spec); } catch(_){} }, 50);
      }
    });
  }
  var blocks = __kiChatExtractCodeBlocks(text);
  if (!blocks.length) {
    if (typeof __kiChatUpdateDrawerScrollbar === 'function') __kiChatUpdateDrawerScrollbar();
    return;
  }
  blocks.forEach(function(b, idx){
    if ((b.lang || '').toLowerCase() === 'stacklens-window') return;
    var ext = __kiChatExtForLang(b.lang);
    var mime = __kiChatMimeForLang(b.lang);
    var label = (b.lang ? b.lang.toUpperCase() : 'Datei') + ' herunterladen' + (blocks.length > 1 ? ' (' + (idx+1) + ')' : '');
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.innerHTML = '<i class="bi bi-download me-1"></i>' + __kiChatEsc(label);
    btn.title = 'Inhalt als ' + ext + '-Datei speichern';
    btn.className = 'ki-chat-btn-download';
    btn.onclick = function(){
      try {
        var fname = (b.filename || ('antwort-' + Date.now() + (blocks.length > 1 ? '-' + (idx+1) : '') + '.' + ext));
        var blob = new Blob([b.code], { type: mime });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = fname;
        document.body.appendChild(a);
        a.click();
        setTimeout(function(){ try { document.body.removeChild(a); URL.revokeObjectURL(url); } catch(_){} }, 100);
      } catch(e) {
        kiChatToast((window.i18n ? window.i18n.t('ki_chat.download_failed') : 'Download fehlgeschlagen') + ': ' + (e && e.message ? e.message : e), 'error');
      }
    };
    dl.appendChild(btn);
  });
  if (typeof __kiChatUpdateDrawerScrollbar === 'function') __kiChatUpdateDrawerScrollbar();
}

function __kiChatExtractCodeBlocks(text) {
  var out = [];
  if (!text) return out;
  var re = /```([a-zA-Z0-9_+.\-]*)\s*\n([\s\S]*?)\n?```/g;
  var m;
  while ((m = re.exec(text)) !== null) {
    var lang = (m[1] || '').toLowerCase();
    var code = m[2] || '';
    if ((!lang || lang === 'text' || lang === 'plaintext' || lang === 'txt')
        && /^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/.test((code||'').trim())) {
      lang = 'jwt';
      code = code.trim();
    }
    var beforeIdx = m.index;
    var before = text.slice(0, beforeIdx);
    var prevLine = (before.match(/([^\n]*)\n\s*$/) || [, ''])[1].trim();
    var fname = null;
    var fm = prevLine.match(/file\s*[:=]\s*([A-Za-z0-9_.\-/]+)/i);
    if (fm) fname = fm[1];
    out.push({ lang: lang, code: code, filename: fname });
  }
  try {
    var withoutFences = text.replace(/```[\s\S]*?```/g, '');
    var jwtRe = /\beyJ[A-Za-z0-9_-]{5,}\.[A-Za-z0-9_-]{5,}\.[A-Za-z0-9_-]{5,}\b/g;
    var seen = new Set();
    var jm;
    while ((jm = jwtRe.exec(withoutFences)) !== null) {
      var tok = jm[0];
      if (seen.has(tok)) continue;
      seen.add(tok);
      var dup = out.some(function(b){ return (b.code||'').trim() === tok; });
      if (!dup) out.push({ lang: 'jwt', code: tok, filename: null });
    }
  } catch(_){}
  return out;
}

function __kiChatExtForLang(lang) {
  switch ((lang||'').toLowerCase()) {
    case 'html': case 'htm': return 'html';
    case 'css': return 'css';
    case 'js': case 'javascript': return 'js';
    case 'ts': case 'typescript': return 'ts';
    case 'json': return 'json';
    case 'xml': return 'xml';
    case 'svg': return 'svg';
    case 'md': case 'markdown': return 'md';
    case 'yml': case 'yaml': return 'yml';
    case 'sql': return 'sql';
    case 'sh': case 'bash': case 'zsh': return 'sh';
    case 'py': case 'python': return 'py';
    case 'php': return 'php';
    case 'kt': case 'kotlin': return 'kt';
    case 'java': return 'java';
    case 'go': case 'golang': return 'go';
    case 'rs': case 'rust': return 'rs';
    case 'csv': return 'csv';
    case 'toml': return 'toml';
    case 'ini': return 'ini';
    case 'dockerfile': return 'Dockerfile';
    case 'mermaid': return 'mmd';
    case 'jwt': case 'token': return 'jwt';
    case 'pem': case 'cert': case 'certificate': return 'pem';
    case 'env': case 'dotenv': return 'env';
    case '': return 'txt';
    default: return lang.replace(/[^a-zA-Z0-9]+/g, '') || 'txt';
  }
}
function __kiChatMimeForLang(lang) {
  switch ((lang||'').toLowerCase()) {
    case 'html': case 'htm': return 'text/html;charset=utf-8';
    case 'css': return 'text/css;charset=utf-8';
    case 'js': case 'javascript': return 'application/javascript;charset=utf-8';
    case 'json': return 'application/json;charset=utf-8';
    case 'xml': case 'svg': return 'application/xml;charset=utf-8';
    case 'md': case 'markdown': return 'text/markdown;charset=utf-8';
    case 'yml': case 'yaml': return 'application/yaml;charset=utf-8';
    case 'csv': return 'text/csv;charset=utf-8';
    case 'jwt': case 'token': return 'application/jwt;charset=utf-8';
    case 'pem': case 'cert': case 'certificate': return 'application/x-pem-file;charset=utf-8';
    default: return 'text/plain;charset=utf-8';
  }
}

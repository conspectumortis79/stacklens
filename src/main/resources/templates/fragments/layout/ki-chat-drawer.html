<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<body>
<th:block th:fragment="ki-chat-drawer">
<style>
  :root {
    --ki-md-h1-fg:        #3b3490;
    --ki-md-h2-fg:        #3b3490;
    --ki-md-h2-border:    #ddd7f5;
    --ki-md-h3-fg:        #5a3fa3;
    --ki-md-h4-fg:        #7c5cbf;
    --ki-md-bq-fg:        #5a3fa3;
    --ki-md-bq-bg:        #ede8ff;
    --ki-md-bq-border:    #a98cee;
    --ki-md-hr-border:    #e0d9f7;
    --ki-md-ic-bg:        #ede8ff;
    --ki-md-ic-fg:        #7c5cbf;
    --ki-md-tbl-border:   #d8cef5;
    --ki-md-tbl-th-bg:    #ede8ff;
    --ki-md-tbl-th-fg:    #3b3490;
    --ki-md-tbl-td-bg:    #f8f5ff;
    --ki-md-tbl-hover-bg: #ede8ff;
    --ki-source-chip-border:   #c9b8f5;
    --ki-source-chip-bg:       #f4f0ff;
    --ki-source-chip-fg:       #5a3fa3;
    --ki-source-chip-hover-bg: #ece2ff;
    --ki-source-chip-icon:     #7c5cbf;
    --ki-source-chip-score-bg: rgba(124,92,191,.18);
    --ki-copy-border:      #c9b8f5;
    --ki-copy-fg:          #7c5cbf;
    --ki-copy-hover-bg:    #f4f0ff;
    --ki-sources-panel-bg:  rgba(124,92,191,.07);
    --ki-sources-panel-border: rgba(124,92,191,.22);
  }

  @keyframes kiChatPulse {
    0%   { background:#f4f0ff; border-color:#c9b8f5; box-shadow:0 0 0 0 rgba(124,92,191,.0); }
    50%  { background:#ece2ff; border-color:#a98cee; box-shadow:0 0 0 4px rgba(124,92,191,.18); }
    100% { background:#f4f0ff; border-color:#c9b8f5; box-shadow:0 0 0 0 rgba(124,92,191,.0); }
  }
  @keyframes kiChatPulseLight {
    0%   { background:#f4f0ff; border-color:#c9b8f5; box-shadow:0 0 0 0 rgba(124,92,191,.0); }
    50%  { background:#ece2ff; border-color:#a98cee; box-shadow:0 0 0 4px rgba(124,92,191,.18); }
    100% { background:#f4f0ff; border-color:#c9b8f5; box-shadow:0 0 0 0 rgba(124,92,191,.0); }
  }
  @keyframes kiChatPulseDark {
    0%   { background:#252235; border-color:#5b3fa8; box-shadow:0 0 0 0 rgba(160,126,245,.0); }
    50%  { background:#2e2748; border-color:#a07ef5; box-shadow:0 0 0 4px rgba(160,126,245,.22); }
    100% { background:#252235; border-color:#5b3fa8; box-shadow:0 0 0 0 rgba(160,126,245,.0); }
  }
  @keyframes kiChatPulsePopos {
    0%   { background:#222234; border-color:#a06010; box-shadow:0 0 0 0 rgba(250,164,26,.0); }
    50%  { background:#2c2540; border-color:#faa41a; box-shadow:0 0 0 4px rgba(250,164,26,.22); }
    100% { background:#222234; border-color:#a06010; box-shadow:0 0 0 0 rgba(250,164,26,.0); }
  }
  .ki-chat-bubble-streaming { animation: kiChatPulse 1.2s ease-in-out infinite; }

  .ki-ai-bubble {
    color: #1f1f1f;
    background: #f4f0ff;
    border: 1.5px solid #c9b8f5;
    border-radius: 14px 14px 14px 3px;
    padding: 10px 14px; font-size: 13px; line-height: 1.6;
    white-space: pre-wrap; word-break: break-word;
    user-select: text; -webkit-user-select: text; cursor: text;
  }
  .ki-ai-bubble.ki-md { white-space: normal; }

  #kiChatMessages, #kiChatMessages * {
    user-select: text;
    -webkit-user-select: text;
    cursor: text;
  }

  #kiChatMessages button,
  #kiChatMessages a,
  #kiChatMessages .ki-chat-sources { cursor: default; }
  #kiChatMessages .ki-chat-sources { -webkit-user-select: text; user-select: text; }

  .ki-user-bubble {
    color: #1f1f1f;
    background: #eef4ff;
    border: 1.5px solid #b3cdfa;
    border-radius: 14px 14px 3px 14px;
    padding: 10px 14px; font-size: 13px; line-height: 1.6; white-space: pre-wrap;
  }

  .ki-chat-label-ai   { font-size: 11px; font-weight: 700; color: #7c5cbf; margin-bottom: 3px; }
  .ki-chat-label-user { font-size: 11px; font-weight: 700; color: #5b8ef0; margin-bottom: 3px; text-align: right; }

  .ki-ai-bubble.ki-md .ki-md-p   { margin: 0 0 6px; line-height: 1.65; }
  .ki-ai-bubble.ki-md .ki-md-p:last-child { margin-bottom: 0; }
  .ki-ai-bubble.ki-md .ki-md-gap { height: 4px; }
  .ki-ai-bubble.ki-md .ki-md-h1  { font-size: 1.1em; font-weight: 800; margin: 10px 0 4px; color: var(--ki-md-h1-fg); }
  .ki-ai-bubble.ki-md .ki-md-h2  { font-size: 1.05em; font-weight: 700; margin: 10px 0 4px; color: var(--ki-md-h2-fg); border-bottom: 1px solid var(--ki-md-h2-border); padding-bottom: 3px; }
  .ki-ai-bubble.ki-md .ki-md-h3  { font-size: 1em; font-weight: 700; margin: 8px 0 3px; color: var(--ki-md-h3-fg); }
  .ki-ai-bubble.ki-md .ki-md-h4  { font-size: 0.95em; font-weight: 700; margin: 6px 0 2px; color: var(--ki-md-h4-fg); }
  .ki-ai-bubble.ki-md .ki-md-ul,
  .ki-ai-bubble.ki-md .ki-md-ol  { margin: 4px 0 6px 18px; padding: 0; }
  .ki-ai-bubble.ki-md .ki-md-ul li,
  .ki-ai-bubble.ki-md .ki-md-ol li { margin: 2px 0; line-height: 1.55; }
  .ki-ai-bubble.ki-md .ki-md-bq  { margin: 6px 0; padding: 6px 10px; border-left: 3px solid var(--ki-md-bq-border); background: var(--ki-md-bq-bg); border-radius: 0 6px 6px 0; color: var(--ki-md-bq-fg); font-style: italic; }
  .ki-ai-bubble.ki-md .ki-md-hr  { border: none; border-top: 1px solid var(--ki-md-hr-border); margin: 8px 0; }
  .ki-ai-bubble.ki-md code.ki-md-ic { background: var(--ki-md-ic-bg); border-radius: 4px; padding: 1px 5px; font: 11px ui-monospace,SFMono-Regular,Menlo,monospace; color: var(--ki-md-ic-fg); }
  .ki-ai-bubble.ki-md .ki-md-pre-wrap { margin: 8px 0; border-radius: 8px; overflow: hidden; background: var(--ki-md-pre-bg, #1e1e2e); }
  .ki-ai-bubble.ki-md .ki-md-pre-lang { font-size: 10px; font-weight: 700; color: var(--ki-md-pre-lang-fg, #89b4fa); padding: 5px 12px 3px; text-transform: uppercase; letter-spacing: .5px; display: block; }
  .ki-ai-bubble.ki-md pre { margin: 0; padding: 10px 12px; overflow-x: auto; font: 11.5px ui-monospace,SFMono-Regular,Menlo,monospace; line-height: 1.55; color: var(--ki-md-pre-fg, #cdd6f4); white-space: pre; }
  .ki-ai-bubble.ki-md pre code { font: inherit; background: none; padding: 0; color: inherit; border-radius: 0; }
  .ki-source-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    max-width: 100%;
    border: 1px solid var(--ki-source-chip-border);
    background: var(--ki-source-chip-bg);
    color: var(--ki-source-chip-fg);
    border-radius: 999px;
    padding: 3px 10px 3px 8px;
    font-size: 10.5px;
    font-weight: 700;
    line-height: 1.2;
    text-decoration: none;
    cursor: pointer;
    transition: background .15s, transform .15s;
  }
  .ki-source-chip:hover { background: var(--ki-source-chip-hover-bg); transform: translateY(-1px); }
  .ki-source-chip .ki-source-chip-icon { color: var(--ki-source-chip-icon); font-size: 11px; }
  .ki-source-chip .ki-source-chip-title {
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ki-source-chip .ki-source-chip-score {
    background: var(--ki-source-chip-score-bg);
    color: var(--ki-source-chip-fg);
    padding: 0 6px;
    border-radius: 999px;
    font-size: 9.5px;
    font-weight: 700;
  }

  #kiChatSourcesPanel {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    align-items: center;
    padding: 6px 14px 8px;
    background: var(--ki-sources-panel-bg);
    border-bottom: 1px solid var(--ki-sources-panel-border);
  }
  #kiChatSourcesPanel > i.bi-database-check { font-size: 11px; color: var(--ki-source-chip-icon); }
  #kiChatSourcesCount {
    font-size: 9.5px;
    font-weight: 800;
    letter-spacing: .025em;
    color: var(--ki-source-chip-fg);
    padding: 0 2px;
  }
  .ki-ai-bubble.ki-md .ki-md-tbl-wrap { margin: 8px 0; overflow-x: auto; border-radius: 8px; border: 1px solid var(--ki-md-tbl-border); }
  .ki-ai-bubble.ki-md .ki-md-tbl { border-collapse: collapse; font-size: 12px; width: 100%; min-width: max-content; }
  .ki-ai-bubble.ki-md .ki-md-tbl th.ki-md-td { background: var(--ki-md-tbl-th-bg); color: var(--ki-md-tbl-th-fg); font-weight: 700; padding: 6px 12px; border: 1px solid var(--ki-md-tbl-border); text-align: left; white-space: nowrap; }
  .ki-ai-bubble.ki-md .ki-md-tbl td.ki-md-td { padding: 5px 12px; border: 1px solid var(--ki-md-tbl-border); text-align: left; }
  .ki-ai-bubble.ki-md .ki-md-tbl tbody tr:nth-child(even) td { background: var(--ki-md-tbl-td-bg); }
  .ki-ai-bubble.ki-md .ki-md-tbl tbody tr:hover td { background: var(--ki-md-tbl-hover-bg); }

  .ai-provider-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 10px;
    align-items: stretch;
  }

  #aiProviderCheckCopilot,
  #aiProviderCheckOpenAi,
  #aiProviderCheckOllama,
  #aiProviderCheckLmStudio,
  #aiProviderCheckOpenRouter,
  #aiProviderCheckClaudeCode,
  #aiProviderCheckCompatible {
    border: 1.5px solid transparent;
    border-radius: 8px;
    padding: 4px 8px 4px 1.7em;
    min-width: 0;
    overflow: hidden;
    box-sizing: border-box;
  }
  #aiProviderCheckCopilot .form-check-label,
  #aiProviderCheckOpenAi .form-check-label,
  #aiProviderCheckOllama .form-check-label,
  #aiProviderCheckLmStudio .form-check-label,
  #aiProviderCheckOpenRouter .form-check-label,
  #aiProviderCheckClaudeCode .form-check-label,
  #aiProviderCheckCompatible .form-check-label {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: inline-flex;
    align-items: center;
    max-width: 100%;
  }
  .ki-provider-active-wrap { border-color: #2eb86b !important; background: #edfbf3 !important; }
  .ki-provider-active-wrap .form-check-input:checked { border-color: #2eb86b; }
  .ki-provider-active-badge {
    display: inline-flex; align-items: center; gap: 3px;
    font-size: 10px; font-weight: 700; border-radius: 999px;
    padding: 1px 7px; margin-left: 6px; vertical-align: middle;
    color: transparent; background: transparent; border: 1px solid transparent;
    pointer-events: none;
  }
  .ki-provider-active-badge.active {
    color: #1a7a3e; background: #d1f7e1; border-color: #a3e8bc;
    pointer-events: auto;
  }
  html[data-theme="dark"] .ki-provider-active-wrap,
  html[data-theme="popos"] .ki-provider-active-wrap {
    border-color: #2eb86b !important;
    background: rgba(46,184,107,.10) !important;
  }
  html[data-theme="dark"] .ki-provider-active-badge.active,
  html[data-theme="popos"] .ki-provider-active-badge.active {
    color: #6ee09a;
    background: rgba(46,184,107,.18);
    border-color: rgba(46,184,107,.40);
  }
  html[data-theme="dark"] .ki-provider-active-wrap .form-check-label,
  html[data-theme="popos"] .ki-provider-active-wrap .form-check-label {
    color: inherit;
  }
  .ai-banner-stack { display: grid; }
  .ai-banner-stack > .alert { grid-row: 1 / 2; grid-column: 1 / 2; }

  .ki-chat-btn-download {
    border: 1.5px solid #a98cee; border-radius: 999px; padding: 4px 12px;
    font-size: 11px; font-weight: 700; cursor: pointer;
    background: linear-gradient(135deg,#ece2ff,#dac9ff); color: #5a3fa3;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .ki-chat-btn-window {
    border: 1.5px solid #5b8ef0; border-radius: 999px; padding: 4px 12px;
    font-size: 11px; font-weight: 700; cursor: pointer;
    background: linear-gradient(135deg,#eef4ff,#dceaff); color: #264f9c;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .ki-copy-btn {
    background: none; border: 1px solid var(--ki-copy-border); border-radius: 6px;
    color: var(--ki-copy-fg); font-size: 11px; cursor: pointer; padding: 2px 7px;
    display: inline-flex; align-items: center; gap: 4px; opacity: .7;
    transition: opacity .15s, background .15s;
  }
  .ki-copy-btn:hover { opacity: 1; background: var(--ki-copy-hover-bg); }
  .ki-sugg-btn        { border-width: 1.5px; border-style: solid; border-radius: 999px;
    padding: 4px 10px; font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .ki-sugg-btn-action { border-color: #a98cee; background: linear-gradient(135deg,#ece2ff,#dac9ff); color: #5a3fa3; }
  .ki-sugg-btn-plain  { border-color: #c9b8f5; background: #f4f0ff; color: #5a3fa3; }

  #kiChatUsage {
    flex-shrink: 0;
    padding: 7px 10px 8px;
    background: linear-gradient(90deg,rgba(124,92,191,.07),rgba(91,142,240,.04));
    border-bottom: 1px solid #ddd7cb;
  }
  .ki-chat-usage-heading {
    display: flex; align-items: center; gap: 5px;
    min-height: 14px; margin-bottom: 5px;
    color: #6a665f; font-size: 9.5px; font-weight: 800; letter-spacing: .025em;
  }
  .ki-chat-usage-heading > i { color: #7c5cbf; font-size: 10px; }
  .ki-chat-usage-scope { margin-left: auto; font-weight: 650; letter-spacing: 0; }
  .ki-chat-usage-state {
    display: inline-flex; align-items: center; gap: 4px;
    color: #218654; font-weight: 750; letter-spacing: 0;
  }
  .ki-chat-usage-state::before {
    content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor;
  }
  #kiChatUsage.is-live .ki-chat-usage-state::before {
    animation: kiChatUsagePulse .9s ease-in-out infinite;
    box-shadow: 0 0 0 3px rgba(33,134,84,.14);
  }
  @keyframes kiChatUsagePulse { 50% { opacity: .35; transform: scale(.75); } }
  .ki-chat-usage-grid {
    display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 4px;
  }
  .ki-chat-usage-metric {
    min-width: 0; height: 34px; display: flex; flex-direction: column; justify-content: center;
    padding: 3px 7px; overflow: hidden;
    background: #fff; border: 1px solid #ddd7cb; border-radius: 8px;
  }
  .ki-chat-usage-metric--total { background: #f4f0ff; border-color: #c9b8f5; }
  .ki-chat-usage-metric-label {
    display: flex; align-items: center; gap: 3px;
    color: #6a665f; font-size: 8.5px; font-weight: 750; line-height: 1; white-space: nowrap;
  }
  .ki-chat-usage-metric-label > i { color: #5b8ef0; font-size: 9px; }
  .ki-chat-usage-metric--output .ki-chat-usage-metric-label > i { color: #218654; }
  .ki-chat-usage-metric--total .ki-chat-usage-metric-label > i,
  .ki-chat-usage-metric--total .ki-chat-usage-value { color: #5a3fa3; }
  .ki-chat-usage-metric--duration .ki-chat-usage-metric-label > i { color: #b36b12; }
  .ki-chat-usage-value {
    margin-top: 3px; overflow: hidden;
    color: #1f1f1f; font-size: 12px; font-variant-numeric: tabular-nums;
    font-weight: 850; letter-spacing: -.015em; line-height: 1;
    text-overflow: ellipsis; white-space: nowrap;
  }

  #kiChatMessagesWrap {
    position: relative;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #kiChatMessages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 14px 16px;
    padding-right: 22px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scrollbar-gutter: stable;
    scrollbar-width: none;
  }
  #kiChatMessages::-webkit-scrollbar { display: none; }

  #kiChatMessagesScrollTrack {
    position: absolute;
    right: 4px;
    top: 8px;
    bottom: 8px;
    width: 10px;
    border-radius: 999px;
    background: rgba(124, 92, 191, .14);
    border: 1px solid rgba(124, 92, 191, .24);
    z-index: 2;
  }
  #kiChatMessagesScrollThumb {
    width: 100%;
    border-radius: 999px;
    background: linear-gradient(180deg, rgba(124, 92, 191, .72), rgba(91, 142, 240, .72));
    min-height: 32px;
  }
  #kiChatMessagesScrollThumb:hover,
  #kiChatMessagesScrollThumb.dragging {
    background: linear-gradient(180deg, rgba(124, 92, 191, .94), rgba(91, 142, 240, .94));
  }

  html[data-theme="modern"] #kiChatMessagesScrollTrack {
    background: rgba(124, 92, 191, .14);
    border-color: rgba(124, 92, 191, .24);
  }
  html[data-theme="modern"] #kiChatMessagesScrollThumb {
    background: linear-gradient(180deg, rgba(124, 92, 191, .72), rgba(91, 142, 240, .72));
  }
  html[data-theme="legacy"] #kiChatMessagesScrollTrack {
    background: rgba(18, 106, 90, .14);
    border-color: rgba(18, 106, 90, .24);
  }
  html[data-theme="legacy"] #kiChatMessagesScrollThumb {
    background: linear-gradient(180deg, rgba(18, 106, 90, .72), rgba(13, 92, 154, .72));
  }
  html[data-theme="dark"] #kiChatMessagesScrollTrack {
    background: rgba(170, 140, 240, .16);
    border-color: rgba(170, 140, 240, .34);
  }
  html[data-theme="dark"] #kiChatMessagesScrollThumb {
    background: linear-gradient(180deg, rgba(170, 140, 240, .86), rgba(117, 163, 255, .86));
  }
  html[data-theme="popos"] #kiChatMessagesScrollTrack {
    background: rgba(250, 164, 26, .16);
    border-color: rgba(250, 164, 26, .34);
  }
  html[data-theme="popos"] #kiChatMessagesScrollThumb {
    background: linear-gradient(180deg, rgba(250, 164, 26, .88), rgba(50, 183, 214, .88));
  }

  #kiChatMaximizeBtn:hover,
  #kiChatMaximizeBtn:focus-visible {
    background: rgba(124, 92, 191, 0.14) !important;
    color: #5a3fa3 !important;
    outline: none;
  }
  #kiChatMaximizeBtn:active {
    background: rgba(124, 92, 191, 0.26) !important;
    color: #3b3490 !important;
  }
  html[data-theme="dark"] #kiChatMaximizeBtn:hover,
  html[data-theme="dark"] #kiChatMaximizeBtn:focus-visible,
  html[data-theme="popos"] #kiChatMaximizeBtn:hover,
  html[data-theme="popos"] #kiChatMaximizeBtn:focus-visible {
    background: rgba(170, 140, 240, 0.22) !important;
    color: #c9b8f5 !important;
  }

  #kiChatMinimizeBtn:hover,
  #kiChatMinimizeBtn:focus-visible {
    background: rgba(124, 92, 191, 0.14) !important;
    color: #5a3fa3 !important;
    outline: none;
  }
  #kiChatMinimizeBtn:active {
    background: rgba(124, 92, 191, 0.26) !important;
    color: #3b3490 !important;
  }
  html[data-theme="dark"] #kiChatMinimizeBtn:hover,
  html[data-theme="dark"] #kiChatMinimizeBtn:focus-visible,
  html[data-theme="popos"] #kiChatMinimizeBtn:hover,
  html[data-theme="popos"] #kiChatMinimizeBtn:focus-visible {
    background: rgba(170, 140, 240, 0.22) !important;
    color: #c9b8f5 !important;
  }

  #kiChatTaskbar button:hover {
    background: rgba(124, 92, 191, 0.10) !important;
  }
  #kiChatTaskbar button:active {
    background: rgba(124, 92, 191, 0.22) !important;
  }
  #kiChatTaskbar button:focus-visible {
    outline: 2px solid #7c5cbf !important;
    outline-offset: -2px;
  }
  html[data-theme="dark"] #kiChatTaskbar,
  html[data-theme="popos"] #kiChatTaskbar {
    background: #1f1c2e !important;
    border-color: #363650 !important;
    box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.4) !important;
  }
  html[data-theme="dark"] #kiChatTaskbar #kiChatTaskbarRestoreBtn,
  html[data-theme="popos"] #kiChatTaskbar #kiChatTaskbarRestoreBtn {
    color: #ece6ff !important;
  }
  html[data-theme="dark"] #kiChatTaskbar button,
  html[data-theme="popos"] #kiChatTaskbar button {
    color: #a8a59f !important;
  }
  html[data-theme="dark"] #kiChatTaskbar #kiChatTaskbarCloseBtn,
  html[data-theme="popos"] #kiChatTaskbar #kiChatTaskbarCloseBtn {
    border-left-color: #363650 !important;
  }
  html[data-theme="dark"] #kiChatTaskbar button:hover,
  html[data-theme="popos"] #kiChatTaskbar button:hover {
    background: rgba(170, 140, 240, 0.18) !important;
  }
  #kiChatDrawer.ki-chat-maximized {
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    max-width: 100vw !important;
    max-height: 100vh !important;
    border-radius: 0 !important;
    border: none !important;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.04), 0 8px 28px rgba(0, 0, 0, 0.10) !important;
  }

  .ki-chat-input-footer {
    display: flex;
    gap: 8px;
    padding: 10px 14px 14px;
    border-top: 1px solid #ddd7cb;
    flex-shrink: 0;
    min-width: 0;
    background: #faf8f3;
  }
  .ki-chat-input {
    flex: 1 1 0%;
    min-width: 0;
    resize: none;
    border: 1.5px solid #ddd7cb;

    font-size: 13px;

    cursor: pointer;
    background: linear-gradient(135deg,#7c5cbf,#5b8ef0);

    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  #kiChatAttachmentStrip {
    display: none;
    padding: 6px 14px 8px;

    background: #f4f0ff;

  }

  #kiChatAttachmentStripHead {
    display: flex; align-items: center; gap: 8px;

  }
  #kiChatAttachmentStripHead > i { color: #7c5cbf; }
  #kiChatAttachmentStripClear {
    margin-left: auto;
    background: none; border: 1px solid #c9b8f5; border-radius: 999px;

    cursor: pointer;
  }

  #kiChatAttachmentList {
    display: flex; flex-wrap: wrap; gap: 6px;

  .ki-chat-attachment-chip {

    border-radius: 999px;
    background: #fff;
    max-width: 220px;
  }
  .ki-chat-attachment-thumb {
    width: 28px; height: 28px;
    border-radius: 50%;

  .ki-chat-attachment-name {
    flex: 1; min-width: 0;

    font-size: 9.5px; color: #6a665f; font-weight: 700;

  .ki-chat-attachment-remove {

  }
  .ki-chat-input-left-tools {
    display: flex; gap: 4px; align-self: flex-end;
  }
  .ki-chat-icon-btn {
    background: none;
    border: 1.5px solid #ddd7cb;
    border-radius: 12px;
    width: 36px; height: 36px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 15px; color: #5a3fa3;

  .ki-chat-icon-btn:hover { background: #ece2ff; border-color: #a98cee; }
  .ki-chat-icon-btn:focus-visible { outline: 2px solid #7c5cbf; outline-offset: 2px; }
  .ki-chat-icon-btn:disabled { opacity: .45; cursor: not-allowed; }

  #kiChatDropOverlay {
    position: absolute; inset: 0;
    background: rgba(124,92,191,.18);
    border: 3px dashed #5a3fa3;
    border-radius: 16px;

  #kiChatDropOverlaySubtitle { font-size: 11.5px; color: #5a3fa3; }

  html[data-theme="dark"] #kiChatAttachmentStrip,

  }
  html[data-theme="dark"] #kiChatAttachmentStripHead,
  html[data-theme="popos"] #kiChatAttachmentStripHead,
  html[data-theme="dark"] .ki-chat-attachment-chip,
  html[data-theme="popos"] .ki-chat-attachment-chip,
  html[data-theme="dark"] .ki-chat-attachment-name,
  html[data-theme="popos"] .ki-chat-attachment-name {
    color: #e8e8f0;

  html[data-theme="dark"] .ki-chat-attachment-chip,
  html[data-theme="popos"] .ki-chat-attachment-chip {
    background: #1f1c2e; border-color: #5b3fa8;
  }
  html[data-theme="dark"] .ki-chat-attachment-thumb,
  html[data-theme="popos"] .ki-chat-attachment-thumb {
    background: #2e2748;
  }
  html[data-theme="dark"] .ki-chat-attachment-size,
  html[data-theme="popos"] .ki-chat-attachment-size {

<div id="kiChatDrawer" class="d-none"
     style="position:fixed;bottom:0;right:0;width:min(748px,100vw);height:min(527px,85vh);z-index:9999;display:flex;flex-direction:column;background:#fffdf8;border-radius:18px 0 0 0;box-shadow:0 -4px 40px rgba(0,0,0,.18);border:1.5px solid #ddd7cb;border-bottom:none;border-right:none;overflow:hidden;">
  <div id="kiChatDropOverlay" aria-hidden="true">
    <i class="bi bi-cloud-arrow-up-fill"></i>
    <div id="kiChatDropOverlayTitle" data-i18n="ki_chat.attachments.drag_overlay_title">Bild hier ablegen</div>
    <div id="kiChatDropOverlaySubtitle" data-i18n="ki_chat.attachments.drag_overlay_subtitle">Das Bild wird an die nächste Chat-Nachricht angehängt</div>
  </div>
  <div id="kiChatDragHandle" style="display:flex;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(135deg,#7c5cbf22,#5b8ef012);border-bottom:1px solid #ddd7cb;flex-shrink:0;cursor:move;user-select:none;">
    <i class="bi bi-chat-dots-fill" style="color:#7c5cbf;font-size:16px;"></i>
    <span style="font-size:14px;font-weight:800;flex:1;color:#1f1f1f;">KI Chat</span>
    <span id="kiChatTabBadge" style="display:none;font-size:10px;font-weight:700;background:#7c5cbf22;color:#7c5cbf;border-radius:6px;padding:2px 8px;"></span>
    <button onclick="kiChatClear()" data-i18n-title="common.ki_chat_clear_history" title="Verlauf löschen" style="background:none;border:none;font-size:13px;cursor:pointer;color:#6a665f;padding:0 4px;"><i class="bi bi-trash"></i></button>
    <button id="kiChatMinimizeBtn" type="button" onclick="kiChatMinimize()" onmousedown="event.stopPropagation()" title="Minimieren" aria-label="KI-Chat minimieren" style="background:none;border:none;font-size:15px;cursor:pointer;color:#6a665f;padding:0 5px;display:inline-flex;align-items:center;justify-content:center;line-height:1;border-radius:6px;"><i class="bi bi-window-dash" aria-hidden="true"></i></button>
    <button id="kiChatMaximizeBtn" type="button" onclick="kiChatToggleMaximize()" onmousedown="event.stopPropagation()" title="Maximieren" aria-label="KI-Chat maximieren" style="background:none;border:none;font-size:14px;cursor:pointer;color:#6a665f;padding:0 5px;display:inline-flex;align-items:center;justify-content:center;line-height:1;border-radius:6px;"><i id="kiChatMaximizeIcon" class="bi bi-arrows-fullscreen" aria-hidden="true"></i></button>
    <button onclick="kiChatClose()" data-i18n-title="common.close" title="Schließen" style="background:none;border:none;font-size:20px;line-height:1;cursor:pointer;color:#6a665f;padding:0 2px;">&times;</button>
  </div>
  <section id="kiChatUsage" aria-label="Tokenverbrauch des aktuellen Chats" data-i18n-aria-label="ki_chat.usage.aria_label">
    <div class="ki-chat-usage-heading">
      <i class="bi bi-lightning-charge-fill" aria-hidden="true"></i>
      <span data-i18n="ki_chat.usage.heading">Tokenverbrauch</span>
      <span class="ki-chat-usage-scope" data-i18n="ki_chat.usage.scope">Chat gesamt</span>
      <span id="kiChatUsageState" class="ki-chat-usage-state" aria-live="polite" data-i18n="ki_chat.usage.current">Aktuell</span>
    </div>
    <div class="ki-chat-usage-grid">
      <div class="ki-chat-usage-metric ki-chat-usage-metric--input" data-i18n-title="ki_chat.usage.input_title" title="Vom Modell verarbeitete Input-Tokens">
        <span class="ki-chat-usage-metric-label"><i class="bi bi-arrow-down" aria-hidden="true"></i><span data-i18n="ki_chat.usage.input">Input</span></span>
        <strong id="kiChatUsageInput" class="ki-chat-usage-value">0</strong>
      </div>
      <div class="ki-chat-usage-metric ki-chat-usage-metric--output" data-i18n-title="ki_chat.usage.output_title" title="Vom Modell erzeugte Output-Tokens">
        <span class="ki-chat-usage-metric-label"><i class="bi bi-arrow-up" aria-hidden="true"></i><span data-i18n="ki_chat.usage.output">Output</span></span>
        <strong id="kiChatUsageOutput" class="ki-chat-usage-value">0</strong>
      </div>
      <div class="ki-chat-usage-metric ki-chat-usage-metric--total" data-i18n-title="ki_chat.usage.total_title" title="Input- und Output-Tokens zusammen">
        <span class="ki-chat-usage-metric-label"><i class="bi bi-diamond-fill" aria-hidden="true"></i><span data-i18n="ki_chat.usage.total">Gesamt</span></span>
        <strong id="kiChatUsageTotal" class="ki-chat-usage-value">0</strong>
      </div>
      <div class="ki-chat-usage-metric ki-chat-usage-metric--duration" data-i18n-title="ki_chat.usage.duration_title" title="Summierte Dauer der KI-Aufrufe in diesem Chat">
        <span class="ki-chat-usage-metric-label"><i class="bi bi-stopwatch" aria-hidden="true"></i><span data-i18n="ki_chat.usage.duration">Dauer</span></span>
        <strong id="kiChatUsageDuration" class="ki-chat-usage-value">0,0 s</strong>
      </div>
    </div>
  </section>
  <div id="kiChatSourcesPanel" style="display:none">
    <i class="bi bi-database-check" aria-hidden="true"></i>
    <span data-i18n="ki_chat.sources_heading">Wissensquellen</span>
    <span id="kiChatSourcesCount">0</span>
    <div id="kiChatSourcesChips" style="display:contents"></div>
  </div>
  <div id="kiChatMessagesWrap">
    <div id="kiChatMessages"></div>
    <div class="sl-scroll-track" id="kiChatMessagesScrollTrack" data-always-visible="true"><div class="sl-scroll-thumb" id="kiChatMessagesScrollThumb"></div></div>
  </div>
  <div id="kiChatSuggestions" style="display:flex;gap:6px;padding:0 14px 8px;flex-wrap:wrap;flex-shrink:0;"></div>
  <div id="kiChatAttachmentStrip" aria-label="Bildanhänge für die nächste Nachricht">
    <div id="kiChatAttachmentStripHead">
      <i class="bi bi-paperclip" aria-hidden="true"></i>
      <span data-i18n="ki_chat.attachments.preview_heading">Anhänge</span>
      <button type="button" id="kiChatAttachmentStripClear" data-i18n="ki_chat.attachments.preview_clear_all" onclick="__kiChatClearAttachments()">Alle entfernen</button>
    </div>
    <div id="kiChatAttachmentList"></div>
  </div>
  <div id="kiChatInputFooter" class="ki-chat-input-footer">
    <div class="ki-chat-input-left-tools">
      <button id="kiChatAttachBtn" type="button" class="ki-chat-icon-btn"
              data-i18n-title="ki_chat.attachments.add_button_title" title="Bild anhängen"
              aria-label="Bild anhängen" onclick="__kiChatOpenBrowser()">
        <i class="bi bi-plus-lg" aria-hidden="true"></i>
      </button>
    </div>
    <textarea id="kiChatInput" rows="2" placeholder="Frage oder Anweisung…"
              class="ki-chat-input"
              onkeydown="if((event.key==='Enter'||event.key==='Return')&&!event.shiftKey&&!event.isComposing){event.preventDefault();kiChatSend();}"></textarea>
    <button id="kiChatSendBtn" onclick="kiChatSend()" class="ki-chat-send-btn">
      <i class="bi bi-send-fill"></i>
    </button>
  </div>
</div>

<div id="kiChatTaskbar" data-ki-chat-taskbar style="display:none;position:fixed;bottom:0;right:0;width:300px;height:46px;z-index:9998;background:#faf8f3;border:1.5px solid #ddd7cb;border-bottom:none;border-right:none;border-radius:14px 14px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.18);overflow:hidden;">
  <button id="kiChatTaskbarRestoreBtn" type="button" onclick="kiChatRestoreFromMinimize()" title="Wiederherstellen" aria-label="KI-Chat wiederherstellen"
          style="display:flex;align-items:center;gap:8px;width:calc(100% - 78px);height:100%;padding:0 12px;border:none;background:transparent;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;color:#1f1f1f;flex-direction:row;justify-content:flex-start;">
    <i class="bi bi-chat-dots-fill" style="color:#7c5cbf;font-size:16px;flex-shrink:0;" aria-hidden="true"></i>
    <span style="flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">KI Chat</span>
  </button>
  <button id="kiChatTaskbarMaximizeBtn" type="button" onclick="kiChatRestoreAndMaximize()" title="Maximieren" aria-label="KI-Chat maximieren"
          style="position:absolute;top:0;right:46px;width:32px;height:100%;border:none;background:transparent;cursor:pointer;color:#6a665f;font-size:14px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center;">
    <i class="bi bi-arrows-fullscreen" aria-hidden="true"></i>
  </button>
  <button id="kiChatTaskbarCloseBtn" type="button" onclick="kiChatCloseFromMinimized()" title="Schließen" aria-label="KI-Chat schließen"
          style="position:absolute;top:0;right:0;width:46px;height:100%;border:none;background:transparent;cursor:pointer;color:#6a665f;font-size:20px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center;border-left:1px solid #ddd7cb;">
    <span aria-hidden="true">&times;</span>
  </button>
</div>
</th:block>

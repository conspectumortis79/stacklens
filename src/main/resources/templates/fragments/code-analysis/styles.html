<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<body>
<th:block th:fragment="styles">
<style>
  :root {
    --ca-bg:     var(--app-cream-2);
    --ca-paper:  var(--app-cream);
    --ca-ink:    var(--app-text);
    --ca-muted:  var(--app-text-muted);
    --ca-line:   var(--app-border);
    --ca-accent: var(--app-accent-purple);
    --ca-accent2: #eab308;
  }

  .ca-page { max-width: 100%; color: var(--ca-ink); }

  .ca-layout {
    display: flex;
    height: calc(100vh - 110px);
    overflow: hidden;
    gap: 0;
  }

  .ca-panel {
    width: 270px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    background: var(--ca-paper);
    border-right: 1px solid var(--ca-line);
    overflow: hidden;
    zoom: 1.05;
  }

  .ca-list-top {
    padding: 14px 16px 10px;
    flex-shrink: 0;
    border-bottom: 1px solid var(--ca-line);
  }
  .ca-list-top h2 { font-size: 13px; font-weight: 800; margin: 0; }

  .ca-repo-scroll {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: row;
    overflow: hidden;
  }
  .ca-repo-scroll-content {
    flex: 1;
    min-width: 0;
    min-height: 0;
    overflow-y: scroll;
    scrollbar-width: none;
    -ms-overflow-style: none;
    display: flex;
    flex-direction: column;
    padding: 8px 8px 8px 8px;
  }
  .ca-repo-scroll-content::-webkit-scrollbar { display: none; }

  .ca-list-sep { height: 1px; background: var(--ca-line); margin: 4px 0; }
  .ca-list-label {
    font-size: 11px; font-weight: 800; text-transform: uppercase;
    letter-spacing: .5px; color: var(--ca-muted); padding: 4px 4px 6px;
    display: flex; align-items: center; gap: 5px;
  }

  .ca-repo-card {
    padding: 10px 14px;
    cursor: pointer;
    background: var(--ca-paper);
    transition: background .15s, box-shadow .15s, transform .15s;
    will-change: transform;
    margin: 6px 0 0;
    border-radius: 7px;
    box-shadow: 0 1px 0 0 #e8e2d8, 0 2px 6px 0 rgba(90,65,25,.08);
  }
  .ca-repo-card:hover    { background: #faf6ef; transform: translateY(-2px);
    box-shadow: 0 4px 12px 0 rgba(90,65,25,.15), 0 1px 0 0 #d8d2c6; }
  .ca-repo-card.selected { background: #f0faf7;
    box-shadow: inset 3px 0 0 var(--ca-accent), 0 1px 4px 0 rgba(90,65,25,.08); }
  .ca-repo-inactive { opacity: 0.5; pointer-events: none; }
  .ca-repo-inactive .ca-btn-row button[data-action="edit"] { pointer-events: auto; cursor: pointer; }

  .ca-repo-row1 { display: flex; align-items: center; margin-bottom: 1px; }
  .ca-repo-name { font-size: 13px; font-weight: 700; color: var(--ca-ink); line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ca-repo-path { font-size: 11px; color: var(--ca-muted); font-family: monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 3px; }

  .ca-btn-row { display: flex; gap: 5px; margin-top: 7px; flex-wrap: nowrap; }
  .ca-btn-xs {
    padding: 4px 11px; font-size: 11px; border-radius: 999px; border: 1.5px solid;
    display: inline-flex; align-items: center; gap: 4px; cursor: pointer; font-weight: 700;
    background: transparent; line-height: 1.4;
  }
  .ca-btn-xs-success { background: var(--ca-accent); color: #fff; border-color: var(--ca-accent); }
  .ca-btn-xs-outline { color: #444; border-color: #bbb; background: #f5f5f5; }
  .ca-btn-xs-cancel  { color: #721c24; border-color: #e89ba4; background: #fff0f2; }

  .ca-card-status { min-height: 18px; margin: 3px 0 2px; }

  .ca-card-status-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 700;
    border-radius: 999px;
    padding: 2px 9px;
  }
  .ca-card-status--running   { color: #7a5a0a; background: #fff3cd; }
  .ca-card-status--aborted   { color: #721c24; background: #f8d7da; }
  .ca-card-status--completed { color: #155724; background: #d4edda; }

  .ca-result-panel {
    flex: 1;
    min-width: 0;
    background: var(--ca-paper);
    overflow-y: auto;
  }


  .ca-result-sticky-top { position: sticky; top: 0; z-index: 3; background: var(--ca-paper); }

  .ca-result-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--ca-line);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    background: var(--ca-paper);
  }

  .ca-tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border-bottom: 1px solid var(--ca-line);
    background: var(--ca-paper);
    padding: 0 16px;
  }

  .ca-tab-btn {
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ca-muted);
    background: transparent;
    border: none;
    border-bottom: 2.5px solid transparent;
    cursor: pointer;
    white-space: nowrap;
    transition: color .12s;
  }
  .ca-tab-btn:hover { color: var(--ca-ink); }
  .ca-tab-btn.active { color: var(--ca-accent); border-bottom-color: var(--ca-accent); }

  .ca-tab-panel { display: none; padding: 24px; }
  .ca-tab-panel.active { display: block; }
  #tabMermaid.active { display: flex; flex-direction: column; min-height: 560px; overflow: hidden; }

  .ca-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 200px;
    color: var(--ca-muted);
    gap: 10px;
    font-size: 14px;
    text-align: center;
  }
  .ca-empty i { font-size: 2.8rem; }

  .ca-status-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
  }
  .ca-status-badge--running   { background: #fff3cd; color: #7a5a0a; }
  .ca-status-badge--completed { background: #d4edda; color: #155724; }
  .ca-status-badge--error     { background: #f8d7da; color: #721c24; }

  .ca-ctx-item {
    padding: 8px 16px; cursor: pointer; font-size: 13px;
    display: flex; align-items: center; gap: 8px;
    border-radius: 8px; margin: 0 2px; transition: background .12s;
  }
  .ca-ctx-item:hover { background: #f0f7f4; }

  .ca-finding-card {
    border: 1px solid var(--ca-line);
    border-radius: 12px;
    background: var(--ca-paper);
    padding: 14px 16px;
    margin-bottom: 10px;
  }

  .ca-finding-header {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }

  .ca-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .ca-prose { line-height: 1.7; font-size: 14px; }
  .ca-prose h3 { font-size: 15px; margin-top: 20px; border-bottom: 1px solid var(--ca-line); padding-bottom: 4px; }
  .ca-prose p  { margin-bottom: .6rem; }
  .ca-prose code { font-size: 12px; background: var(--ca-bg); color: var(--ca-ink); padding: 1px 5px; border-radius: 4px; }

  .ca-code-block {
    background: #1e1e2e;
    color: #cdd6f4;
    border-radius: 10px;
    padding: 14px;
    font-size: 12px;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-all;
    font-family: monospace;
  }

  @media (max-width: 900px) {
    .ca-layout { flex-direction: column; height: auto; }
    .ca-panel { width: 100%; max-width: none; border-right: none; border-bottom: 1px solid var(--ca-line); }
  }
  #caMermaidContainer, #caMermaidFullContainer, #caDrawioContainer, #caDrawioFullContainer {
    contain: content;
  }

  .ca-diagram-bg {
    background: #ffffff;
    border: 1px solid var(--ca-line);
    border-radius: 12px;
  }

  .ca-gitlab-header {
    background: var(--ca-bg);
    transition: background .15s;
  }
  .ca-gitlab-header:hover { background: var(--ca-paper); }

  .ca-gh-accordion-header {
    background: var(--ca-bg);
    transition: background .15s;
  }
  .ca-gh-accordion-header:hover { background: var(--ca-paper); }
</style>
</th:block>
</body>
</html>

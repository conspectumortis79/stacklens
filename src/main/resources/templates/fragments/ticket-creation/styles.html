<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<body>
<th:block th:fragment="styles">
<style>
  :root {
    --tc-bg:      var(--app-cream-2);
    --tc-paper:   var(--app-cream);
    --tc-ink:     var(--app-text);
    --tc-muted:   var(--app-text-muted);
    --tc-line:    var(--app-border);
    --tc-accent:  var(--app-accent-purple, #7c5cbf);
    --tc-accent2: var(--app-accent-blue, #5b8ef0);
    --tc-ok:      #16a34a;
    --tc-warn:    #d97706;
    --tc-fail:    #b91c1c;
  }

  .tc-page { color: var(--tc-ink); display:flex; flex-direction:column; gap:16px; padding-bottom:32px; }

  .tc-card {
    background: var(--tc-paper);
    border: 1px solid var(--tc-line);
    border-radius: 16px;
    padding: 22px;
    box-shadow: 0 6px 18px rgba(0,0,0,.06);
  }
  .tc-card-title {
    margin: 0 0 14px;
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--tc-ink);
    display:flex; align-items:center; justify-content:space-between;
  }

  .tc-form { display:flex; flex-direction:column; gap:14px; }
  .tc-row { display:flex; flex-direction:column; gap:6px; }
  .tc-label {
    font-size: .82rem; font-weight: 600; color: var(--tc-muted);
    display:flex; align-items:center; justify-content:space-between;
  }
  .tc-input {
    background: var(--tc-bg);
    border: 1px solid var(--tc-line);
    border-radius: 10px;
    padding: 9px 12px;
    color: var(--tc-ink);
    font-size: .95rem;
    width: 100%;
    box-sizing: border-box;
    transition: border-color .15s, box-shadow .15s;
  }
  .tc-input:focus { outline:none; border-color: var(--tc-accent); box-shadow: 0 0 0 3px rgba(124,92,191,.18); }
  .tc-textarea {
    font-size: .95rem;
    resize: vertical;
    min-height: 200px;
    line-height: 1.6;
  }

  .tc-textarea-wrap {
    display: flex;
    overflow: hidden;
    background: var(--tc-bg);
    border: 1px solid var(--tc-line);
    border-radius: 10px;
    width: 100%;
    box-sizing: border-box;
    transition: border-color .15s, box-shadow .15s;
    resize: vertical;
    min-height: 200px;
  }
  .tc-textarea-wrap:focus-within {
    border-color: var(--tc-accent);
    box-shadow: 0 0 0 3px rgba(124,92,191,.18);
  }

  .tc-textarea-wrap.tc-subtask-desc-wrap {
    min-height: 0;
    resize: vertical;
    border-radius: 6px;
  }
  .tc-textarea-wrap.tc-subtask-desc-wrap:focus-within {
    box-shadow: 0 0 0 2px rgba(124,92,191,.18);
  }
  .tc-textarea-box {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    color: var(--tc-ink);
    padding: 9px 12px;
    font-size: .95rem;
    line-height: 1.6;
    box-sizing: border-box;
    resize: none;
    overflow-y: scroll;
    scrollbar-width: none;
    -ms-overflow-style: none;
    font-family: inherit;
  }
  .tc-textarea-box::-webkit-scrollbar { display: none; }

  .tc-textarea-wrap .sl-scroll-track {
    background: var(--tc-bg);
    border-left-color: var(--tc-line);
  }
  .tc-textarea-wrap .sl-scroll-thumb {
    background: var(--tc-line);
  }
  .tc-textarea-wrap .sl-scroll-thumb:hover,
  .tc-textarea-wrap .sl-scroll-thumb.dragging {
    background: var(--tc-accent);
    cursor: grabbing;
  }
  html[data-theme="dark"] .tc-textarea-wrap .sl-scroll-thumb,
  html[data-theme="popos"] .tc-textarea-wrap .sl-scroll-thumb {
    background: rgba(255,255,255,0.15);
  }
  html[data-theme="dark"] .tc-textarea-wrap:focus-within,
  html[data-theme="popos"] .tc-textarea-wrap:focus-within {
    box-shadow: 0 0 0 3px rgba(124,92,191,.22);
  }

  .tc-hint {
    font-size: .78rem; color: var(--tc-muted); margin-top: 2px;
  }

  .tc-upload-zone {
    border: 2px dashed var(--tc-line);
    border-radius: 10px;
    padding: 16px 12px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    background: var(--tc-bg);
  }
  .tc-upload-zone:hover {
    border-color: var(--tc-accent);
    background: rgba(124,92,191,.04);
  }
  .tc-file-row-selected {
    background: rgba(124,92,191,.08);
    outline: 2px solid var(--tc-accent);
    outline-offset: -2px;
  }
  .tc-upload-icon { font-size: 1.5rem; color: var(--tc-muted); display: block; margin-bottom: 4px; }
  .tc-upload-text { font-size: .85rem; color: var(--tc-muted); }
  .tc-file-chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .tc-file-chip {
    display:inline-flex; align-items:center; gap:5px;
    background: rgba(124,92,191,.1); color: var(--tc-accent);
    border-radius: 999px; padding: 3px 10px 3px 8px;
    font-size: .78rem; font-weight: 600;
  }
  .tc-file-chip-del {
    background: none; border: none; cursor: pointer;
    color: var(--tc-muted); padding: 0; line-height: 1;
    font-size: .9rem; transition: color .1s;
  }
  .tc-file-chip-del:hover { color: var(--tc-fail); }

  .tc-actions { flex-direction:row; justify-content:flex-end; gap:8px; }
  .tc-btn {
    border:none; border-radius: 10px; padding: 9px 18px; font-weight: 600;
    cursor: pointer; font-size: .9rem;
    transition: transform .08s, filter .15s, opacity .15s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .tc-btn:disabled { opacity:.5; cursor:not-allowed; }
  .tc-btn:not(:disabled):active { transform: translateY(1px); }
  .tc-btn-primary {
    background: linear-gradient(135deg, var(--tc-accent), var(--tc-accent2));
    color: #fff;
  }
  .tc-btn-primary:not(:disabled):hover { filter: brightness(1.05); }
  .tc-btn-cancel {
    background: var(--tc-fail);
    color: #fff;
  }
  .tc-btn-cancel:not(:disabled):hover { filter: brightness(1.1); }
  .tc-btn-cancel:disabled { opacity: .4; }
  .tc-btn-secondary {
    background: var(--tc-bg);
    color: var(--tc-ink);
    border: 1px solid var(--tc-line);
  }
  .tc-btn-secondary:not(:disabled):hover { border-color: var(--tc-accent); color: var(--tc-accent); }
  .tc-btn-create {
    background: linear-gradient(135deg, var(--tc-ok), #15803d);
    color: #fff;
  }
  .tc-btn-create:not(:disabled):hover { filter: brightness(1.07); }

  .tc-progress-card { padding: 16px 22px; }
  .tc-progress-header {
    display: flex; align-items: center; gap: 10px;
    font-weight: 600; font-size: .9rem; color: var(--tc-accent);
  }
  @keyframes tc-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .tc-progress-spin { font-size: 1.1rem; animation: tc-spin 1.2s linear infinite; display: inline-block; }
  .tc-progress-step { font-size: .82rem; color: var(--tc-muted); margin-top: 6px; padding-left: 26px; }

  #tcResultContent, #tcResultContent * {
    -webkit-user-select: text;
    user-select: text;
  }

  .tc-result-meta {
    display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; align-items: center;
  }
  .tc-result-type-badge {
    font-size: .72rem; font-weight: 700; padding: 3px 10px; border-radius: 999px;
    background: rgba(124,92,191,.12); color: var(--tc-accent);
    letter-spacing: .04em;
  }
  .tc-result-label {
    font-size: .72rem; font-weight: 600; padding: 3px 9px; border-radius: 999px;
    background: rgba(91,142,240,.1); color: var(--tc-accent2);
  }
  .tc-result-summary {
    font-size: 1.05rem; font-weight: 700; color: var(--tc-ink);
    margin-bottom: 16px; line-height: 1.4;
  }

  .tc-jira-ticket {
    border: 1px solid var(--tc-line);
    border-radius: 12px;
    overflow: hidden;
    background: var(--tc-bg);
  }
  .tc-jira-header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px;
    background: rgba(9,30,66,.04);
    border-bottom: 1px solid var(--tc-line);
    font-size: .82rem; color: var(--tc-muted);
  }
  .tc-jira-issue-icon { font-size: 1rem; color: var(--tc-accent); }
  .tc-jira-issue-type { font-weight: 600; color: var(--tc-ink); }
  .tc-jira-body { padding: 16px; }
  .tc-jira-summary-line {
    font-size: 1.15rem; font-weight: 700; color: var(--tc-ink);
    margin-bottom: 16px; line-height: 1.4;
  }
  .tc-jira-section {
    border: 1px solid var(--tc-line);
    border-left-width: 4px;
    border-radius: 10px;
    margin: 10px 0;
    overflow: hidden;
  }
  .tc-jira-section:first-child { margin-top: 0; }
  .tc-jira-section-head {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 12px;
    background: rgba(9,30,66,.04);
    border-bottom: 1px solid var(--tc-line);
    font-weight: 700; font-size: .88rem; color: var(--tc-ink);
  }
  .tc-jira-section-body { padding: 8px 14px 10px; font-size: .9rem; line-height: 1.65; }
  .tc-jira-section--story  { border-left-color: var(--tc-accent); }
  .tc-jira-section--ac     { border-left-color: var(--tc-ok); }
  .tc-jira-section--ac .tc-jira-section-head { background: rgba(22,163,74,.07); }
  .tc-jira-section--bg     { border-left-color: var(--tc-accent2); }
  .tc-jira-section--other  { border-left-color: var(--tc-muted); }

  .tc-open-points {
    border: 1px solid rgba(217,119,6,.35);
    border-left: 4px solid var(--tc-warn);
    border-radius: 10px; margin: 12px 0; overflow: hidden;
  }
  .tc-open-points-head {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 12px;
    background: rgba(217,119,6,.07);
    border-bottom: 1px solid rgba(217,119,6,.2);
    font-weight: 700; font-size: .88rem; color: var(--tc-warn);
  }
  .tc-open-points-list { margin: 0; padding: 8px 12px 8px 34px; }
  .tc-open-points-list li { font-size: .88rem; margin-bottom: 3px; }

  .tc-subtasks {
    border: 1px solid rgba(124,92,191,.30);
    border-left: 4px solid var(--tc-accent);
    border-radius: 10px; margin: 12px 0; overflow: hidden;
  }
  .tc-subtasks-head {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 12px;
    background: rgba(124,92,191,.07);
    border-bottom: 1px solid rgba(124,92,191,.20);
    font-weight: 700; font-size: .88rem; color: var(--tc-accent);
  }
  .tc-subtasks-list { display: flex; flex-direction: column; gap: 8px; padding: 10px; }
  .tc-subtask-card {
    background: var(--tc-paper);
    border: 1px solid var(--tc-line);
    border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px;
  }
  .tc-subtask-head {
    display: flex; align-items: center; gap: 8px; color: var(--tc-muted); font-size: .8rem;
  }
  .tc-subtask-type { font-weight: 700; color: var(--tc-accent); }
  .tc-subtask-priority { margin-left: auto; opacity: .75; }
  .tc-subtask-remove {
    margin-left: 6px; background: transparent; border: 0; cursor: pointer;
    color: var(--tc-fail); padding: 2px 6px; border-radius: 4px; line-height: 1;
  }
  .tc-subtask-remove:hover { background: rgba(185,28,28,.12); }
  .tc-subtask-summary,
  .tc-subtask-description {
    width: 100%; resize: vertical;
    border: 1px solid var(--tc-line); border-radius: 6px;
    padding: 6px 8px; font-family: inherit; font-size: .88rem;
    background: var(--tc-bg); color: var(--tc-ink);
  }
  .tc-subtask-summary { font-weight: 600; }
  .tc-subtask-description { font-family: var(--app-font-mono, monospace); font-size: .82rem; }

  .tc-subtask-desc-wrap > .tc-subtask-description {
    border: none;
    background: transparent;
    padding: 6px 8px;
    line-height: 1.5;
  }
  .tc-subtask-labels { display: flex; flex-wrap: wrap; gap: 4px; }
  .tc-subtask-label {
    font-size: .72rem; padding: 1px 7px; border-radius: 8px;
    background: var(--tc-accent2); color: #fff;
  }

  .tc-create-row { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; }
  .tc-create-field { display:flex; flex-direction:column; gap:5px; flex: 1; min-width: 160px; }
  .tc-create-label { font-size: .78rem; font-weight: 600; color: var(--tc-muted); }
  .tc-status-ok   { color: var(--tc-ok);   font-size: .85rem; font-weight: 600; }
  .tc-status-fail { color: var(--tc-fail);  font-size: .85rem; font-weight: 600; }

  .tc-required-fields:empty { display: none; }
  .tc-required-fields { margin-top: 12px; }
  .tc-required-fields .tc-create-row { align-items: flex-start; }
  .tc-required-fields .tc-create-field { flex: 0 1 280px; }
  .tc-required-mark { color: var(--tc-fail); margin-left: 2px; }
  .tc-required-note { font-size: .8rem; color: var(--tc-muted); margin: 0 0 8px; }
  .tc-check-group {
    display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0; padding: 7px 10px;
    border: 1px solid var(--tc-line); border-radius: 8px;
  }
  .tc-check-group.tc-input--invalid { border-color: var(--tc-fail); }
  .tc-check-option {
    display: inline-flex; align-items: center; gap: 6px; min-height: 32px;
    font-size: .85rem; color: var(--tc-ink); cursor: pointer;
  }
  .tc-check-option input { width: 16px; height: 16px; cursor: pointer; }
  .tc-check-option input:focus-visible { outline: 2px solid var(--tc-accent); outline-offset: 2px; }

  .tc-input--invalid {
    border-color: var(--tc-fail) !important;
    box-shadow: 0 0 0 3px rgba(185,28,28,.18) !important;
    animation: tc-shake .35s ease;
  }
  @keyframes tc-shake {
    0%, 100% { transform: translateX(0); }
    25%       { transform: translateX(-5px); }
    75%       { transform: translateX(5px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .tc-input--invalid { animation: none; }
  }

  .tc-md-h2 { font-size: 1rem; font-weight: 700; color: var(--tc-ink); margin: 12px 0 4px; padding-bottom: 3px; border-bottom: 2px solid var(--tc-accent); }
  .tc-md-h2:first-child { margin-top: 0; }
  .tc-md-h3 { font-size: .9rem; font-weight: 700; color: var(--tc-ink); margin: 8px 0 3px; }
  .tc-md-p { margin: 0 0 5px; }
  .tc-md-p:last-child { margin-bottom: 0; }
  .tc-md-ul, .tc-md-ol { margin: 3px 0 7px; padding-left: 22px; }
  .tc-md-ul li, .tc-md-ol li { margin-bottom: 2px; line-height: 1.55; }
  .tc-md-code { background: rgba(9,30,66,.08); border-radius: 3px; font-family: ui-monospace, monospace; font-size: .83em; padding: 1px 4px; }
  .tc-md-hr { border: none; border-top: 1px solid var(--tc-line); margin: 8px 0; }
  .tc-md-bq { border-left: 3px solid var(--tc-accent); padding: 3px 10px; margin: 6px 0; color: var(--tc-muted); font-style: italic; }

  .tc-issue-type-seg {
    display: flex;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--tc-line);
    height: 34px;
  }
  .tc-issue-type-btn {
    flex: 1;
    border: none;
    background: var(--tc-paper);
    padding: 4px 10px;
    font-size: .82rem;
    font-weight: 500;
    cursor: pointer;
    color: var(--tc-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    transition: background .12s, color .12s;
    white-space: nowrap;
  }
  .tc-issue-type-btn + .tc-issue-type-btn { border-left: 1px solid var(--tc-line); }
  .tc-issue-type-btn:hover { background: rgba(0,0,0,.05); }
  .tc-issue-type-btn.active.tc-it-story { background: rgba(124,92,191,.15); color: var(--tc-accent); }
  .tc-issue-type-btn.active.tc-it-task  { background: rgba(39,174,96,.12); color: var(--tc-ok); }
  .tc-issue-type-btn.active.tc-it-bug   { background: rgba(220,53,69,.12); color: var(--tc-fail); }

  .tc-error { color: var(--tc-fail); font-size: .88rem; font-weight: 600; padding: 8px 0; }

</style>
</th:block>
</body>
</html>

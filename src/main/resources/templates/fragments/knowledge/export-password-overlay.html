<!DOCTYPE html>
<html xmlns:th="http://www.ultraq.net.nz/thymeleaf/layout" lang="de">
<body>
<th:block th:fragment="export-password-overlay">
    <div class="modal" id="kbExportPasswordModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-shield-lock me-2" style="color:var(--ns-accent,#7c5cbf);"></i>
                        <span data-i18n="knowledge.export.password_title">Archiv-Passwort</span>
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted small mb-3" data-i18n="knowledge.export.password_help">
                        Das Export-Archiv wird mit AES-256-GCM verschlüsselt. Bitte ein Passwort wählen, das du beim Import wieder eingeben kannst.
                    </p>
                    <label for="kbExportPasswordInput" class="form-label fw-semibold" data-i18n="knowledge.export.password_label">Passwort</label>
                    <input type="password"
                           id="kbExportPasswordInput"
                           class="form-control"
                           autocomplete="new-password"
                           placeholder="Mindestens 8 Zeichen"/>
                    <div class="form-check mt-3">
                        <input class="form-check-input" type="checkbox" id="kbExportShowPassword"/>
                        <label class="form-check-label" for="kbExportShowPassword" data-i18n="knowledge.export.show_password">Passwort anzeigen</label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal" data-i18n="common.cancel">Abbrechen</button>
                    <button id="kbExportPasswordConfirm" type="button" class="btn btn-sm btn-primary" onclick="kbConfirmExportPassword()">
                        <i class="bi bi-download me-1"></i><span data-i18n="knowledge.export.download">Herunterladen</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>

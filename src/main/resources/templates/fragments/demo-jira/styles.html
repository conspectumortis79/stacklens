<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<body>
<th:block th:fragment="styles">
<style>
  :root {
    --djira-bg:      var(--app-cream-2);
    --djira-paper:   var(--app-cream);
    --djira-ink:     var(--app-text);
    --djira-muted:   var(--app-text-muted);
    --djira-line:    var(--app-border);
    --djira-accent:  var(--app-accent-blue, #0052cc);
    --djira-ok:      #16a34a;
    --djira-warn:    #d97706;
    --djira-fail:    #b91c1c;
  }

  .djira-page {
    color: var(--djira-ink);
    background: var(--djira-bg);
    padding: 8px 0 32px;
    display: flex; flex-direction: column; gap: 16px;
  }

  .djira-header {
    background: var(--djira-paper);
    border: 1px solid var(--djira-line);
    border-radius: 12px;
    padding: 18px 22px;
  }
  .djira-issue-key {
    font-size: .82rem; font-weight: 600;
    color: var(--djira-muted);
    margin-bottom: 4px;
    letter-spacing: .03em;
  }
  .djira-issue-title {
    font-size: 1.45rem; font-weight: 600;
    margin: 0 0 10px;
    color: var(--djira-ink);
  }
  .djira-issue-meta {
    display: flex; align-items: center; gap: 10px;
    font-size: .85rem; color: var(--djira-muted);
    flex-wrap: wrap;
  }
  .djira-pill {
    display: inline-flex; align-items: center;
    padding: 2px 10px;
    border-radius: 999px;
    font-weight: 600; font-size: .72rem;
    text-transform: uppercase; letter-spacing: .04em;
    background: var(--djira-line);
    color: var(--djira-ink);
  }
  .djira-pill--type { background: rgba(0,82,204,.12); color: var(--djira-accent); }
  .djira-pill--status { background: rgba(23,43,77,.08); color: #42526e; }
  .djira-meta-item {
    display: inline-flex; align-items: center; gap: 4px;
  }

  .djira-toolbar {
    display: flex; align-items: center; gap: 12px;
    background: var(--djira-paper);
    border: 1px solid var(--djira-line);
    border-radius: 10px;
    padding: 6px 12px;
  }
  .djira-toolbar-label {
    font-size: .78rem; font-weight: 600;
    color: var(--djira-muted);
    text-transform: uppercase; letter-spacing: .04em;
  }
  .djira-toolbar-tabs { display: flex; gap: 4px; }
  .djira-toolbar-spacer { flex: 1; }
  .djira-toolbar-badge {
    display: inline-flex; align-items: center;
    padding: 3px 10px; border-radius: 999px;
    background: rgba(22,163,74,.12); color: var(--djira-ok);
    font-size: .75rem; font-weight: 600;
  }
  .djira-tab {
    background: transparent; border: none;
    padding: 6px 12px; border-radius: 6px;
    font-size: .85rem; cursor: pointer;
    color: var(--djira-muted);
    transition: background .15s, color .15s;
  }
  .djira-tab:hover { background: var(--djira-bg); color: var(--djira-ink); }
  .djira-tab--active {
    background: var(--djira-accent); color: #fff; font-weight: 600;
  }

  .djira-description {
    background: var(--djira-paper);
    border: 1px solid var(--djira-line);
    border-radius: 12px;
    padding: 22px 26px;
    font-size: .95rem;
    line-height: 1.55;
  }
  .djira-description h2 {
    font-size: 1.05rem; font-weight: 700;
    color: var(--djira-ink);
    margin: 16px 0 8px;
  }
  .djira-description h2:first-child { margin-top: 0; }
  .djira-rule {
    border: 0; border-top: 1px solid var(--djira-line);
    margin: 16px 0;
  }
  .djira-review-heading {
    color: var(--djira-accent);
  }
  .djira-legend {
    color: var(--djira-muted);
    margin: 4px 0 12px;
    font-size: .88rem;
  }
  .djira-original-desc {
    background: var(--djira-bg);
    border-radius: 8px;
    padding: 10px 14px;
    white-space: pre-wrap;
    font-size: .88rem;
    color: var(--djira-ink);
    margin: 0;
  }
  .djira-raw-json {
    background: var(--djira-bg);
    border: 1px solid var(--djira-line);
    border-radius: 8px;
    padding: 14px;
    overflow-x: auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .8rem;
    white-space: pre;
    margin: 0;
  }

  .djira-empty-state {
    background: var(--djira-paper);
    border: 1px dashed var(--djira-line);
    border-radius: 12px;
    padding: 24px;
    text-align: center;
    color: var(--djira-muted);
  }

  .djira-table-wrap {
    overflow-x: auto;
    border: 1px solid var(--djira-line);
    border-radius: 10px;
    background: var(--djira-bg);
  }
  .djira-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-size: .9rem;
  }
  .djira-table th, .djira-table td {
    border-bottom: 1px solid var(--djira-line);
    padding: 10px 14px;
    text-align: left;
    vertical-align: top;
  }
  .djira-table thead th {
    background: var(--djira-paper);
    font-weight: 700;
    color: var(--djira-muted);
    font-size: .78rem;
    text-transform: uppercase;
    letter-spacing: .05em;
  }
  .djira-table tbody tr:last-child td { border-bottom: 0; }
  .djira-table tbody tr:hover { background: var(--djira-paper); }
  .djira-table a { color: var(--djira-accent); text-decoration: none; font-weight: 700; }
  .djira-table a:hover { text-decoration: underline; }
  .djira-table .djira-summary { margin-top: 6px; font-size: .85rem; }
  .djira-table ul { margin: 4px 0 0; padding-left: 18px; }
  .djira-table li { margin-bottom: 2px; font-size: .82rem; }
</style>
</th:block>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Simulierter Merge Request · StackLens</title>
    <link rel="stylesheet" th:href="@{/vendor/css/bootstrap-icons.min.css}"/>
    <style>
        :root {
            --gl-bg:           #f0f0f0;
            --gl-white:        #fff;
            --gl-header-bg:    #1f1f1f;
            --gl-orange:       #fc6d26;
            --gl-purple:       #6b4fbb;
            --gl-green:        #108548;
            --gl-red:          #ae1800;
            --gl-blue:         #1068bf;
            --gl-border:       #dcdcde;
            --gl-text:         #1f2328;
            --gl-muted:        #64686f;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 14px;
            color: var(--gl-text);
            background: var(--gl-bg);
            min-height: 100vh;
        }
        .gl-nav {
            background: var(--gl-header-bg);
            height: 48px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 200;
        }
        .gl-nav-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            font-weight: 600;
            font-size: 15px;
            text-decoration: none;
            flex-shrink: 0;
        }
        .gl-nav-divider { width: 1px; height: 22px; background: #3f3f3f; flex-shrink: 0; }
        .gl-breadcrumb {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #b0b0b0;
            font-size: 13px;
            flex: 1;
            min-width: 0;
            overflow: hidden;
            white-space: nowrap;
        }
        .gl-breadcrumb a { color: #d0d0d0; text-decoration: none; }
        .gl-breadcrumb a:hover { color: #fff; text-decoration: underline; }
        .gl-breadcrumb-sep { color: #686868; }
        .gl-sim-badge {
            background: var(--gl-orange);
            color: #fff;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            flex-shrink: 0;
            letter-spacing: 0.02em;
        }

        .gl-main { max-width: 1280px; margin: 0 auto; padding: 28px 20px 100px; }
        .gl-mr-card {
            background: var(--gl-white);
            border: 1px solid var(--gl-border);
            border-radius: 6px;
            padding: 22px 24px;
            margin-bottom: 16px;
        }
        .gl-mr-title-row {
            display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px;
        }
        .gl-mr-title { font-size: 20px; font-weight: 600; line-height: 1.35; flex: 1; }
        .gl-mr-iid { font-size: 18px; font-weight: 400; color: var(--gl-muted); flex-shrink: 0; margin-top: 2px; }
        .gl-status-open {
            display: inline-flex; align-items: center; gap: 7px;
            background: var(--gl-green); color: #fff;
            padding: 5px 14px; border-radius: 16px;
            font-size: 13px; font-weight: 600; flex-shrink: 0;
        }
        .gl-status-open::before {
            content: ''; width: 7px; height: 7px; border-radius: 50%;
            background: rgba(255,255,255,0.55); display: inline-block;
        }
        .gl-mr-meta {
            display: flex; flex-wrap: wrap; align-items: center;
            gap: 14px; color: var(--gl-muted); font-size: 13px;
        }
        .gl-branch-flow { display: flex; align-items: center; gap: 6px; }
        .gl-branch-tag {
            background: #f0f0ff; border: 1px solid #c5bcf5; border-radius: 4px;
            padding: 2px 9px; font-family: 'Fira Code', monospace;
            font-size: 12px; color: var(--gl-purple);
        }
        .gl-dot { color: #999; }
        .gl-desc-body { padding: 18px 20px; }
        .gl-desc-body h5 { font-size: 13px; font-weight: 700; margin: 18px 0 8px; color: var(--gl-text); }
        .gl-desc-body h5:first-child { margin-top: 0; }
        .gl-desc-body pre {
            background: #f8f8fa; border: 1px solid #e5e5ea; border-radius: 4px;
            padding: 10px 12px; font-size: 12px;
            font-family: 'Fira Code', monospace; white-space: pre-wrap;
            overflow-x: auto; margin: 6px 0;
        }
        .gl-desc-body p { margin: 6px 0; line-height: 1.6; }
        .gl-card {
            background: var(--gl-white);
            border: 1px solid var(--gl-border);
            border-radius: 6px;
            margin-bottom: 16px;
        }
        .gl-finding-card {
            padding: 14px 18px;
            border-bottom: 1px solid var(--gl-border);
            font-size: 13px;
        }
        .gl-finding-card:last-child { border-bottom: none; }
        .gl-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 9px;
            border-radius: 999px;
            margin-right: 6px;
        }
        .gl-badge-HIGH { background: #f8d7da; color: #721c24; }
        .gl-badge-MEDIUM { background: #fff3cd; color: #7a5a0a; }
        .gl-badge-LOW { background: #d4edda; color: #155724; }
        .gl-loading { padding: 60px 20px; text-align: center; color: var(--gl-muted); }
        .gl-spinner {
            width: 32px; height: 32px; border: 3px solid #ddd;
            border-top-color: var(--gl-orange); border-radius: 50%;
            animation: gl-spin 0.8s linear infinite; margin: 0 auto 14px;
        }
        @keyframes gl-spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<nav class="gl-nav">
    <a class="gl-nav-logo" href="/">
        <i class="bi bi-stack"></i>
        StackLens
    </a>
    <span class="gl-nav-divider"></span>
    <div class="gl-breadcrumb" id="gl-breadcrumb">
        <span>Pipeline-Analyse</span>
        <span class="gl-breadcrumb-sep">›</span>
        <span>Merge Requests</span>
        <span class="gl-breadcrumb-sep">›</span>
        <span>!</span>
    </div>
    <span class="gl-sim-badge">Simuliert · StackLens</span>
</nav>

<main class="gl-main">
    <div class="gl-loading" id="gl-loading">
        <div class="gl-spinner"></div>
        <div>Merge Request wird geladen…</div>
    </div>
    <div id="gl-content" style="display:none"></div>
</main>

<script th:src="@{/js/simulated-helpers.js}"></script>
<script th:inline="javascript">
/*<![CDATA[*/
'use strict';

const ANALYSIS_ID = /*[[${analysisId}]]*/ 0;

document.addEventListener('DOMContentLoaded', function () {
    loadMr(ANALYSIS_ID);
});

async function loadMr(id) {
    try {
        const resp = await fetch('/api/pipeline-analysis/analysis/' + id + '/status');
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const data = await resp.json();
        render(data);
    } catch (e) {
        const loading = document.getElementById('gl-loading');
        if (loading) {
            loading.innerHTML =
                '<i class="bi bi-exclamation-triangle" style="font-size:40px;color:#ae1800"></i>' +
                '<br><br>Fehler beim Laden des Merge Requests:<br>' + esc(e.message);
        }
    }
}

function fmtDateTime(iso) {
    if (!iso) return '–';
    try {
        const d = new Date(iso);
        return d.toLocaleString('de-DE', { dateStyle: 'medium', timeStyle: 'short' });
    } catch (_) {
        return iso;
    }
}

function render(data) {
    const summary = txt(data.summaryText);
    const findingsJson = data.findingsJson || '[]';
    let findings = [];
    try { findings = JSON.parse(findingsJson); } catch (_) { findings = []; }

    const title = 'Pipeline-Analyse – Befunde & Optimierungen (Analysis #' + data.id + ')';
    const branch = 'pipeline-analyse-' + data.id;

    document.getElementById('gl-breadcrumb').innerHTML =
        '<a href="/pipeline-analysis">Pipeline-Analyse</a>' +
        '<span class="gl-breadcrumb-sep">›</span>' +
        '<span>Simulierter Merge Request</span>' +
        '<span class="gl-breadcrumb-sep">›</span>' +
        '<span>!' + data.id + '</span>';

    const cardHtml =
        '<div class="gl-mr-card">' +
            '<div class="gl-mr-title-row">' +
                '<div class="gl-mr-title">' + esc(title) + '</div>' +
                '<div class="gl-mr-iid">!' + data.id + '</div>' +
                '<span class="gl-status-open">Offen</span>' +
            '</div>' +
            '<div class="gl-mr-meta">' +
                '<div class="gl-branch-flow">' +
                    '<span class="gl-branch-tag">' + esc(branch) + '</span>' +
                    '<span class="gl-dot">→</span>' +
                    '<span class="gl-branch-tag">main</span>' +
                '</div>' +
                '<span>·</span>' +
                '<span>Erstellt ' + esc(fmtDateTime(data.createdAt)) + ' von StackLens AI</span>' +
            '</div>' +
        '</div>' +
        '<div class="gl-card">' +
            '<div class="gl-desc-body">' +
                '<h5>Beschreibung</h5>' +
                (summary ? '<p>' + esc(summary) + '</p>' :
                    '<p style="color:var(--gl-muted)">Keine Zusammenfassung vorhanden.</p>') +
                '<h5>Befunde (' + findings.length + ')</h5>' +
                (findings.length === 0
                    ? '<p style="color:var(--gl-muted)">Keine Befunde.</p>'
                    : findings.map(function (f) {
                        var sev = (f.severity || 'MEDIUM').toUpperCase();
                        return '<div class="gl-finding-card">' +
                            '<span class="gl-badge gl-badge-' + esc(sev) + '">' + esc(sev) + '</span>' +
                            '<span class="gl-badge" style="background:#f0e9fb;color:#5b3da5;">' + esc(f.type || 'UNKNOWN') + '</span>' +
                            (f.file ? '<code style="font-size:12px;background:#f0f0f0;padding:2px 6px;border-radius:4px;">' + esc(f.file) + (f.line ? ':' + esc(String(f.line)) : '') + '</code>' : '') +
                            '<p style="margin-top:8px;">' + esc(f.description || '') + '</p>' +
                            (f.suggestion ? '<pre style="background:#fff7ed;border-color:#f59e0b;">' + esc(f.suggestion) + '</pre>' : '') +
                        '</div>';
                    }).join('')) +
                '<h5>Marker-Datei</h5>' +
                '<p style="color:var(--gl-muted);font-size:13px;">Der Merge Request enthält die Datei <code>.stacklens/pipeline-analysis-' + data.id + '.md</code> mit einem Verweis auf diese Analyse.</p>' +
            '</div>' +
        '</div>';

    document.getElementById('gl-loading').style.display = 'none';
    const el = document.getElementById('gl-content');
    el.innerHTML = cardHtml;
    el.style.display = 'block';
}
/*]]>*/
</script>
</body>
</html>

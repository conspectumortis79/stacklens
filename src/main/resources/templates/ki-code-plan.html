<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>KI Code-Plan · StackLens</title>
    <link rel="stylesheet" th:href="@{/vendor/css/bootstrap-icons.min.css}"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg:     #0d1117;
            --paper:  #161b22;
            --line:   #30363d;
            --fg:     #e6edf3;
            --muted:  #8b949e;
            --accent: #58a6ff;
            --green:  #3fb950;
            --orange: #d29922;
            --red:    #f85149;
            --purple: #bc8cff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            font-size: 14px;
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
        }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }

        .nav {
            background: #010409;
            border-bottom: 1px solid var(--line);
            height: 48px;
            display: flex;
            align-items: center;
            padding: 0 24px;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-logo { display:flex;align-items:center;gap:8px;color:#fff;font-weight:700;font-size:15px; }
        .nav-logo i { font-size:20px;color:var(--accent); }
        .nav-divider { width:1px;height:22px;background:var(--line); }
        .nav-title { font-size:13px;color:var(--muted); }
        .nav-back { margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;cursor:pointer; }
        .nav-back:hover { color:var(--fg); }

        .page { max-width: 900px; margin: 0 auto; padding: 32px 24px 64px; }

        .plan-header {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 24px 28px;
            margin-bottom: 24px;
        }
        .plan-header-top { display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap; }
        .plan-badge { display:inline-flex;align-items:center;gap:6px;background:#1c2128;border:1px solid var(--line);border-radius:20px;padding:3px 12px;font-size:11px;font-weight:600;color:var(--accent);margin-bottom:10px; }
        .plan-title { font-size:22px;font-weight:700;line-height:1.35;color:var(--fg); }
        .plan-key { font-size:13px;color:var(--muted);margin-top:4px; }

        .section {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 12px;
            margin-bottom: 18px;
            overflow: hidden;
        }
        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 20px;
            border-bottom: 1px solid var(--line);
            font-weight: 600;
            font-size: 13px;
        }
        .section-header i { font-size: 16px; }
        .section-body { padding: 18px 20px; }

        .approach-text {
            font-size: 14px;
            line-height: 1.75;
            color: var(--fg);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .file-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
        .file-list li {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 12px;
            padding: 6px 10px;
            background: #0d1117;
            border: 1px solid var(--line);
            border-radius: 6px;
        }
        .file-list .badge-new  { color: var(--green); font-size: 10px; font-weight: 700; background:#0f2e14;border:1px solid #2d5e39;border-radius:4px;padding:1px 6px;flex-shrink:0; }
        .file-list .badge-mod  { color: var(--orange); font-size: 10px; font-weight: 700; background:#271d0a;border:1px solid #5b3b10;border-radius:4px;padding:1px 6px;flex-shrink:0; }

        .test-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
        .test-list li {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 13px;
            line-height: 1.6;
            padding: 8px 12px;
            background: #0d1117;
            border: 1px solid var(--line);
            border-radius: 6px;
        }
        .test-list li i { flex-shrink: 0; margin-top: 2px; }

        .risk-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
        .risk-list li {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 13px;
            line-height: 1.6;
            padding: 8px 12px;
            background: #1e1209;
            border: 1px solid #5b3b10;
            border-radius: 6px;
            color: #e3b341;
        }
        .risk-list li i { flex-shrink: 0; margin-top: 2px; color: var(--orange); }

        .sim-block {
            font-size: 13px;
            line-height: 1.75;
            color: var(--fg);
            background: #0d1117;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 16px 18px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        #loading { text-align: center; color: var(--muted); padding: 80px 0; font-size: 15px; }
        .spinner {
            width: 36px; height: 36px;
            border: 3px solid var(--line);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin .9s linear infinite;
            margin: 0 auto 18px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .empty { text-align: center; color: var(--muted); padding: 48px 0; }
        .empty i { font-size: 40px; display: block; margin-bottom: 12px; opacity: .4; }
    </style>
</head>
<body>

<nav class="nav">
    <span class="nav-logo"><i class="bi bi-layers-half"></i>StackLens</span>
    <span class="nav-divider"></span>
    <span class="nav-title" data-i18n="ki_code_plan.title">KI Code-Plan</span>
    <a class="nav-back" onclick="window.close()" href="#" data-i18n="common.close"><i class="bi bi-x-lg"></i>Schließen</a>
</nav>

<div class="page">
    <div id="loading">
        <div class="spinner"></div>
        Plan wird geladen…
    </div>
    <div id="content" style="display:none"></div>
</div>

<script th:src="@{/js/simulated-helpers.js}"></script>
<script th:inline="javascript">
/*<![CDATA[*/
'use strict';

const ANALYSIS_ID = /*[[${analysisId}]]*/ 0;

document.addEventListener('DOMContentLoaded', function () { load(ANALYSIS_ID); });

async function load(id) {
    try {
        const resp = await fetch('/api/ticket-implementation/' + id);
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        render(await resp.json());
    } catch (e) {
        document.getElementById('loading').innerHTML =
            '<i class="bi bi-exclamation-triangle" style="font-size:40px;color:var(--red)"></i>' +
            '<br><br>Fehler beim Laden: ' + esc(e.message);
    }
}

function render(data) {
    const plan   = data.implementationPlan || null;
    const ticket = data.ticket || {};
    const key    = data.ticketKey || ('Analyse #' + (data.id || ANALYSIS_ID));
    const summary = txt(ticket.summary) || key;

    document.title = 'KI Code-Plan · ' + key + ' · StackLens';

    if (!plan) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';
        document.getElementById('content').innerHTML =
            '<div class="empty"><i class="bi bi-journal-code"></i>' +
            'Kein KI Code-Plan für diese Analyse vorhanden.<br>' +
            '<span style="font-size:12px">(Der Plan wird nur generiert wenn ein Repository geladen werden konnte.)</span></div>';
        return;
    }

    const toModify = plan.filesToModify || [];
    const toCreate = plan.filesToCreate || [];
    const unitTests   = plan.unitTestCases   || [];
    const systemTests = plan.systemTestCases || [];
    const risks = plan.risks || [];

    let html = '';

    html += '<div class="plan-header">';
    html += '<div class="plan-header-top">';
    html += '<div>';
    html += '<div class="plan-badge"><i class="bi bi-robot"></i>KI Implementierungsplan</div>';
    html += '<div class="plan-title">' + esc(summary) + '</div>';
    html += '<div class="plan-key"><i class="bi bi-tag me-1"></i>' + esc(key) + '</div>';
    html += '</div></div></div>';

    if (plan.approach) {
        html += section(
            'bi-lightbulb', '#d29922', 'Vorgehen',
            '<div class="approach-text">' + esc(plan.approach) + '</div>'
        );
    }

    if (toModify.length || toCreate.length) {
        let fileHtml = '<ul class="file-list">';
        toModify.forEach(f => {
            fileHtml += '<li><span class="badge-mod">MODIFY</span><i class="bi bi-file-earmark-code" style="color:var(--orange)"></i>' + esc(f) + '</li>';
        });
        toCreate.forEach(f => {
            fileHtml += '<li><span class="badge-new">NEW</span><i class="bi bi-file-earmark-plus" style="color:var(--green)"></i>' + esc(f) + '</li>';
        });
        fileHtml += '</ul>';
        html += section('bi-files', 'var(--accent)', 'Betroffene Dateien (' + (toModify.length + toCreate.length) + ')', fileHtml);
    }

    if (unitTests.length) {
        let ul = '<ul class="test-list">';
        unitTests.forEach(tc => {
            ul += '<li><i class="bi bi-check2-circle" style="color:var(--green)"></i><span>' + esc(tc) + '</span></li>';
        });
        ul += '</ul>';
        html += section('bi-check2-square', 'var(--green)', 'Unit-Tests (' + unitTests.length + ')', ul);
    }

    if (systemTests.length) {
        let ul = '<ul class="test-list">';
        systemTests.forEach(tc => {
            ul += '<li><i class="bi bi-arrow-repeat" style="color:var(--purple)"></i><span>' + esc(tc) + '</span></li>';
        });
        ul += '</ul>';
        html += section('bi-arrow-repeat', 'var(--purple)', 'System- / Integrationstests (' + systemTests.length + ')', ul);
    }

    if (risks.length) {
        let ul = '<ul class="risk-list">';
        risks.forEach(r => {
            ul += '<li><i class="bi bi-exclamation-triangle-fill"></i><span>' + esc(r) + '</span></li>';
        });
        ul += '</ul>';
        html += section('bi-exclamation-triangle', 'var(--orange)', 'Risiken &amp; Randbedinungen (' + risks.length + ')', ul);
    }

    if (plan.simulationNotes) {
        html += section(
            'bi-cpu', 'var(--accent)', 'KI-Simulation / Dry-Run',
            '<div class="sim-block">' + esc(plan.simulationNotes) + '</div>'
        );
    }

    document.getElementById('loading').style.display = 'none';
    const el = document.getElementById('content');
    el.innerHTML = html;
    el.style.display = 'block';
}

function section(icon, color, title, bodyHtml) {
    return '<div class="section">' +
        '<div class="section-header"><i class="bi ' + icon + '" style="color:' + color + '"></i>' + title + '</div>' +
        '<div class="section-body">' + bodyHtml + '</div>' +
        '</div>';
}
/*]]>*/
</script>
</body>
</html>

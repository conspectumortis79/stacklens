spring:
  main:
    lazy-initialization: true
    banner-mode: ${SPRING_MAIN_BANNER_MODE:off}
  reactor:
    netty:
      shutdown-quiet-period: 1ms
      shutdown-timeout: 1ms
  mvc:
    servlet:
      load-on-startup: 1
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:${user.home}/.stacklens/data/stacklens;MODE=PostgreSQL;WRITE_DELAY=500;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
  thymeleaf:
    cache: true
  lifecycle:
    timeout-per-shutdown-phase: 200ms

server:
  shutdown: graceful

async:
  search:
    core-pool-size: 4
    max-pool-size: 8
  analysis:
    core-pool-size: 2
    max-pool-size: 4

logging:
  level:
    com.stacklens: INFO
    org.springframework.web: INFO

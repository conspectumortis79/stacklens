spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html

webclient:
  connect-timeout: 5000
  read-timeout: 5000

async:
  search:
    core-pool-size: 2
    max-pool-size: 4
  analysis:
    core-pool-size: 2
    max-pool-size: 2

copilot:
  binary: ""
  cli-bin: ""
  timeout-seconds: 30
  model: gpt-4o

stacklens:
  docker:
    auto-start:
      runner:
        enabled: false
